<!-- 已完成多玩家 HUD 調整與線上同步邏輯 -->
<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="theme-color" content="#0d0a12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>115士長乙4班格鬥大賽</title>
  <meta name="description" content="115士長乙4班格鬥大賽 — 支援 2～4 人即時連線大亂鬥、三戰兩勝制與手機橫版全螢幕虛擬按鍵操控" />
  <!-- 分享時的主標題 -->
  <meta property="og:title" content="115士長乙4班格鬥大賽" />
  <!-- 分享時的說明文字 -->
  <meta property="og:description" content="115士長乙4班格鬥大賽 — 支援 2～4 人即時連線大亂鬥、三戰兩勝制與手機橫版全螢幕虛擬按鍵操控" />
  <script src="config.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    input,
    textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    button {
      font-family: inherit;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #211829 0%, #0d0a12 75%);
      color: #f4efe6;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      max-width: 980px;
      max-height: 100vh;
    }

    /* ================= 頂部標題與快捷列 ================= */
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 2px;
      gap: 8px;
      flex-shrink: 0;
    }

    .title-bar h1 {
      font-size: clamp(15px, 2.5vw, 20px);
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffe270 0%, #ff9f1c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 #59160a);
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quick-btn {
      background: #272030;
      border: 1px solid #564769;
      color: #e9e2f2;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .quick-btn:active {
      background: #ffbe0b;
      color: #16111c;
    }

    /* ================= 舞台容器 ================= */
    .stage-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border: 3px solid #6b5642;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      background: #14101a;
      flex-shrink: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= 開戰前流程：模式 → 角色 → 房間 (三步驟分頁) ================= */
    .select-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: clamp(8px, 1.6vmin, 14px) clamp(10px, 2.2vmin, 18px);
      background: radial-gradient(120% 90% at 50% 0%, #2a1840 0%, #150e20 55%, #0c0812 100%);
      color: #f4efe6;
      overflow: hidden;
    }

    .select-overlay.hidden {
      display: none;
    }

    .wz-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 36px;
    }

    .wz-back {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1.5px solid #5b4a75;
      background: #211830;
      color: #ffd166;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .wz-back.invisible {
      display: none;
    }

    .wz-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .wz-step {
      font-size: 11px;
      font-weight: 900;
      color: #1a1216;
      background: #ffd166;
      border-radius: 99px;
      padding: 2px 9px;
      white-space: nowrap;
    }

    .wz-heading h2 {
      font-size: clamp(15px, 4.4vmin, 20px);
      color: #ffe9a8;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wz-dots {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .wz-dots i {
      width: 20px;
      height: 4px;
      border-radius: 2px;
      background: #3b2f4d;
    }

    .wz-dots i.on {
      background: #ffd166;
    }

    .wz-guide {
      font-size: 11.5px;
      color: #cbbdd6;
      min-height: 15px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wz-guide.warn {
      color: #ffa3b1;
      font-weight: 700;
    }

    .wz-page {
      flex: 1;
      min-height: 0;
      display: none;
      gap: 10px;
    }

    .wz-page.active {
      display: flex;
    }

    /* ---- 共用按鈕 ---- */
    .cta-btn {
      border: none;
      border-radius: 12px;
      padding: 8px 18px;
      min-height: 42px;
      font-size: 15px;
      font-weight: 900;
      color: #1d1206;
      background: linear-gradient(180deg, #ffd166, #f77f00);
      box-shadow: 0 3px 0 #9c4a00, 0 6px 16px rgba(247, 127, 0, 0.35);
      cursor: pointer;
      white-space: nowrap;
    }

    .cta-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #9c4a00;
    }

    .cta-btn:disabled {
      filter: grayscale(0.85) brightness(0.65);
      box-shadow: 0 3px 0 #3a3a3a;
      cursor: default;
      transform: none;
    }

    .ghost-btn {
      border: 1.5px solid #6b5890;
      border-radius: 12px;
      padding: 8px 14px;
      min-height: 42px;
      background: #231a33;
      color: #e9e2f2;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .ghost-btn:active {
      background: #3a2b55;
    }

    /* ---- 第 1 頁：模式 ---- */
    .wz-page[data-page="mode"] {
      align-items: stretch;
      justify-content: center;
      gap: clamp(8px, 2vw, 16px);
    }

    .mode-card {
      --glow: #7b2dd1;
      flex: 1;
      max-width: 300px;
      min-width: 0;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 2px solid #4a3b60;
      background: linear-gradient(160deg, #2c2040, #1a1226);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .mode-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(90% 65% at 50% 0%, var(--glow), transparent 72%);
      opacity: 0.6;
    }

    .mode-card > * {
      position: relative;
    }

    .mode-card[data-mode="online"] {
      --glow: #1d7fd1;
    }

    .mode-card[data-mode="com"] {
      --glow: #d1601d;
    }

    .mode-card:active {
      transform: scale(0.97);
      border-color: #ffd166;
    }

    .mode-card.focus {
      border-color: #ffd166;
      box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.3), 0 0 22px rgba(255, 190, 11, 0.35);
    }

    .mode-icon {
      font-size: clamp(34px, 12vmin, 60px);
      line-height: 1.1;
    }

    .mode-card strong {
      font-size: clamp(16px, 5vmin, 23px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .mode-card em {
      font-style: normal;
      font-size: 11.5px;
      color: #d6cbe3;
      line-height: 1.45;
    }

    body.touch-ui .mode-card[data-mode="pvp"] {
      display: none;
    }

    /* ---- 第 2 頁：角色 (支援後續擴充任意數量角色，自動捲動換行) ---- */
    .roster-grid {
      flex: 1.5;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(82px, 1fr);
      gap: 8px;
      overflow-y: auto;
      touch-action: pan-y;
      padding-right: 2px;
    }

    .char-card {
      position: relative;
      min-height: 0;
      padding: 0;
      border-radius: 12px;
      border: 2px solid #45385a;
      background: #1b1426 center 18% / cover no-repeat;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      color: #fff;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .char-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(10, 6, 16, 0.93) 100%);
    }

    .char-card .char-name {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 4px 8px;
      font-size: clamp(12px, 3.6vmin, 15px);
      font-weight: 900;
      text-align: left;
      text-shadow: 0 1px 3px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-card.selected {
      border-color: #ffd166;
      box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.35), 0 0 18px rgba(255, 190, 11, 0.5);
    }

    .cursor-badges {
      position: absolute;
      top: 5px;
      right: 5px;
      z-index: 1;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 99px;
      color: #fff;
    }

    .badge.p1 {
      background: #e63946;
    }

    .badge.p2 {
      background: #3a86ff;
    }

    .badge.p3 {
      background: #2dc653;
    }

    .badge.p4 {
      background: #9b5de5;
    }

    .char-detail {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(18, 12, 28, 0.85);
      border: 1.5px solid #45385a;
      border-radius: 14px;
      padding: 10px;
    }

    .char-detail-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .char-detail-name {
      font-size: clamp(17px, 5.4vmin, 24px);
      font-weight: 900;
      color: #ffe9a8;
      line-height: 1.15;
    }

    .char-detail-title {
      font-size: 12px;
      color: #ffb703;
      font-weight: 700;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #cbbdd6;
      font-weight: 700;
    }

    .stat-row b {
      width: 30px;
      flex-shrink: 0;
    }

    .stat-bar {
      flex: 1;
      height: 7px;
      border-radius: 4px;
      background: #2b2138;
      overflow: hidden;
    }

    .stat-bar i {
      display: block;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ffd166, #f77f00);
    }

    .move-list {
      font-size: 11.5px;
      line-height: 1.5;
      color: #e2daec;
    }

    .move-list .ult {
      color: #ffd166;
      font-weight: 700;
    }

    /* ---- 第 3 頁 (連線)：大廳 ---- */
    .lobby-form {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: #b8acc7;
      font-weight: 700;
    }

    .online-input {
      width: 100%;
      min-height: 40px;
      background: #140e1c;
      border: 1.5px solid #5c4973;
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    .online-input:focus {
      border-color: #ffd166;
    }

    .lobby-actions {
      display: flex;
      gap: 8px;
    }

    .lobby-actions > * {
      flex: 1;
    }

    .server-settings {
      font-size: 11px;
      color: #9a8cb0;
    }

    .server-settings summary {
      cursor: pointer;
      padding: 4px 0;
    }

    .server-settings-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .server-settings-row .ghost-btn {
      min-height: 40px;
    }

    .lobby-rooms {
      flex: 1.2;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(18, 12, 28, 0.85);
      border: 1.5px solid #45385a;
      border-radius: 14px;
      padding: 10px;
    }

    .lobby-rooms h3 {
      font-size: 13px;
      color: #ffd166;
      flex-shrink: 0;
    }

    .room-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .room-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      min-height: 44px;
      border-radius: 10px;
      border: 1.5px solid #5b4a75;
      background: #241a35;
      color: #fff;
      cursor: pointer;
      text-align: left;
      flex-shrink: 0;
    }

    .room-item:active {
      border-color: #ffd166;
    }

    .room-item .rid {
      font-size: 16px;
      font-weight: 900;
      color: #ffd166;
      white-space: nowrap;
    }

    .room-item .rmeta {
      flex: 1;
      min-width: 0;
      font-size: 11px;
      color: #cbbdd6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rstat {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .rstat.waiting {
      background: rgba(45, 198, 83, 0.18);
      color: #80ed99;
    }

    .rstat.fighting {
      background: rgba(230, 57, 70, 0.18);
      color: #ff8fa3;
    }

    .room-empty {
      color: #9a8cb0;
      font-size: 12px;
      margin: auto;
      text-align: center;
      line-height: 1.6;
    }

    .ws-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 11px;
      background: #2b1d38;
      border: 1px solid #594173;
      color: #e0d4f0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ws-status-badge[hidden] {
      display: none;
    }

    .ws-status-badge.connected {
      background: rgba(45, 198, 83, 0.18);
      border-color: #2dc653;
      color: #80ed99;
    }

    .ws-status-badge.disconnected {
      background: rgba(230, 57, 70, 0.18);
      border-color: #e63946;
      color: #ff8fa3;
    }

    /* ---- 第 3 頁：房間 ---- */
    .wz-page[data-page="room"] {
      flex-direction: column;
      gap: 8px;
    }

    .room-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .room-code {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      background: linear-gradient(135deg, #3a2757, #22173a);
      border: 1.5px solid #8463c2;
      border-radius: 12px;
      padding: 4px 10px;
    }

    .room-code span {
      font-size: 10px;
      color: #b8acc7;
      font-weight: 700;
      white-space: nowrap;
    }

    .room-code strong {
      font-size: clamp(17px, 5.6vmin, 26px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffe9a8;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 9em;
    }

    .mini-btn {
      min-height: 30px;
      padding: 2px 10px;
      border-radius: 8px;
      border: 1px solid #8463c2;
      background: rgba(20, 14, 28, 0.6);
      color: #e9e2f2;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .room-settings {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .map-options {
      display: flex;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      touch-action: pan-x;
    }

    .map-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 34px;
      background: #231a33;
      border: 2px solid #463b54;
      border-radius: 10px;
      padding: 3px 9px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      color: #cfc5dc;
      white-space: nowrap;
    }

    .map-chip.active {
      border-color: #ffbe0b;
      background: #3d2e47;
      color: #fff;
    }

    .map-chip img {
      width: 34px;
      height: 20px;
      object-fit: cover;
      border-radius: 4px;
    }

    .map-options.locked .map-chip {
      cursor: default;
    }

    .map-options.locked .map-chip:not(.active) {
      display: none;
    }

    .diff-switch-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #181220;
      border: 1px solid #524269;
      border-radius: 10px;
      padding: 3px;
      flex-shrink: 0;
    }

    .diff-label {
      font-size: 11px;
      color: #cbbdd6;
      padding: 0 5px;
      font-weight: 700;
    }

    .diff-btn {
      border: none;
      background: transparent;
      color: #b8acc7;
      font-size: 11.5px;
      font-weight: 800;
      min-height: 28px;
      padding: 3px 9px;
      border-radius: 7px;
      cursor: pointer;
    }

    .diff-btn.active[data-diff="easy"] {
      background: #2dc653;
      color: #0f1f14;
    }

    .diff-btn.active[data-diff="normal"] {
      background: #ffbe0b;
      color: #1a1216;
    }

    .diff-btn.active[data-diff="hard"] {
      background: #e63946;
      color: #ffffff;
    }

    .room-slots {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .slot-card {
      --slot: #4a3b5c;
      position: relative;
      min-height: 0;
      min-width: 0;
      padding: 0;
      border-radius: 14px;
      border: 2px solid var(--slot);
      background: #1b1326;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
      text-align: left;
    }

    .slot-card.s1 {
      --slot: #ff4d5a;
    }

    .slot-card.s2 {
      --slot: #4da3ff;
    }

    .slot-card.s3 {
      --slot: #2dc653;
    }

    .slot-card.s4 {
      --slot: #c77dff;
    }

    .slot-card.me {
      box-shadow: 0 0 16px var(--slot);
    }

    .slot-card.empty {
      border-style: dashed;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #8f81a6;
      font-size: 12px;
      font-weight: 700;
      background: rgba(27, 19, 38, 0.6);
      text-align: center;
    }

    button.slot-card.empty {
      cursor: pointer;
    }

    button.slot-card.empty:active {
      background: rgba(60, 42, 84, 0.7);
    }

    .slot-card.empty .plus {
      font-size: 28px;
      line-height: 1;
      color: var(--slot);
    }

    .slot-photo {
      position: absolute;
      inset: 0;
      background: center 18% / cover no-repeat;
    }

    .slot-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 6, 16, 0.1) 25%, rgba(10, 6, 16, 0.78) 62%, rgba(10, 6, 16, 0.97) 100%);
    }

    .slot-card.offline .slot-photo {
      filter: grayscale(1) brightness(0.55);
    }

    .slot-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 1;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--slot);
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
    }

    .slot-flags {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .slot-flag {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(0, 0, 0, 0.62);
      color: #ffd166;
      white-space: nowrap;
    }

    .slot-info {
      position: relative;
      z-index: 1;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .slot-name {
      font-size: clamp(12px, 3.8vmin, 15px);
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 3px #000;
    }

    .slot-char {
      font-size: 11px;
      color: #ffd166;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-actions {
      display: flex;
      gap: 4px;
      margin-top: 3px;
    }

    .slot-actions button {
      flex: 1;
      min-width: 0;
      min-height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 14, 28, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .slot-actions button:active {
      background: rgba(255, 209, 102, 0.35);
    }

    .room-bottom {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .room-hint {
      flex: 1;
      min-width: 0;
      font-size: 11.5px;
      color: #cbbdd6;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cta-btn.start {
      min-width: 150px;
      font-size: 16px;
    }

    /* 矮螢幕 (手機橫向 + 瀏覽器網址列) 再收緊一點 */
    @media (max-height: 340px) {
      .select-overlay {
        gap: 4px;
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .wz-header {
        min-height: 32px;
      }

      .wz-back {
        height: 32px;
      }

      .cta-btn,
      .ghost-btn {
        min-height: 38px;
      }

      .mode-card em {
        font-size: 10.5px;
      }

      .slot-actions button {
        min-height: 28px;
      }
    }

    /* 窄螢幕 (直向或小視窗)：房間席位改 2x2，設定列可換行 */
    @media (max-width: 560px) {
      .room-slots {
        grid-template-columns: repeat(2, 1fr);
      }

      .room-top {
        flex-wrap: wrap;
      }

      .wz-dots {
        display: none;
      }
    }

    /* ================= 預留虛擬按鍵操控區 (Virtual Controller Deck) ================= */
    .virtual-controller-deck {
      width: 100%;
      max-width: 960px;
      background: linear-gradient(180deg, #1b1622 0%, #120e17 100%);
      border: 2px solid #3c314a;
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* 左側虛擬搖桿 (8向滑動觸控盤) */
    .dpad-zone {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2538 0%, #191420 75%);
      border: 3px solid #524366;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(0, 0, 0, 0.6);
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dpad-cross {
      position: absolute;
      inset: 14px;
      pointer-events: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      color: #8d7ea3;
      font-size: 14px;
      font-weight: 900;
    }

    .dpad-stick {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff7582, #c9184a);
      border: 2px solid #ffd166;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      transition: transform 0.04s linear;
    }

    /* 中央資訊 / 電腦鍵盤提示區 */
    .deck-center-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      font-size: 12px;
      color: #bfb5cc;
    }

    .pc-keys-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pc-key-box {
      background: #221c2b;
      border: 1px solid #3f3452;
      border-radius: 6px;
      padding: 6px 10px;
      line-height: 1.5;
    }

    kbd {
      display: inline-block;
      background: #2f293a;
      border: 1px solid #514863;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0 5px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #fff;
      margin: 0 1px;
    }

    /* 右側街機虛擬五鍵 (含必殺技 ULT 鍵) */
    .action-buttons-zone {
      position: relative;
      width: 204px;
      height: 136px;
      flex-shrink: 0;
      touch-action: none;
    }

    .v-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.75);
      color: #fff;
      font-family: inherit;
      font-weight: 900;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      touch-action: none;
      transition: transform 0.06s ease, filter 0.06s ease, box-shadow 0.15s ease;
    }

    .v-btn small {
      font-size: 8px;
      opacity: 0.88;
      font-weight: 700;
    }

    .v-btn:active,
    .v-btn.pressed {
      transform: scale(0.90);
      filter: brightness(1.25);
    }

    /* 鑽石型街機鍵位 + 左上超必殺技鍵 */
    .v-btn.btn-light {
      left: 34px;
      top: 42px;
      background: radial-gradient(circle at 30% 30%, #4cc9f0, #0077b6);
    }

    .v-btn.btn-heavy {
      left: 90px;
      top: 6px;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #ffbe0b, #d90429);
      border-color: #fff3b0;
    }

    .v-btn.btn-jump {
      left: 90px;
      bottom: 2px;
      background: radial-gradient(circle at 30% 30%, #52b788, #1b4332);
    }

    .v-btn.btn-dash {
      right: 2px;
      top: 42px;
      background: radial-gradient(circle at 30% 30%, #b5179e, #560bad);
    }

    .v-btn.btn-ult {
      left: 0px;
      top: 0px;
      width: 54px;
      height: 54px;
      background: radial-gradient(circle at 30% 30%, #6c757d, #343a40);
      border-color: #adb5bd;
      opacity: 0.65;
    }

    .v-btn.btn-ult.ready {
      opacity: 1;
      background: radial-gradient(circle at 30% 30%, #fff3b0, #ff0054 65%, #7209b7 100%);
      border-color: #ffd166;
      box-shadow: 0 0 18px rgba(255, 190, 11, 0.95), 0 0 30px rgba(255, 0, 84, 0.7);
      animation: ultPulse 0.7s infinite alternate;
    }

    @keyframes ultPulse {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.09);
      }
    }

    body:not(.touch-ui) .dpad-zone,
    body:not(.touch-ui) .action-buttons-zone {
      display: none;
    }
    body:not(.touch-ui) .virtual-controller-deck {
      justify-content: center;
      padding: 8px 14px;
    }

    /* ================= 手機版專屬響應式調整 ================= */
    @media (max-width: 820px) {
      body {
        padding: 4px 6px;
        justify-content: flex-start;
      }

      .game-wrapper {
        height: 100%;
        gap: 6px;
      }

      .pc-keys-row {
        display: none;
        /* 手機隱藏鍵盤提示，讓虛擬按鍵區更乾淨 */
      }

      .virtual-controller-deck {
        flex: 1;
        max-height: 210px;
        padding: 8px 14px;
      }
    }

    /* 手機橫向模式：緊湊排列 */
    @media (max-height: 520px) and (orientation: landscape) {
      .title-bar {
        display: none;
      }

      .game-wrapper {
        flex-direction: row;
        align-items: stretch;
        height: 100%;
      }

      .stage-container {
        height: 100%;
        width: auto;
        flex: 1;
      }

      .virtual-controller-deck {
        width: 210px;
        max-height: none;
        flex-direction: column;
        justify-content: space-around;
        padding: 8px;
      }

      .deck-center-info {
        display: none;
      }
    }

    /* ================= v0.2 手機橫版：格鬥全螢幕 + 虛擬按鍵疊在畫面上 ================= */
    body.touch-ui {
      padding: 0;
      justify-content: center;
      background: #000;
    }

    body.touch-ui .title-bar {
      display: none;
    }

    body.touch-ui .game-wrapper {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: none;
      max-height: none;
      gap: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 舞台以 16:9 填滿螢幕 (較寬的手機左右留黑邊，按鍵可落在黑邊上) */
    body.touch-ui .stage-container {
      flex: none;
      width: min(100vw, calc(100vh * 16 / 9));
      width: min(100vw, calc(100dvh * 16 / 9));
      height: auto;
      max-width: none;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    /* 選角畫面在手機上直接使用整個螢幕 */
    body.touch-ui .select-overlay {
      position: fixed;
      inset: 0;
      padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    }

    /* 虛擬控制層：全螢幕透明疊加，只有按鍵本身吃觸控 */
    body.touch-ui .virtual-controller-deck {
      position: fixed;
      inset: 0;
      width: auto;
      max-width: none;
      max-height: none;
      display: block;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      pointer-events: none;
      z-index: 20;
    }

    body.touch-ui .deck-center-info {
      display: none;
    }

    body.touch-ui .dpad-zone {
      position: absolute;
      left: calc(env(safe-area-inset-left, 0px) + 22px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      width: 136px;
      height: 136px;
      background: radial-gradient(circle, rgba(45, 37, 56, 0.45) 0%, rgba(25, 20, 32, 0.35) 75%);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: none;
      pointer-events: auto;
    }

    body.touch-ui .dpad-cross {
      color: rgba(255, 255, 255, 0.45);
    }

    body.touch-ui .dpad-stick {
      opacity: 0.85;
    }

    body.touch-ui .action-buttons-zone {
      position: absolute;
      right: calc(env(safe-area-inset-right, 0px) + 16px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform: scale(1.15);
      transform-origin: bottom right;
      pointer-events: auto;
    }

    body.touch-ui .v-btn {
      opacity: 0.78;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
    }

    body.touch-ui .v-btn.btn-ult {
      opacity: 0.5;
    }

    body.touch-ui .v-btn.btn-ult.ready {
      opacity: 1;
    }

    @media (max-height: 380px) {
      body.touch-ui .action-buttons-zone {
        transform: scale(1);
      }

      body.touch-ui .dpad-zone {
        width: 118px;
        height: 118px;
      }
    }

    /* 戰鬥中的選單鍵 (回選角 / 房間) */
    .touch-menu-btn {
      display: none;
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 6px);
      left: calc(env(safe-area-inset-left, 0px) + 6px);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(20, 14, 28, 0.55);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      pointer-events: auto;
      cursor: pointer;
    }

    .touch-sub-btn {
      top: calc(env(safe-area-inset-top, 0px) + 46px);
      font-size: 15px;
    }

    .touch-fs-btn {
      top: calc(env(safe-area-inset-top, 0px) + 86px);
      font-size: 16px;
    }

    body.touch-ui .touch-menu-btn {
      display: block;
    }

    /* 選角畫面時隱藏虛擬按鍵，避免擋住卡片 */
    body.touch-ui.in-select .virtual-controller-deck {
      display: none;
    }

    /* 直向時提示轉橫 */
    .rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #0d0a12;
      color: #ffd166;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .rotate-hint .rotate-icon {
      font-size: 64px;
      animation: rotateHintSpin 1.6s ease-in-out infinite;
    }

    @keyframes rotateHintSpin {

      0%,
      30% {
        transform: rotate(0deg);
      }

      60%,
      100% {
        transform: rotate(90deg);
      }
    }

    @media (orientation: portrait) {
      body.touch-ui .rotate-hint {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <div class="title-bar">
      <h1>115士長乙4班格鬥大賽連線版</h1>
      <div class="top-actions">
        <button id="btnTopMute" class="quick-btn" type="button">🔊 音效</button>
        <button id="btnTopSelect" class="quick-btn" type="button">重選角色 / 房間 (C)</button>
      </div>
    </div>

    <div class="stage-container">
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <!-- 開戰前流程：1 模式 → 2 角色 → 3 房間 -->
      <div id="selectOverlay" class="select-overlay">
        <header class="wz-header">
          <button id="wzBack" class="wz-back invisible" type="button">‹ 返回</button>
          <div class="wz-heading">
            <span id="wzStep" class="wz-step">1 / 3</span>
            <h2 id="wzTitle">選擇遊戲模式</h2>
          </div>
          <span id="wsStatusBadge" class="ws-status-badge disconnected" hidden>🔴 尚未連線</span>
          <div id="wzDots" class="wz-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        </header>
        <p id="selectGuideText" class="wz-guide"></p>

        <!-- 第 1 頁：選模式 -->
        <section class="wz-page active" data-page="mode">
          <button class="mode-card" data-mode="online" type="button">
            <span class="mode-icon">🌐</span>
            <strong>連線對戰</strong>
            <em>2～4 人即時亂鬥<br>開房間邀朋友加入</em>
          </button>
          <button class="mode-card" data-mode="com" type="button">
            <span class="mode-icon">🤖</span>
            <strong>單機挑戰</strong>
            <em>對戰 1～3 名電腦<br>三種難度</em>
          </button>
          <button class="mode-card" data-mode="pvp" type="button">
            <span class="mode-icon">🎮</span>
            <strong>雙人同機</strong>
            <em>兩人共用一個鍵盤<br>WASD 對 方向鍵</em>
          </button>
        </section>

        <!-- 第 2 頁：選角色 -->
        <section class="wz-page" data-page="char">
          <div id="rosterGrid" class="roster-grid"></div>
          <aside class="char-detail">
            <div class="char-detail-body">
              <div id="charDetailName" class="char-detail-name"></div>
              <div id="charDetailTitle" class="char-detail-title"></div>
              <div class="stat-row"><b>體力</b>
                <div class="stat-bar"><i id="charStatHp"></i></div>
              </div>
              <div class="stat-row"><b>速度</b>
                <div class="stat-bar"><i id="charStatSpeed"></i></div>
              </div>
              <div id="charDetailMoves" class="move-list"></div>
            </div>
            <button id="btnCharNext" class="cta-btn" type="button">下一步 ›</button>
          </aside>
        </section>

        <!-- 第 3 頁 (連線)：大廳，建立或加入房間 -->
        <section class="wz-page" data-page="lobby">
          <div class="lobby-form">
            <label class="field">你的暱稱
              <input id="onlineNicknameInput" class="online-input" type="text" maxlength="10" autocomplete="off"
                placeholder="例如：猛將" />
            </label>
            <label class="field">房號（建立時可留空，自動產生）
              <input id="onlineRoomIdInput" class="online-input" type="text" maxlength="12" autocomplete="off"
                inputmode="numeric" placeholder="例如：888" />
            </label>
            <div class="lobby-actions">
              <button id="btnCreateRoom" class="cta-btn" type="button">建立房間</button>
              <button id="btnJoinRoomById" class="ghost-btn" type="button">用房號加入</button>
            </div>
            <details class="server-settings">
              <summary>伺服器設定（一般不用改）</summary>
              <div class="server-settings-row">
                <input id="wsUrlInput" class="online-input" type="text" autocomplete="off"
                  placeholder="wss://你的伺服器網址" />
                <button id="btnConnectWs" class="ghost-btn" type="button">重新連線</button>
              </div>
            </details>
          </div>
          <div class="lobby-rooms">
            <h3>📡 公開房間（點一下直接加入）</h3>
            <div id="onlineRoomList" class="room-list"></div>
          </div>
        </section>

        <!-- 第 3 頁：房間 (連線房 / 單機房共用) -->
        <section class="wz-page" data-page="room">
          <div class="room-top">
            <div class="room-code">
              <span id="roomCodeLabel">房號</span>
              <strong id="roomCodeText">—</strong>
              <button id="btnCopyRoom" class="mini-btn" type="button">複製</button>
            </div>
            <div class="room-settings">
              <div id="mapOptions" class="map-options"></div>
              <div id="diffSwitchGroup" class="diff-switch-group">
                <span class="diff-label">電腦</span>
                <button class="diff-btn" data-diff="easy" type="button">簡單</button>
                <button class="diff-btn active" data-diff="normal" type="button">普通</button>
                <button class="diff-btn" data-diff="hard" type="button">困難</button>
              </div>
            </div>
          </div>
          <div id="roomSlots" class="room-slots"></div>
          <div class="room-bottom">
            <button id="btnChangeChar" class="ghost-btn" type="button">換角色</button>
            <span id="roomHint" class="room-hint"></span>
            <button id="btnStartMatch" class="cta-btn start" type="button">開戰！</button>
          </div>
        </section>
      </div>
    </div>

    <!-- 預留虛擬按鍵操控區 (支援手機觸控滑動搖桿 + 四顆街機按鍵 + 電腦鍵盤提示) -->
    <div class="virtual-controller-deck">
      <!-- 手機橫版：戰鬥中選單 / 音效 / 全螢幕鍵 -->
      <button id="btnTouchMenu" class="touch-menu-btn" type="button" aria-label="選單">☰</button>
      <button id="btnTouchMute" class="touch-menu-btn touch-sub-btn" type="button" aria-label="音效">🔊</button>

  <!-- 手機直向時的轉橫提示 -->
  <div id="rotateHint" class="rotate-hint">
    <div class="rotate-icon">📱</div>
    <div>請將手機轉為橫向</div>
    <div style="font-size:12px; color:#cbbdd6; font-weight:600;">橫向全螢幕遊玩，虛擬按鍵會直接顯示在畫面上</div>
  </div>

  <script>
    // =========================================================================
    // 1. 遊戲基礎設定與裝置偵測 (手機自動強制單機 vs COM)
    // =========================================================================
// 單一判斷來源：是否為觸控裝置 (手機 / 平板)。不看視窗寬度，桌機縮小視窗不會被誤判成手機。
    const IS_TOUCH_DEVICE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
      !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);

    // 遊戲邏輯固定步長 (秒)：不論 60Hz / 90Hz / 120Hz 螢幕，速度與判定都一致
    const FIXED_STEP = 1 / 60;
    // 畫布實際解析度倍率 (依螢幕像素密度調整，避免高解析螢幕上模糊)
    let RENDER_SCALE = 1;

    // v0.2 手機橫版全螢幕 UI：觸控裝置才啟用 (不以視窗寬度判斷，避免桌機縮小視窗誤觸發)
    (function setupTouchLandscapeUI() {
      if (!IS_TOUCH_DEVICE) return;
      document.body.classList.add("touch-ui");

      // 選角畫面顯示時隱藏虛擬按鍵
      const overlay = document.getElementById("selectOverlay");
      const syncSelectState = () => {
        document.body.classList.toggle("in-select", !!overlay && !overlay.classList.contains("hidden"));
      };
      if (overlay) {
        new MutationObserver(syncSelectState).observe(overlay, { attributes: true, attributeFilter: ["class"] });
      }
      syncSelectState();

      // 戰鬥中選單鍵 → 等同「重選武將 / 房間」
      const menuBtn = document.getElementById("btnTouchMenu");
      if (menuBtn) {
        menuBtn.addEventListener("click", (e) => {
          e.preventDefault();
          document.getElementById("btnTopSelect")?.click();
        });
      }
      const fsBtn = document.getElementById("btnTouchFs");
      // iPhone Safari 沒有 Fullscreen API：隱藏無效的按鈕 (改用「加入主畫面」全螢幕遊玩)
      const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
      if (fsBtn && !canFullscreen) {
        fsBtn.style.display = "none";
      } else if (fsBtn) {
        fsBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (isFs) {
            (document.exitFullscreen || document.webkitExitFullscreen)?.call(document)?.catch?.(() => { });
          } else {
            tryFullscreenLandscape();
          }
        });
      }

      // 第一次觸控時嘗試進入全螢幕並鎖定橫向 (iOS Safari 不支援時自動略過)
      const tryFullscreenLandscape = () => {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        const lockLandscape = () => {
          try { screen.orientation?.lock?.("landscape")?.catch?.(() => { }); } catch (_) { }
        };
        if (!isFs && req) {
          try {
            const p = req.call(el, { navigationUI: "hide" });
            if (p && p.then) p.then(lockLandscape).catch(() => { });
            else lockLandscape();
          } catch (_) { }
        } else {
          lockLandscape();
        }
      };
      // 只透過左上角「⛶」按鈕手動切換全螢幕，避免每次點擊都呼叫 requestFullscreen 造成 Safari 畫面縮放異常
      // 防止 iOS Safari 點兩下放大/縮小 (Smart Zoom) 與雙指縮放手勢
      document.addEventListener("dblclick", (e) => {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener("gesturestart", (e) => {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener("gesturechange", (e) => {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener("gestureend", (e) => {
        e.preventDefault();
      }, { passive: false });

      // 攔截虛擬搖桿、虛擬按鍵與畫布上的 touchstart / 連續快速 touchend，徹底阻斷 Safari 雙擊縮放
      document.addEventListener("touchstart", (e) => {
        const t = e.target;
        if (t && t.closest && (t.closest(".v-btn") || t.closest(".dpad-zone") || t.id === "gameCanvas")) {
          e.preventDefault();
        }
      }, { passive: false });

      let lastTouchEndMs = 0;
      document.addEventListener("touchend", (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        const now = performance.now();
        if (now - lastTouchEndMs <= 350) {
          e.preventDefault();
        }
        lastTouchEndMs = now;
      }, { passive: false });
    })();

    const CONFIG = {
      canvasWidth: 960,
      canvasHeight: 540,
      arenaTopY: 315,
      arenaBottomY: 522,

      gravity: 1850,
      moveSpeedX: 295,
      moveSpeedY: 215,
      jumpVelocity: 660,
      groundFriction: 2200,
      airFriction: 650,

      dashSpeed: 760,
      dashDuration: 0.14,
      dashCooldown: 0.55,

      playerWidth: 54,
      playerHeight: 92,

      // 三戰兩勝與 60 秒節奏設定
      winsToMatch: 2,          // 三戰兩勝 (先拿 2 勝獲勝)
      roundDuration: 60.0,     // 每局 60 秒倒數
      rageTimeThreshold: 10.0, // 最後 10 秒微幅加速決戰
      rageDamageMult: 1.15,    // 最後 10 秒傷害微幅加成 15%

      // 集氣條設定 (必須集滿 100% 才能施放必殺技！揮空不加氣，集氣速度提升 x1.3)
      maxEnergy: 100,
      passiveEnergyPerSec: 1.56, // 緩慢自然集氣 (原 1.2 x 1.3)
      whiffEnergyGain: 0,        // 揮空不加氣，必須命中或受擊才能集氣
      hitEnergyGain: 15.6,       // 命中對手集氣 (原 12 x 1.3)
      hurtEnergyGain: 18.2,      // 受擊集氣 (原 14 x 1.3)

      roundTransitionDelay: 2.2,
      matchOverDelay: 9.0,       // 三戰兩勝總冠軍勝利畫面展示時間 (可隨時按鍵或點擊跳過)
      heavyShakeDuration: 0.20,
      heavyShakeIntensity: 9,

      // ===== v0.2 好友大亂鬥・輕鬆玩法規則 =====
      dashInvulnTime: 0.08,        // 衝刺起手無敵 (閃招用)
      knockdownLaunchZ: 300,       // 單發攻擊上拋力 >= 此值即擊倒
      comboKnockdownHits: 6,       // 連續被打 N 下強制擊倒 (防圍毆無限連)
      comboResetTime: 0.9,         // 超過此秒數沒被打，連擊計數歸零
      knockdownDuration: 0.55,     // 倒地時間 (期間無敵)
      wakeupInvulnTime: 0.6,       // 起身後無敵時間
      gangUpWindow: 1.2,           // 此秒數內被 2 名以上不同對手打中 = 被圍毆
      gangUpDamageMult: 0.8,       // 被圍毆時受到傷害 -20%
      gangUpEnergyMult: 1.5        // 被圍毆時受擊集氣 +50% (翻盤機會)
    };

    // COM 難易度參數表 (加入出招冷卻間隔，避免 AI 高頻連發秒殺)
    const COM_DIFFICULTIES = {
      easy: {
        id: "easy",
        label: "簡單",
        reactionMin: 0.45,
        reactionVar: 0.20,
        attackInterval: 0.95, // 簡單 AI 攻擊間隔較長
        aggression: 0.28,
        ultUseChance: 0.35,   // 滿氣時施放必殺技機率
        dodgeChance: 0.05,    // 幾乎不閃招
        dashChaseChance: 0.06,
        depthAccuracy: 36     // 對位較鬆散
      },
      normal: {
        id: "normal",
        label: "普通",
        reactionMin: 0.28,
        reactionVar: 0.14,
        attackInterval: 0.65, // 標準街機攻擊節奏
        aggression: 0.46,
        ultUseChance: 0.65,
        dodgeChance: 0.24,
        dashChaseChance: 0.18,
        depthAccuracy: 20
      },
      hard: {
        id: "hard",
        label: "困難",
        reactionMin: 0.16,
        reactionVar: 0.08,
        attackInterval: 0.44, // 積極壓制但保有合理收招破綻 (與連線伺服器一致)
        aggression: 0.68,
        ultUseChance: 0.90,   // 滿氣抓準距離施放超必殺
        dodgeChance: 0.52,
        dashChaseChance: 0.35,
        depthAccuracy: 12     // 精準對齊深度
      }
    };

    const OUTLINE = "#16111c";
    const IMAGE_CACHE = new Map();
    const CROP_CANVAS_CACHE = new Map();
    const SHADE_GRADIENT_CACHE = new Map(); // 色塊明暗漸層快取 (key: 區塊座標與尺寸)

    function getCachedImage(src) {
      if (!src) return null;
      if (!IMAGE_CACHE.has(src)) {
        const img = new Image();
        img.src = src;
        IMAGE_CACHE.set(src, img);
      }
      return IMAGE_CACHE.get(src);
    }

function drawCroppedPhoto(ctx, src, crop, dx, dy, dw, dh, radius = 12, isEllipse = false) {
      if (!crop || dw <= 0 || dh <= 0) return;
      const img = getCachedImage(src);
      const isReady = img && img.complete && img.naturalWidth > 0;
      const pad = 6;
      const modeTag = typeof isEllipse === "string" ? isEllipse : (isEllipse ? 1 : 0);
      const tracePath = (c, x, y) => {
        c.beginPath();
        if (isEllipse === "lf2") {
          // LF2 3/4 側面動漫臉型遮罩：飽滿額頭與微尖動漫下巴
          c.moveTo(x + dw * 0.50, y);
          c.quadraticCurveTo(x + dw * 0.94, y + dh * 0.04, x + dw * 0.96, y + dh * 0.42);
          c.quadraticCurveTo(x + dw * 0.94, y + dh * 0.72, x + dw * 0.62, y + dh * 0.98);
          c.quadraticCurveTo(x + dw * 0.44, y + dh * 1.01, x + dw * 0.22, y + dh * 0.84);
          c.quadraticCurveTo(x + dw * 0.03, y + dh * 0.62, x + dw * 0.05, y + dh * 0.30);
          c.quadraticCurveTo(x + dw * 0.08, y + dh * 0.02, x + dw * 0.50, y);
          c.closePath();
        } else if (isEllipse) {
          c.ellipse(x + dw / 2, y + dh / 2, dw / 2, dh / 2, 0, 0, Math.PI * 2);
        } else {
          c.roundRect(x, y, dw, dh, radius);
        }
      };

      // 離屏 Canvas 快取：依目前畫布解析度預先裁切、打光、描邊，每幀只需貼一張圖
      if (isReady) {
        const S = RENDER_SCALE;
        const cacheKey = `${src}|${dw}|${dh}|${radius}|${modeTag}|${S}|${crop.sx},${crop.sy},${crop.sw},${crop.sh}`;
        let cachedCanvas = CROP_CANVAS_CACHE.get(cacheKey);
        if (!cachedCanvas) {
          const off = document.createElement("canvas");
          off.width = Math.ceil((dw + pad * 2) * S);
          off.height = Math.ceil((dh + pad * 2) * S);
          const octx = off.getContext("2d");
          if (octx) {
            octx.scale(S, S);
            octx.imageSmoothingQuality = "high";
            // 僅一般圓形大頭照保留貼紙白邊；LF2 融合臉部直接使用動漫輪廓
            if (isEllipse === true) {
              tracePath(octx, pad, pad);
              octx.strokeStyle = "rgba(255, 255, 255, 0.92)";
              octx.lineWidth = 6;
              octx.stroke();
            }
            octx.save();
            tracePath(octx, pad, pad);
            octx.clip();
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;
            octx.drawImage(img, crop.sx * iw, crop.sy * ih, crop.sw * iw, crop.sh * ih, pad, pad, dw, dh);
            if (isEllipse === "lf2") {
              // LF2 賽璐璐光影融合：額頭暖光、後下顎動漫立體陰影
              const warmShade = octx.createLinearGradient(pad, pad, pad + dw, pad + dh);
              warmShade.addColorStop(0, "rgba(255, 238, 210, 0.18)");
              warmShade.addColorStop(0.55, "rgba(255, 215, 175, 0.04)");
              warmShade.addColorStop(1, "rgba(28, 14, 36, 0.30)");
              octx.fillStyle = warmShade;
              octx.fillRect(pad, pad, dw, dh);
              // 下顎邊緣柔和賽璐璐陰影帶
              octx.fillStyle = "rgba(32, 14, 38, 0.18)";
              octx.beginPath();
              octx.ellipse(pad + dw * 0.32, pad + dh * 0.92, dw * 0.45, dh * 0.18, 0.25, 0, Math.PI * 2);
              octx.fill();
            } else {
              // 左上打亮、右下壓暗，讓照片貼片有立體感
              const shade = octx.createLinearGradient(pad, pad, pad + dw, pad + dh);
              shade.addColorStop(0, "rgba(255, 255, 255, 0.16)");
              shade.addColorStop(0.5, "rgba(255, 255, 255, 0)");
              shade.addColorStop(1, "rgba(10, 4, 20, 0.30)");
              octx.fillStyle = shade;
              octx.fillRect(pad, pad, dw, dh);
            }
            octx.restore();

            tracePath(octx, pad, pad);
            octx.strokeStyle = OUTLINE;
            octx.lineWidth = isEllipse === "lf2" ? 2.1 : 2.4;
            octx.stroke();

            cachedCanvas = off;
            CROP_CANVAS_CACHE.set(cacheKey, cachedCanvas);
          }
        }
        if (cachedCanvas) {
          ctx.drawImage(cachedCanvas, dx - pad, dy - pad, dw + pad * 2, dh + pad * 2);
          return;
        }
      }

      // 圖片尚未載入：先畫膚色佔位
      ctx.save();
      tracePath(ctx, dx, dy);
      ctx.fillStyle = "#e0ab84";
      ctx.fill();
      ctx.strokeStyle = OUTLINE;
      ctx.lineWidth = isEllipse === "lf2" ? 2.1 : 2.4;
      ctx.stroke();
      ctx.restore();
    }

    function drawOutlinedRoundRect(ctx, x, y, w, h, r, fillStyle, strokeWidth = 2.2) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = fillStyle;
      ctx.fill();
      // 左上亮、右下暗的漸層，讓手腳與服裝色塊有體積感
      if (w > 5 && h > 5) {
        const key = `${x}|${y}|${w}|${h}`;
        let shade = SHADE_GRADIENT_CACHE.get(key);
        if (!shade) {
          shade = ctx.createLinearGradient(x, y, x + w, y + h);
          shade.addColorStop(0, "rgba(255, 255, 255, 0.24)");
          shade.addColorStop(0.45, "rgba(255, 255, 255, 0)");
          shade.addColorStop(1, "rgba(0, 0, 0, 0.30)");
          if (SHADE_GRADIENT_CACHE.size > 400) SHADE_GRADIENT_CACHE.clear();
          SHADE_GRADIENT_CACHE.set(key, shade);
        }
        ctx.fillStyle = shade;
        ctx.fill();
      }
      if (strokeWidth > 0) {
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = strokeWidth;
        ctx.stroke();
      }
    }

    // =========================================================================
    // 2. 地圖資料庫
    // =========================================================================
    const MAP_TEMPLATES = [
      {
        id: "airbase_plaza",
        name: "空軍基地廣場 (實景)",
        preview: "人物角色/地圖.jpg",
        arenaTopY: 325,
        arenaBottomY: 522,
        draw(ctx) {
          const W = CONFIG.canvasWidth;
          const H = CONFIG.canvasHeight;
          const img = getCachedImage("人物角色/地圖.jpg");
          if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, 0, -45, W, H + 55);
            const roadShade = ctx.createLinearGradient(0, 300, 0, H);
            roadShade.addColorStop(0, "rgba(15, 18, 26, 0.05)");
            roadShade.addColorStop(1, "rgba(10, 12, 18, 0.38)");
            ctx.fillStyle = roadShade;
            ctx.fillRect(0, 300, W, H - 300);
          } else {
            ctx.fillStyle = "#3a404a";
            ctx.fillRect(0, 0, W, H);
          }
        }
      },
      {
        id: "three_kingdoms_wall",
        name: "三國古城牆",
        preview: "",
        arenaTopY: 245,
        arenaBottomY: 518,
        draw(ctx, time) {
          const W = CONFIG.canvasWidth;
          const H = CONFIG.canvasHeight;
          const wallBottom = 228;

          const skyGrad = ctx.createLinearGradient(0, 0, 0, wallBottom);
          skyGrad.addColorStop(0, "#191124");
          skyGrad.addColorStop(0.6, "#421f2b");
          skyGrad.addColorStop(1, "#7a322d");
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, W, wallBottom);

          ctx.fillStyle = "#2b2027";
          ctx.fillRect(0, 120, W, wallBottom - 120);
          for (let x = 15; x < W; x += 80) ctx.fillRect(x, 100, 42, 20);
          ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1.5;
          for (let y = 135; y < wallBottom; y += 22) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          }

          for (const fx of [160, 480, 800]) {
            const flicker = Math.sin(time * 14 + fx) * 3;
            ctx.fillStyle = "#5c3d28"; ctx.fillRect(fx - 3, 152, 6, 20);
            ctx.fillStyle = "rgba(255, 140, 0, 0.22)";
            ctx.beginPath(); ctx.arc(fx, 146, 26 + flicker, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff9f1c";
            ctx.beginPath(); ctx.arc(fx, 147, 7 + flicker * 0.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#fff3b0";
            ctx.beginPath(); ctx.arc(fx, 148, 3.5, 0, Math.PI * 2); ctx.fill();
          }

          const floorGrad = ctx.createLinearGradient(0, wallBottom, 0, H);
          floorGrad.addColorStop(0, "#4f3c30");
          floorGrad.addColorStop(1, "#2e221b");
          ctx.fillStyle = floorGrad;
          ctx.fillRect(0, wallBottom, W, H - wallBottom);

          ctx.strokeStyle = "rgba(20, 14, 10, 0.45)"; ctx.lineWidth = 2;
          for (let y = wallBottom + 36; y < H; y += 52) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
          }
          for (let x = 0; x <= W; x += 120) {
            ctx.beginPath(); ctx.moveTo(x, wallBottom); ctx.lineTo(x + (x - W / 2) * 0.32, H); ctx.stroke();
          }
        }
      }
    ];

    // =========================================================================
    // 3. 角色骨架動畫狀態計算與狀態疊加
    // =========================================================================
    function computeAnimPose(p) {
      const t = p.animTime;
      const pose = {
        bobY: 0, bodyTilt: 0,
        frontLegAngle: 0, backLegAngle: 0,
        frontArmAngle: 0, backArmAngle: 0,
        headTilt: 0,
        squashX: 1, squashY: 1,
        hurtFace: false,
        attackProgress: 0, isKO: p.state === "ko" || p.state === "knockdown"
      };

      if (p.state === "idle") {
        pose.bobY = Math.sin(t * 4.5) * 2.2;
        pose.headTilt = Math.sin(t * 2.25) * 0.04;
        pose.frontArmAngle = -0.25 + Math.sin(t * 4.5) * 0.08;
        pose.backArmAngle = 0.22 + Math.cos(t * 4.5) * 0.06;
      } else if (p.state === "move") {
        const stride = Math.sin(t * 16);
        pose.bobY = Math.abs(stride) * -5;
        pose.bodyTilt = 0.11;
        pose.headTilt = 0.05;
        pose.frontLegAngle = stride * 0.6;
        pose.backLegAngle = -stride * 0.6;
        pose.frontArmAngle = -stride * 0.5;
        pose.backArmAngle = stride * 0.5;
      } else if (p.state === "jump") {
        pose.squashX = 0.94; pose.squashY = 1.06;
        pose.frontLegAngle = -0.35; pose.backLegAngle = 0.45;
        pose.frontArmAngle = -1.1; pose.backArmAngle = -0.7;
      } else if (p.state === "dash") {
        pose.squashX = 1.15; pose.squashY = 0.88;
        pose.bodyTilt = 0.28;
        pose.frontLegAngle = -0.5; pose.backLegAngle = 0.7;
        pose.frontArmAngle = 0.8; pose.backArmAngle = 0.9;
      } else if (p.state === "attack_startup") {
        const dur = p.currentAttack?.startup || 0.2;
        pose.attackProgress = 1 - Math.max(0, p.stateTimer / dur);
        pose.bodyTilt = -0.18; pose.headTilt = -0.1;
        pose.frontArmAngle = -1.8; pose.backArmAngle = 0.45;
        pose.squashX = 0.93; pose.squashY = 1.06;
      } else if (p.state === "attack_active") {
        const dur = p.currentAttack?.active || 0.1;
        pose.attackProgress = 1 - Math.max(0, p.stateTimer / dur);
        pose.bodyTilt = 0.24; pose.headTilt = 0.08;
        pose.frontArmAngle = 1.45; pose.backArmAngle = 0.65;
        pose.squashX = 1.12; pose.squashY = 0.92;
      } else if (p.state === "attack_recovery") {
        pose.bodyTilt = 0.08; pose.frontArmAngle = 0.6; pose.backArmAngle = 0.3;
      } else if (p.state === "hitstun") {
        pose.bodyTilt = -0.28; pose.headTilt = -0.22;
        pose.frontArmAngle = -0.9; pose.backArmAngle = -0.6;
        pose.squashX = 0.9; pose.squashY = 1.08;
        pose.hurtFace = true;
      } else if (p.state === "ko" || p.state === "knockdown") {
        pose.hurtFace = true;
      }
      return pose;
    }

    function drawHeadStatusOverlay(ctx, headX, headY, headW, headH, p, anim) {
      // 下巴與頸部立體陰影，讓頭像與身體自然銜接
      ctx.save();
      ctx.fillStyle = "rgba(12, 6, 20, 0.28)";
      ctx.beginPath();
      ctx.ellipse(headX + headW / 2, headY + headH + 1, headW * 0.32, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 受擊紅閃特效
      if (p.hitFlashTimer > 0) {
        ctx.save();
        ctx.fillStyle = "rgba(255, 65, 85, 0.45)";
        ctx.beginPath();
        ctx.ellipse(headX + headW / 2, headY + headH / 2, headW / 2, headH / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 滿氣 100% 時額頭/雙眼金色鬥氣星芒
      if (p.energy >= CONFIG.maxEnergy && !anim.hurtFace) {
        const glint = 0.7 + Math.sin(p.animTime * 16) * 0.3;
        const gx = headX + headW * 0.72;
        const gy = headY + headH * 0.38;
        ctx.save();
        ctx.translate(gx, gy);
        ctx.scale(glint, glint);
        ctx.fillStyle = "#fff3b0";
        ctx.strokeStyle = "#ff0054";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -7); ctx.lineTo(2, -2); ctx.lineTo(7, 0); ctx.lineTo(2, 2);
        ctx.lineTo(0, 7); ctx.lineTo(-2, 2); ctx.lineTo(-7, 0); ctx.lineTo(-2, -2);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      if (anim.hurtFace) {
        // 頭頂旋轉十字暈眩星 + 臉側冷汗水滴
        const t = p.animTime * 10;
        ctx.save();
        ctx.fillStyle = "#ffbe0b"; ctx.strokeStyle = "#16111c"; ctx.lineWidth = 1.4;
        for (let i = 0; i < 3; i++) {
          const sx = headX + headW / 2 + Math.cos(t + i * 2.1) * 19;
          const sy = headY - 7 + Math.sin(t + i * 2.1) * 5;
          ctx.beginPath();
          ctx.moveTo(sx, sy - 4.5); ctx.lineTo(sx + 1.6, sy - 1.6);
          ctx.lineTo(sx + 4.5, sy); ctx.lineTo(sx + 1.6, sy + 1.6);
          ctx.lineTo(sx, sy + 4.5); ctx.lineTo(sx - 1.6, sy + 1.6);
          ctx.lineTo(sx - 4.5, sy); ctx.lineTo(sx - 1.6, sy - 1.6);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
        // 漫畫風冷汗滴
        const dropY = headY + 10 + ((p.animTime * 22) % 8);
        ctx.fillStyle = "#4cc9f0";
        ctx.beginPath();
        ctx.moveTo(headX + 3, dropY - 5);
        ctx.quadraticCurveTo(headX + 7, dropY + 1, headX + 3, dropY + 4);
        ctx.quadraticCurveTo(headX - 1, dropY + 1, headX + 3, dropY - 5);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      } else if (p.state === "attack_startup" && (p.currentAttack?.name === "heavy" || p.currentAttack?.name === "ult")) {
        // 重攻擊 / 必殺技蓄力：漫畫十字青筋符號 💢
        ctx.save();
        const isUlt = p.currentAttack?.name === "ult";
        ctx.strokeStyle = isUlt ? "#ffd166" : "#ff0054";
        ctx.lineWidth = 2.4;
        const vx = headX + headW - 5; const vy = headY + 8;
        ctx.beginPath();
        ctx.moveTo(vx - 5, vy - 2); ctx.quadraticCurveTo(vx - 2, vy - 2, vx - 2, vy - 5);
        ctx.moveTo(vx + 5, vy - 2); ctx.quadraticCurveTo(vx + 2, vy - 2, vx + 2, vy - 5);
        ctx.moveTo(vx - 5, vy + 2); ctx.quadraticCurveTo(vx - 2, vy + 2, vx - 2, vy + 5);
        ctx.moveTo(vx + 5, vy + 2); ctx.quadraticCurveTo(vx + 2, vy + 2, vx + 2, vy + 5);
        ctx.stroke();
        ctx.restore();
      }
    }

    /**
     * 《小朋友齊打交 2 (LF2)》風格 2.5 頭身三階賽璐璐（Cel-Shaded）輔助繪圖系統
     */
    function drawCelLimb(ctx, points, baseColor, shadowColor, highlightColor, lineWidth = 2.0) {
      if (!points || points.length < 3) return;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      const trace = () => {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.closePath();
      };
      for (const [px, py] of points) {
        if (px < minX) minX = px; if (px > maxX) maxX = px;
        if (py < minY) minY = py; if (py > maxY) maxY = py;
      }
      ctx.save();
      trace();
      ctx.fillStyle = baseColor;
      ctx.fill();
      ctx.save();
      trace();
      ctx.clip();
      const w = maxX - minX, h = maxY - minY;
      if (shadowColor) {
        ctx.fillStyle = shadowColor;
        ctx.fillRect(minX, minY + h * 0.52, w * 0.62, h * 0.55);
      }
      if (highlightColor) {
        ctx.fillStyle = highlightColor;
        ctx.fillRect(minX + w * 0.48, minY, w * 0.56, h * 0.34);
      }
      ctx.restore();
      if (lineWidth > 0) {
        trace();
        ctx.strokeStyle = OUTLINE;
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = "round";
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawLF2Boot(ctx, x, y, bootColor, trimColor, soleColor = "#e5e5e5", dark = false) {
      ctx.save();
      ctx.translate(x, y);
      // LF2 經典厚底圓弧格鬥戰靴
      ctx.beginPath();
      ctx.moveTo(-6, 0);
      ctx.lineTo(7, 0);
      ctx.quadraticCurveTo(15, 2, 16, 6);
      ctx.lineTo(15, 8);
      ctx.lineTo(-7, 8);
      ctx.closePath();
      ctx.fillStyle = bootColor;
      ctx.fill();
      ctx.save();
      ctx.clip();
      // 右上鞋面亮部 + 後跟暗部 + 分色鞋底
      ctx.fillStyle = dark ? "rgba(0,0,0,0.28)" : "rgba(255,255,255,0.22)";
      ctx.fillRect(2, 0, 12, 3.2);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(-7, 3, 9, 4);
      ctx.fillStyle = soleColor;
      ctx.fillRect(-7, 5.8, 24, 2.8);
      ctx.restore();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.0; ctx.lineJoin = "round"; ctx.stroke();
      // 護踝束口邊條
      if (trimColor) {
        ctx.fillStyle = trimColor;
        ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.roundRect(-6.5, -2.5, 13.5, 4, 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    function drawLF2BaggyPants(ctx, angle, yTop, pantColor, shadowColor, bootColor, trimColor, dark, extraFn, hipX = 0, soleColor = "#e5e5e5") {
      ctx.save();
      ctx.translate(hipX, yTop);
      ctx.rotate(angle);
      // 寬鬆束口武道燈籠褲：大腿收束、小腿外擴折線
      const legPts = [[-6.5, 0], [6.5, 0], [9.5, 10], [8.5, 15.5], [5.5, 17], [-6, 17], [-8.5, 14.5], [-8.5, 9]];
      drawCelLimb(ctx, legPts, pantColor, dark ? "rgba(8, 4, 16, 0.42)" : shadowColor, dark ? null : "rgba(255,255,255,0.16)", 2.0);
      if (dark) {
        ctx.fillStyle = "rgba(8, 4, 18, 0.16)";
        ctx.beginPath();
        ctx.moveTo(legPts[0][0], legPts[0][1]);
        for (let i = 1; i < legPts.length; i++) ctx.lineTo(legPts[i][0], legPts[i][1]);
        ctx.closePath(); ctx.fill();
      }
      // 褲管折線摺痕
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-6, 11.5); ctx.lineTo(2, 13);
      ctx.moveTo(4, 9); ctx.lineTo(8, 10.5);
      ctx.stroke();
      if (extraFn) extraFn(ctx, dark);
      if (bootColor) {
        drawLF2Boot(ctx, -0.5, 16, bootColor, trimColor, soleColor, dark);
      }
      ctx.restore();
    }

    function drawLF2ArmAndFist(ctx, x, y, angle, sleeveColor, skinColor, wristColor, isBack, weaponFn, skinShade = "#ba7b53") {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const backShade = isBack ? "rgba(8, 4, 18, 0.36)" : "rgba(0,0,0,0.24)";
      const hiCol = isBack ? null : "rgba(255,255,255,0.22)";
      // 上袖 / 肩甲
      if (sleeveColor && sleeveColor !== "skin") {
        drawCelLimb(ctx, [[-5.5, -1], [5.5, -1], [6.5, 8.5], [-6, 8.5]], sleeveColor, backShade, hiCol, 1.9);
      } else {
        drawCelLimb(ctx, [[-4.5, -1], [5, -1], [5.5, 8], [-5, 8]], skinColor, isBack ? "rgba(8,4,18,0.34)" : skinShade, hiCol, 1.9);
      }
      // 肌肉前臂
      drawCelLimb(ctx, [[-4.5, 7], [4.8, 7], [4.5, 15], [-4.2, 15]], skinColor, isBack ? "rgba(8,4,18,0.32)" : skinShade, isBack ? null : "rgba(255,255,255,0.18)", 1.9);
      // 鮮明格鬥護腕
      if (wristColor) {
        ctx.fillStyle = wristColor; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.7;
        ctx.beginPath(); ctx.roundRect(-5, 12.5, 10, 4.5, 1.8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = isBack ? "rgba(0,0,0,0.18)" : "rgba(255,255,255,0.28)";
        ctx.fillRect(-3, 13, 6, 1.4);
      }
      // LF2 飽和拳頭 + 指節線條 + 大拇指稜線
      ctx.save();
      ctx.beginPath(); ctx.roundRect(-5.2, 16.5, 10.8, 8.5, 3.2);
      ctx.fillStyle = skinColor; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = isBack ? "rgba(8,4,18,0.30)" : skinShade;
      ctx.fillRect(-5.5, 21.4, 12, 4);
      ctx.restore();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.9; ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-2, 19); ctx.lineTo(-2, 23.5);
      ctx.moveTo(1.5, 19); ctx.lineTo(1.5, 23.5);
      ctx.moveTo(-4.5, 18.8); ctx.lineTo(1.5, 18.8);
      ctx.stroke();
      if (weaponFn) weaponFn(ctx);
      ctx.restore();
    }

    function drawLF2SpikyHair(ctx, style, mainColor, shadeColor, shineColor, sway = 0, pass = "both") {

        ctx.fillStyle = col;

          drawPoly([[-18, -22], [-27, -28], [-22, -34], [-15, -31]], shadeColor, 0);

          drawPoly([[-20, -36], [-14, -44], [0, -45], [15, -42], [21, -33], [19, -22], [15, -33], [7, -26], [3, -39], [-4, -24], [-11, -35], [-15, -14], [-20, -21]], mainColor, 1.7);

    function drawLF2Torso(ctx, p, anim, cfg) {
      const style = cfg.torsoStyle || "vest";
      const torsoColor = cfg.torsoColor || p.charDef.themeColor || "#e63946";
      const torsoShade = cfg.torsoShade || "rgba(0,0,0,0.26)";
      const torsoLight = cfg.torsoLight || "rgba(255,255,255,0.22)";
      const innerColor = cfg.innerColor || "#f1faee";
      const skin = cfg.skin || "#e0ab84";
      const skinShade = cfg.skinShade || "#ba7b53";
      const beltColor = cfg.beltColor || "#1d1e2c";
      const sashColor = cfg.sashColor || "#ffd166";

      // 倒三角武鬥上身基底
      const chestPts = [[-17, -27], [17, -27], [14.5, -9], [12.5, 0], [-13, 0], [-15, -10]];
      if (style === "robe") {
        // 寬長袍上身＋下擺前片
        drawCelLimb(ctx, [[-18, -28], [18, -28], [19, 13], [-19, 13]], torsoColor, torsoShade, torsoLight, 2.0);
        ctx.fillStyle = cfg.hemColor || sashColor;
        ctx.fillRect(-18, 9, 36, 3.5);
        // 交領 V 字領口
        ctx.fillStyle = innerColor; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(-6, -28); ctx.lineTo(1, -13); ctx.lineTo(7, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (style === "armor") {
        // 參考圖右3/右5：聖騎士立體胸甲 + 肩甲翼 + 中央紅寶石
        drawCelLimb(ctx, chestPts, innerColor, "rgba(0,0,0,0.22)", torsoLight, 2.0);
        drawCelLimb(ctx, [[-18, -28], [18, -28], [16, -9], [0, -5], [-16, -9]], torsoColor, torsoShade, "#ffffff", 2.0);
        // 胸甲高光斜線與左右重裝肩甲
        drawCelLimb(ctx, [[-23, -31], [-10, -29], [-12, -20], [-22, -22]], torsoColor, torsoShade, "#ffffff", 1.9);
        drawCelLimb(ctx, [[10, -29], [23, -31], [22, -22], [12, -20]], torsoColor, torsoShade, "#ffffff", 1.9);
        // 胸甲滾藍金邊與寶石座
        ctx.strokeStyle = cfg.trimColor || "#0077b6"; ctx.lineWidth = 2.0;
        ctx.beginPath(); ctx.moveTo(-14, -27); ctx.lineTo(0, -10); ctx.lineTo(14, -27); ctx.stroke();
        ctx.fillStyle = cfg.gemColor || "#ff0054"; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(1, -18, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (style === "gi" || style === "jacket") {
        // 參考圖左2/中5：道服 / 立領戰鬥夾克 + 內襯領口
        drawCelLimb(ctx, chestPts, torsoColor, torsoShade, torsoLight, 2.0);
        // 內層高領衫
        ctx.fillStyle = innerColor; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.7;
        ctx.beginPath(); ctx.moveTo(-6, -28); ctx.lineTo(1, -12); ctx.lineTo(8, -28); ctx.closePath(); ctx.fill(); ctx.stroke();
        // 立領翻領折線
        ctx.fillStyle = cfg.collarColor || torsoColor; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-8, -29); ctx.lineTo(-4, -21); ctx.lineTo(-10, -18); ctx.closePath(); ctx.fill(); ctx.stroke();

    function drawLF2Fighter(ctx, p, anim, cfg = {}) {
      const skin = cfg.skin || "#e0ab84";
      const skinShade = cfg.skinShade || "#ba7b53";
      const sway = Math.sin(p.animTime * 7.5) * 3;

      // 1. 背後披風（參考圖左3/右3）
      if (cfg.cape) {
        const cw = Math.sin(p.animTime * 8.5) * 4;
        const capeLen = cfg.cape.length || 38;
        ctx.save();
        ctx.translate(0, -24 + anim.bobY);
        ctx.rotate(anim.bodyTilt * 0.7);
        drawCelLimb(
          ctx,
          [[-12, -28], [-29 + cw * 0.4, -14], [-32 + cw, -28 + capeLen], [-14 + cw * 0.3, -28 + capeLen + 2], [-8, -6]],
          cfg.cape.color || "#d90429",
          cfg.cape.shade || "rgba(0,0,0,0.30)",
          cfg.cape.trim || "rgba(255,255,255,0.20)",
          2.0
        );
        if (cfg.cape.trimBorder) {
          ctx.strokeStyle = cfg.cape.trimBorder; ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(-29 + cw * 0.4, -14); ctx.lineTo(-32 + cw, -28 + capeLen); ctx.lineTo(-14 + cw * 0.3, -28 + capeLen + 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      if (cfg.onDrawBehindBody) cfg.onDrawBehindBody(ctx, p, anim);

      // 2. 後腿 + 後手
      drawLF2BaggyPants(ctx, anim.backLegAngle, -24 + anim.bobY, cfg.pantsColor || "#343a40", cfg.pantsShade || "rgba(0,0,0,0.32)", cfg.bootColor, cfg.bootTrim, true, cfg.onDrawBackLegExtra, -4, cfg.soleColor);
      ctx.save(); ctx.translate(0, -24 + anim.bobY); ctx.rotate(anim.bodyTilt);
      drawLF2ArmAndFist(ctx, -11, -24, anim.backArmAngle, cfg.backSleeve || cfg.sleeveColor, skin, cfg.wristColor, true, cfg.onDrawBackArmProp ? (c) => cfg.onDrawBackArmProp(c, p, anim) : null, skinShade);
      ctx.restore();

      // 3. 前腿
      drawLF2BaggyPants(ctx, anim.frontLegAngle, -24 + anim.bobY, cfg.pantsColor || "#343a40", cfg.pantsShade || "rgba(0,0,0,0.28)", cfg.bootColor, cfg.bootTrim, false, cfg.onDrawFrontLegExtra, 4, cfg.soleColor);

      // 4. 身體、頸部、LF2 動漫頭顱融合臉、前手
      ctx.save(); ctx.translate(0, -24 + anim.bobY); ctx.rotate(anim.bodyTilt);
      if (cfg.onDrawBackProp) cfg.onDrawBackProp(ctx, p, anim);
      drawLF2Torso(ctx, p, anim, cfg);
      if (cfg.onDrawChestProp) cfg.onDrawChestProp(ctx, p, anim);

      // 頸部立體柱
      ctx.fillStyle = skin; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.roundRect(-5.5, -33, 12, 8, 2); ctx.fill(); ctx.stroke();

      // 頭部座標系（2.4~2.5 頭身比）
      ctx.save(); ctx.translate(0, -29); ctx.rotate(anim.headTilt);
      drawLF2SpikyHair(ctx, cfg.hairStyle || "spiky_up", cfg.hairColor || "#5c3d28", cfg.hairShade || "#362013", cfg.hairShine || "#8b6345", sway, "back");
      // 動漫側耳
      ctx.fillStyle = skin; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.ellipse(-18.5, -18, 4.2, 6, -0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = skinShade; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(-18.2, -18, 2, -0.6, 1.4); ctx.stroke();

      // 真人五官照片無縫融入 3/4 動漫臉型
      drawCroppedPhoto(ctx, p.charDef.photo, p.charDef.faceCrop, -19, -39, 39, 39, 10, "lf2");
      // 前層動漫劉海與鬢角蓋邊
      drawLF2SpikyHair(ctx, cfg.hairStyle || "spiky_up", cfg.hairColor || "#5c3d28", cfg.hairShade || "#362013", cfg.hairShine || "#8b6345", sway, "front");
      if (cfg.onDrawHeadProp) cfg.onDrawHeadProp(ctx, p, anim);
      drawHeadStatusOverlay(ctx, -19, -39, 39, 39, p, anim);
      ctx.restore();

      // 前手
      drawLF2ArmAndFist(ctx, 9, -24, -anim.frontArmAngle, cfg.sleeveColor, skin, cfg.wristColor, false, cfg.onDrawFrontArmProp ? (c) => cfg.onDrawFrontArmProp(c, p, anim) : null, skinShade);
      ctx.restore();

      // 5. 招式特效
      if (cfg.onDrawAttackFx) cfg.onDrawAttackFx(ctx, p, anim);
    }

    function drawStandardHumanoid(ctx, p, anim, style = {}) {
      drawLF2Fighter(ctx, p, anim, {

        innerColor: style.innerColor || "#f1faee",

        cape: style.cape || null,
        onDrawBackProp: style.onDrawBackProp,
        onDrawHeadProp: style.onDrawHat,
        onDrawFrontArmProp: style.onDrawWeapon,
        onDrawAttackFx: style.onDrawAttackFx
      });
    }

    function createCharacterSpec(spec) {
      if (!spec.voice) {
        spec.voice = { pitch: 1.0, rate: 1.05, ultCry: spec.ultTitle || "超必殺奧義！", winCry: spec.name + "獲勝！" };
      }
      if (!spec.drawLocalModel) {
        spec.drawLocalModel = function (ctx, p, anim) {
          drawStandardHumanoid(ctx, p, anim, this.modelStyle || {});
        };
      }
      return spec;
    }
