      }

      // 鍵盤操作開戰前流程 (電腦)：方向 / WASD 選擇，F / 空白 / Enter 確定，Esc 返回
      updateSelectInput() {
        const inp = this.input;
        if (inp.wasPressed("Escape")) {
          if (this.wzPage !== "mode") this.goBack();
          return;
        }
        const confirm = inp.wasPressed(["KeyF", "Space", "Enter"]);
        const left = inp.wasPressed(["KeyA", "ArrowLeft"]);
        const right = inp.wasPressed(["KeyD", "ArrowRight"]);
        const up = inp.wasPressed(["KeyW", "ArrowUp"]);
        const down = inp.wasPressed(["KeyS", "ArrowDown"]);

        if (this.wzPage === "mode") {
          const cards = this.modeCardEls.filter((c) => c.offsetParent !== null);
          if (!cards.length) return;
          if (left || right) {
            this.modeFocus = (this.modeFocus + (right ? 1 : -1) + cards.length) % cards.length;
            this.modeCardEls.forEach((c) => c.classList.remove("focus"));
            cards[this.modeFocus].classList.add("focus");
          } else if (confirm) {
            const card = cards[Math.min(this.modeFocus, cards.length - 1)];
            this.setPlayMode(card.dataset.mode);
            this.showPage("char");
          }
        } else if (this.wzPage === "char") {
          const total = CHARACTER_ROSTER.length;
          const cols = 3;
          let idx = this.p1Index;
          if (right) idx = (idx + 1) % total;
          if (left) idx = (idx - 1 + total) % total;
          if (down) idx = (idx + cols) % total;
          if (up) idx = (idx - cols + total) % total;
          if (idx !== this.p1Index) this.selectChar(idx);
          else if (confirm) this.goNextFromChar();
        } else if (this.wzPage === "room") {
          if (confirm && !this.btnStartMatch.disabled) this.startFromRoom();
        }
      }

            resetRound(keepPartialEnergy = true) {
        for (const f of this.activeFighters) {
          f.reset(keepPartialEnergy);
        }
        this.particles = []; this.afterimages = []; this.projectiles = [];
        this.starbursts = []; this.floatingTexts = [];
        this.pickups = []; this.pickupSpawnTimer = 8.5;
        this.hitstopTimer = 0; this.shakeTimer = 0;
        this.roundTimer = CONFIG.roundDuration;
        this.roundIntroTimer = 1.1;
        this.roundEndReason = "";
        this.koWinner = null;
        this.resetTimer = 0;
        this.ultBanner = null;
        this._predAttack = null; this._predDash = null; this._predJump = null;
        this._dashCdUntil = 0; this._dashEchoUntil = 0; this._jumpEchoUntil = 0;
        this.netHitstop = 0; this.zoomPunch = 0; this.impactFlash = 0;
        SFX.play("round_start");
      }

      spawnHitSparks(x, y, isHeavy) {
        const count = isHeavy ? 22 : 10; const speed = isHeavy ? 460 : 250;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const mag = (0.3 + Math.random() * 0.7) * speed;
          const color = isHeavy ? (i % 2 === 0 ? "#ffcc00" : "#ff5400") : "#ffffff";
          this.particles.push(new Particle(x, y, Math.cos(angle) * mag, Math.sin(angle) * mag, color, isHeavy ? 7 : 4, isHeavy ? 0.34 : 0.18));
        }
      }

      spawnDust(x, y, count) {
        for (let i = 0; i < count; i++) {
          this.particles.push(new Particle(x + (Math.random() - 0.5) * 24, y, (Math.random() - 0.5) * 130, -Math.random() * 60, "rgba(215, 200, 180, 0.7)", 5, 0.24));
        }
      }

      rectsOverlap(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y; }

      applyHitEffects(attacker, defender, attackData, facing, hitX, hitY) {
        const rageMult = this.isRageTime() ? CONFIG.rageDamageMult : 1.0;
        // 反圍毆：短時間內被 2 名以上不同對手打中 → 減傷並加速集氣
        const now = this.worldTime || 0;
        if (attacker && defender.recentAttackers) defender.recentAttackers.set(attacker, now);
        const gangedUp = defender.isGangedUp ? defender.isGangedUp(now) : false;
        const gangMult = gangedUp ? CONFIG.gangUpDamageMult : 1.0;
        const scaledDmg = Math.max(1, Math.round((attackData.damage || 5) * rageMult * gangMult));
        const actualDmg = defender.takeHit(attackData, facing, scaledDmg, gangedUp ? CONFIG.gangUpEnergyMult : 1.0);
        if (gangedUp && (!defender._lastGangWarn || now - defender._lastGangWarn > 1.2)) {
          defender._lastGangWarn = now;
          this.floatingTexts.push(new FloatingText(defender.x + defender.width / 2, defender.getDrawTopY() - 22, "圍毆減傷! 氣+50%", "#00f5d4", 1.05));
        }
        const isUlt = attackData.name === "ult" || attackData.name === "ult_proj";
        const isHeavyOrUlt = attackData.name === "heavy" || isUlt;
        SFX.play(defender.hp <= 0 ? "ko" : (attackData.hitSfx || (isUlt ? "ult" : (isHeavyOrUlt ? "heavy" : "light"))));

        // 攻擊方獲得集氣 (必殺技與其衍生飛行道具期間不重複回氣)
        if (attackData.name !== "ult" && attackData.name !== "ult_proj") {
          const energyGain = attackData.multiHitInterval ? CONFIG.hitEnergyGain * 0.45 : CONFIG.hitEnergyGain;
          attacker.addEnergy(energyGain * (this.isRageTime() ? 1.5 : 1.0));
        }

        this.hitstopTimer = Math.max(this.hitstopTimer, attackData.hitstop || 0.04);
        this.playHitImpact({ hitX, hitY, isHeavyOrUlt, isUlt, isKo: defender.hp <= 0, attId: attacker ? attacker.id : 0, defId: defender.id });
        this.spawnHitSparks(hitX, hitY, isHeavyOrUlt);
        this.starbursts.push(new HitStarburst(hitX, hitY, isHeavyOrUlt));
        const tag = isUlt ? " 必殺!!" : (isHeavyOrUlt ? "!" : "");
        const color = isUlt ? "#ff0054" : (isHeavyOrUlt ? "#ffbe0b" : "#ffffff");
        const scale = isUlt ? 1.55 : (isHeavyOrUlt ? 1.35 : 1.0);
        const dmgText = `-${actualDmg}${tag}`;
        this.floatingTexts.push(new FloatingText(hitX, hitY - 18, dmgText, color, scale));

      }

      checkCombatHits() {
// 先用同一瞬間的狀態找出所有近戰命中，再一起結算：互打就是互中，不會因為誰排在前面而佔便宜
        const meleeHits = [];
        for (const attacker of this.activeFighters) {
          const hitbox = attacker.getActiveHitbox();
          if (!hitbox) continue;
          for (const defender of this.activeFighters) {
            if (defender === attacker) continue;
            if (attacker.hitTargetsThisSwing.has(defender) || defender.state === "ko" || defender.invulnTimer > 0) continue;
            const hurtbox = defender.getHurtbox();
            if (Math.abs(hitbox.groundY - hurtbox.groundY) <= hitbox.depthTolerance && this.rectsOverlap(hitbox, hurtbox)) {
              const pushDir = (defender.x + defender.width / 2 >= attacker.x + attacker.width / 2) ? 1 : -1;
              const hitX = pushDir === 1 ? hurtbox.x + 8 : hurtbox.x + hurtbox.width - 8;
              meleeHits.push({
                attacker, defender, atk: attacker.currentAttack,
                facing: attacker.currentAttack.centeredHitbox ? pushDir : attacker.facing,
                hitX, hitY: hitbox.y + hitbox.height / 2
              });
            }
          }
        }
        for (const h of meleeHits) {
          h.attacker.hasHitThisSwing = true;
          h.attacker.hitTargetsThisSwing.add(h.defender);
          // 這個 tick 已被別人打中 (剛獲得受擊無敵) 或已倒下：不重複結算
          if (h.defender.invulnTimer > 0 || h.defender.state === "ko") continue;
          this.applyHitEffects(h.attacker, h.defender, h.atk, h.facing, h.hitX, h.hitY);
        }

        for (const proj of this.projectiles) {
          if (!proj.active) continue;
          for (const defender of this.activeFighters) {
            if (defender === proj.owner) continue;
            if (defender.state === "ko" || defender.invulnTimer > 0 || proj.hitTargets.has(defender)) continue;
            const hb = proj.getHitbox(); const hurtbox = defender.getHurtbox();
            if (Math.abs(hb.groundY - hurtbox.groundY) <= hb.depthTolerance && this.rectsOverlap(hb, hurtbox)) {
              if (proj.projType === "boomerang") proj.hitTargets.add(defender);
              else proj.active = false;
              const hitX = proj.facing === 1 ? hurtbox.x + 8 : hurtbox.x + hurtbox.width - 8;
              this.applyHitEffects(proj.owner, defender, proj.attackData, proj.facing, hitX, hb.y + hb.height / 2);
              if (!proj.active) break;
            }
          }
        }
      }

      initVictoryCelebration(winnerPlayer) {
        this.championFighter = winnerPlayer;
        this.victoryTime = 0;
        this.fireworkTimer = 0.55; // 先讓 K.O. 擊飛畫面展示 0.55 秒，再切入總冠軍原圖特寫與煙火
        this.victoryConfetti = [];
        SFX.play("victory");
        if (winnerPlayer?.charDef) {
          SFX.speak(winnerPlayer.charDef.voice?.winCry || winnerPlayer.charDef.winQuote, winnerPlayer.charDef.voice);
        }
        const colors = ["#ffd166", "#ffbe0b", "#ff4d6d", "#00f5d4", "#ff758f", "#9b5de5", "#ffffff"];
        for (let i = 0; i < 80; i++) {
          this.victoryConfetti.push({
            x: Math.random() * CONFIG.canvasWidth,
            y: -20 - Math.random() * CONFIG.canvasHeight,
            vx: (Math.random() - 0.5) * 90,
            vy: 95 + Math.random() * 145,
            w: 7 + Math.random() * 9,
            h: 4 + Math.random() * 6,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 9,
            swayPhase: Math.random() * Math.PI * 2
          });
        }
      }

      spawnVictoryFirework() {
        SFX.play("firework");
        const fx = 110 + Math.random() * (CONFIG.canvasWidth - 220);
        const fy = 75 + Math.random() * 210;
        const palette = ["#ffd166", "#ff4d6d", "#00f5d4", "#ffbe0b", "#c77dff", "#ff758f"];
        const mainColor = palette[Math.floor(Math.random() * palette.length)];
        this.starbursts.push(new HitStarburst(fx, fy, true));
        for (let i = 0; i < 24; i++) {
          const ang = (Math.PI * 2 * i) / 24 + (Math.random() - 0.5) * 0.15;
          const spd = 120 + Math.random() * 220;
          const col = i % 2 === 0 ? mainColor : "#ffffff";
          this.particles.push(new Particle(fx, fy, Math.cos(ang) * spd, Math.sin(ang) * spd, col, 5, 0.55 + Math.random() * 0.25));
        }
      }

      concludeRound(winnerFighter, reasonText) {
        this.roundEndReason = reasonText;

        if (!winnerFighter || winnerFighter === "DRAW") {
          this.koWinner = "DRAW";
          const anyAtMatchPoint = this.activeFighters.some((f) => f.wins + 1 >= CONFIG.winsToMatch);
          if (!anyAtMatchPoint) {
            for (const f of this.activeFighters) {
              f.wins = Math.min(CONFIG.winsToMatch - 1, f.wins + 1);
            }
          }
        } else {
          const winFighter = typeof winnerFighter === "object"
            ? winnerFighter
            : (winnerFighter === "1P" ? this.p1 : this.p2);
          winFighter.wins++;
          this.koWinner = winFighter.customNickname
            ? `${winFighter.id}P ${winFighter.customNickname}`
            : (winFighter.isCOM && this.activeFighters.length === 2 ? "COM" : `${winFighter.id}P`);
        }

        const matchChamp = this.activeFighters.find((f) => f.wins >= CONFIG.winsToMatch);
        if (matchChamp) {
          this.matchWinner = matchChamp.name;
          this.resetTimer = CONFIG.matchOverDelay;
          this.initVictoryCelebration(matchChamp);
        } else {
          this.matchWinner = null;
          this.resetTimer = CONFIG.roundTransitionDelay;
        }
      }

      // =======================================================================
      // 🌐 嚴格伺服器權威：所有玩家 (1P~4P) 僅發送按鍵給伺服器，並接收狀態平滑插值
      // =======================================================================
// 自己角色的走位預測：
      // 伺服器回報的位置永遠比我的按鍵慢一個來回延遲，所以把「最近這段延遲內我下的移動指令」
      // 疊加到伺服器位置上當作目標，按下方向鍵的瞬間角色就會動，放開也會立刻停。
getLatencySec() {
        return Math.min(0.4, (this.rttMs || 90) / 1000 + 0.04);
      }

      // 按鍵當下就給回饋 (起手動作、起跳、衝刺、音效)，不等伺服器來回。
      // 傷害與命中仍由伺服器判定；若伺服器沒有接受這次動作，畫面會在約 0.2 秒內回到正確狀態。
      predictOwnActions(f) {
        if (!this.wsConnected || f.hp <= 0) return;
        if (!(f.state === "idle" || f.state === "move" || f.state === "jump")) return;
        const nowMs = performance.now();
        const latencyMs = this.getLatencySec() * 1000;
        const inp = this.input;

        // 跳躍：拋物線完全可預測，直接在本機走完整段
        if (inp.wasPressed(["KeyY", "Enter", "ShiftRight"]) && f.z <= 0.5 && !this._predJump) {
          this._predJump = { t0: nowMs, confirmUntil: nowMs + latencyMs + 180, confirmed: false };
          this._skipJumpSfxUntil = nowMs + latencyMs + 250;
          f.state = "jump";
          SFX.play("jump");
        }

        // 衝刺
        if (inp.wasPressed(["KeyH", "Slash"]) && nowMs >= this._dashCdUntil) {
          let dx = 0, dy = 0;
          if (inp.isHeld(["KeyA", "ArrowLeft"])) dx -= 1;
          if (inp.isHeld(["KeyD", "ArrowRight"])) dx += 1;
          if (inp.isHeld(["KeyW", "ArrowUp"])) dy -= 1;
          if (inp.isHeld(["KeyS", "ArrowDown"])) dy += 1;
          if (dx === 0 && dy === 0) dx = f.facing;
          const len = Math.hypot(dx, dy);
          const durMs = CONFIG.dashDuration * 1000;
          this._predDash = { until: nowMs + durMs, dx: dx / len, dy: dy / len };
          this._dashCdUntil = nowMs + CONFIG.dashCooldown * 1000;
          this._dashEchoUntil = nowMs + durMs + latencyMs + 100;
          this._predJump = null; // 空中衝刺會暫停下墜，高度改跟伺服器
          f.state = "dash";
          f.dashCooldownTimer = CONFIG.dashCooldown;
          SFX.play("dash");
          return;
        }

        // 出招：先擺出起手式並播放出招音，揮擊與命中等伺服器確認後同步演出
        if (!this._predAttack) {
          const attacks = f.charDef.attacks;
          let atk = null;
          if (inp.wasPressed(["KeyT", "Semicolon", "KeyM"]) && f.energy >= CONFIG.maxEnergy) atk = attacks.ult;
          else if (inp.wasPressed(["KeyF", "Comma"])) atk = attacks.light;
          else if (inp.wasPressed(["KeyG", "Period"])) atk = attacks.heavy;
          if (atk) {
            this._predAttack = { until: nowMs + latencyMs + 170 };
            f.state = "attack_startup";
            f.currentAttack = atk;
            f.stateTimer = atk.startup;
            f.lockedTargetPos = null;
            if (atk.name !== "ult") SFX.play(atk.castSfx || (atk.name === "heavy" ? "heavy" : "light"));
          }
        }
      }

      predictOwnFighter(f, dt) {
        const nowMs = performance.now();
        const now = nowMs / 1000;
        const latency = this.getLatencySec();
        let dashing = false;
        if (this._predDash) {
          dashing = nowMs < this._predDash.until;
          if (!dashing) {
            this._predDash = null;
            if (f.state === "dash") f.state = "idle";
          }
        }
        const free = (f.state === "idle" || f.state === "move" || f.state === "jump") && f.hp > 0;
        let dirX = 0, dirY = 0;
        if (free) {
          if (this.input.isHeld(["KeyA", "ArrowLeft"])) dirX -= 1;
          if (this.input.isHeld(["KeyD", "ArrowRight"])) dirX += 1;
          if (this.input.isHeld(["KeyW", "ArrowUp"])) dirY -= 1;
          if (this.input.isHeld(["KeyS", "ArrowDown"])) dirY += 1;
        }
        const mult = f.charDef.speedMult || 1;
        let vx, vy;
        if (dashing) {
          vx = this._predDash.dx * CONFIG.dashSpeed * mult;
          vy = this._predDash.dy * CONFIG.dashSpeed * 0.72 * mult;
        } else {
          const diag = (dirX !== 0 && dirY !== 0) ? 1 / Math.SQRT2 : 1;
          vx = dirX * diag * CONFIG.moveSpeedX * mult;
          vy = dirY * diag * CONFIG.moveSpeedY * mult;
        }

        const hist = this._predHist;
        hist.push({ t: now, dx: vx * dt, dy: vy * dt });
        while (hist.length && now - hist[0].t > latency) hist.shift();
        let aheadX = 0, aheadY = 0;
        for (const h of hist) { aheadX += h.dx; aheadY += h.dy; }

        const minX = 0, maxX = CONFIG.canvasWidth - f.width;
        const minY = this.currentMap.arenaTopY, maxY = this.currentMap.arenaBottomY;
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const targetX = clamp(f.netTarget.x + aheadX, minX, maxX);
        const targetY = clamp(f.netTarget.y + aheadY, minY, maxY);

        if (free || dashing) {
          f.x = clamp(f.x + vx * dt, minX, maxX);
          f.y = clamp(f.y + vy * dt, minY, maxY);
        }
        if (free) {
          if (dirX !== 0 && dirX !== f.facing) {
            f.facing = dirX;
            this._facingHoldUntil = nowMs + latency * 1000 + 60;
          }
          if (f.state !== "jump") f.state = (dirX !== 0 || dirY !== 0) ? "move" : "idle";
          this._predDir = { x: dirX, y: dirY };
        } else {
          this._predDir = null;
        }
        // 把本機位置拉回權威目標：能自由移動時輕拉 (不搶手感)，被打 / 出招時緊跟伺服器
        const pull = Math.min(1, dt * ((free || dashing) ? 10 : 18));
        f.x += (targetX - f.x) * pull;
        f.y += (targetY - f.y) * pull;

        // 高度：本機預測的跳躍直接照拋物線走；落地後短暫忽略伺服器還在播的「上一跳」
        const pj = this._predJump;
        if (pj) {
          const t = (nowMs - pj.t0) / 1000;
          const z = CONFIG.jumpVelocity * t - 0.5 * CONFIG.gravity * t * t;
          if (z > 0 || t < 0.05) {
            f.z = Math.max(0, z);
            return;
          }
          this._predJump = null;
          this._jumpEchoUntil = nowMs + latency * 1000 + 80;
          f.z = 0;
          if (f.state === "jump") f.state = "idle";
          SFX.play("land");
          return;
        }
        if (nowMs < this._jumpEchoUntil) { f.z = 0; return; }
        f.z += (f.netTarget.z - f.z) * Math.min(1, dt * 20);
      }

      // 命中演出 (單機與連線共用)：定格、震動、鏡頭衝擊、閃白、手機震動
      playHitImpact({ hitX, hitY, isHeavyOrUlt, isUlt, isKo, attId, defId }) {
        if (isHeavyOrUlt) {
          this.shakeTimer = isUlt ? 0.36 : CONFIG.heavyShakeDuration;
          this.shakeIntensity = isUlt ? 16 : CONFIG.heavyShakeIntensity;
          this.zoomPunch = isUlt ? 0.18 : 0.12;
          this.zoomPunchMax = this.zoomPunch;
          this.zoomStrength = isUlt ? 0.055 : 0.03;
          this.zoomFocusX = hitX;
          this.zoomFocusY = hitY;
        } else if (this.shakeTimer < 0.08) {
          // 輕攻擊也給一點點震動，讓每一下都有「打到」的感覺
          this.shakeTimer = 0.08;
          this.shakeIntensity = 7;
        }
        if (isUlt || isKo) this.impactFlash = isKo ? 0.16 : 0.1;

        // 手機震動：自己被打明顯震、自己打中重擊輕震 (iOS 不支援，會自動略過)
        const myId = this.playMode === "online" ? this.onlineMySlot : 1;
        try {
          if (IS_TOUCH_DEVICE && navigator.vibrate && !SFX.muted) {
            if (defId === myId) navigator.vibrate(isHeavyOrUlt ? 45 : 22);
            else if (attId === myId && isHeavyOrUlt) navigator.vibrate(16);
          }
        } catch (_) { }
      }

            sendInputToServer() {
        if (this.playMode !== "online" || !this.wsConnected || !this.ws) return;
        if (this.ws.bufferedAmount > 8192) return; // 避免網路壅塞時按鍵封包堆積
        const held = [];
        const pressed = [];
        if (this.input.isHeld(["KeyW", "ArrowUp"])) held.push("ACT_UP");
        if (this.input.isHeld(["KeyS", "ArrowDown"])) held.push("ACT_DOWN");
        if (this.input.isHeld(["KeyA", "ArrowLeft"])) held.push("ACT_LEFT");
        if (this.input.isHeld(["KeyD", "ArrowRight"])) held.push("ACT_RIGHT");

        if (this.input.wasPressed(["KeyY", "Enter", "ShiftRight"])) pressed.push("ACT_JUMP");
        if (this.input.wasPressed(["KeyF", "Comma"])) pressed.push("ACT_LIGHT");
        if (this.input.wasPressed(["KeyG", "Period"])) pressed.push("ACT_HEAVY");
        if (this.input.wasPressed(["KeyH", "Slash"])) pressed.push("ACT_DASH");
        if (this.input.wasPressed(["KeyT", "Semicolon", "KeyM"])) pressed.push("ACT_ULT");

        const heldKey = held.join(",");
        const now = performance.now();
        // 只在按住方向改變、有按下動作鍵、或按住方向每 180ms 補發一次時才送出，大幅降低上行流量
        if (heldKey === this._lastSentHeldKey && pressed.length === 0 && (held.length === 0 || now - (this._lastInputSendMs || 0) < 180)) {
          return;
        }
        this._lastSentHeldKey = heldKey;
        this._lastInputSendMs = now;

        this.sendWs({
          type: "player_input",
          held,
          pressed
        });
      }

      applyOnlineState(s) {
        if (Number.isInteger(s.rn) && s.rn !== this.roundNumber) SFX.play("round_start");
        this.roundNumber = s.rn ?? this.roundNumber;
        this.roundTimer = s.rt ?? this.roundTimer;
        this.roundIntroTimer = s.ri ?? 0;
        this.koWinner = s.kw || null;
        this.roundEndReason = s.re || "";
        this.resetTimer = s.rst ?? 0;

        if (s.mw && !this.matchWinner) {
          this.matchWinner = s.mw;
          const champ = this.allFighters[(s.cs || 1) - 1] || this.p1;
          this.initVictoryCelebration(champ);
        } else if (!s.mw) {
          this.matchWinner = null;
          this.championFighter = null;
        }
        if (s.mw) {
          this.victoryTime = s.vt ?? this.victoryTime;
        }

        if (Array.isArray(s.fs)) {
          for (const fd of s.fs) {
            const f = this.allFighters[fd.id - 1];
            if (!f) continue;
            const prevState = f._lastServerState || f.state;
            f._lastServerState = fd.st;
            if (fd.hp < f.hp) f.hitFlashTimer = 0.12;
            // 設定網路目標座標，由渲染迴圈做線性插值 (Lerp) 平滑過渡
            f.netTarget = { x: fd.x, y: fd.y, z: fd.z };
            if (!f.hasNetPos || Math.hypot(fd.x - f.x, fd.y - f.y) > 130) {
              f.x = fd.x;
              f.y = fd.y;
              f.z = fd.z;
              f.hasNetPos = true;
            }
            const isMe = fd.id === this.onlineMySlot;
            const nowMs = performance.now();
            let serverFree = fd.st === "idle" || fd.st === "move";
            let adopt = true;          // 是否採用伺服器回報的動作狀態
            let castPredicted = false; // 這次出招的音效是否已在按鍵當下播過
            if (isMe) {
              const st = fd.st;
              const soft = serverFree || st === "jump" || st === "dash"; // 可能只是伺服器還沒收到我的按鍵
              if (!soft && !st.startsWith("attack")) {
                // 被打 / 倒地 / KO：伺服器說了算，取消所有本機預測
                this._predAttack = null; this._predDash = null; this._predJump = null;
                this._jumpEchoUntil = 0; this._dashEchoUntil = 0;
              } else {
                if (this._predAttack) {
                  if (soft && nowMs < this._predAttack.until) adopt = false;
                  else { castPredicted = st === "attack_startup"; this._predAttack = null; }
                }
                if (adopt && this._predDash && nowMs < this._predDash.until && soft) adopt = false;
                if (this._predJump) {
                  if (st === "jump" || fd.z > 0) this._predJump.confirmed = true;
                  else if (!this._predJump.confirmed && nowMs > this._predJump.confirmUntil) this._predJump = null;
                }
                // 本機已經跳完 / 衝完，伺服器還在回報的那一段視為「可自由行動」
                if (st === "jump" && (this._predJump || nowMs < this._jumpEchoUntil)) serverFree = true;
                if (st === "dash" && nowMs < this._dashEchoUntil) serverFree = true;
              }
            }
            if (!(isMe && (!adopt || (serverFree && nowMs < this._facingHoldUntil)))) f.facing = fd.fc;
            f.hp = fd.hp;
            f.trailHp = fd.thp;
            f.energy = fd.en;
            f.wins = fd.w;
            if (!adopt) {
              // 保留本機預測中的起手式 / 衝刺，等伺服器跟上
            } else if (isMe && serverFree && this._predDir) {
              f.state = this._predJump ? "jump" : ((this._predDir.x !== 0 || this._predDir.y !== 0) ? "move" : "idle");
              f.stateTimer = fd.stt;
              f.currentAttack = null;
              f.lockedTargetPos = null;
            } else {
              f.state = fd.st;
              f.stateTimer = fd.stt;
              f.currentAttack = fd.ak ? f.charDef.attacks[fd.ak] : null;
              f.lockedTargetPos = fd.lt ? { x: fd.lt[0], y: fd.lt[1] } : null;
            }
            if (Math.abs((f.animTime || 0) - fd.at) > 0.3) f.animTime = fd.at;
            f.invulnTimer = fd.inv;
            if (fd.st !== prevState) {
              const serverAtk = fd.ak ? f.charDef.attacks[fd.ak] : null;
              if (fd.st === "jump") { if (!(isMe && nowMs < this._skipJumpSfxUntil)) SFX.play("jump"); }
              else if (fd.st === "dash") { if (!(isMe && nowMs < this._dashEchoUntil)) SFX.play("dash"); }
              else if (fd.st === "knockdown") SFX.play("knockdown");
              else if (fd.st === "attack_startup" && !castPredicted && serverAtk && serverAtk.name !== "ult") {
                SFX.play(serverAtk.castSfx || (serverAtk.name === "heavy" ? "heavy" : "light"));
              }
            }
          }
        }

        if (Array.isArray(s.ps)) {
          const prevById = new Map();
          for (const p of this.projectiles) {
            if (p.netId !== undefined) prevById.set(p.netId, p);
          }
          this.projectiles = s.ps.map((pd) => {
            const existing = pd.id !== undefined ? prevById.get(pd.id) : null;
            if (existing) {
              existing.netTarget = { x: pd.x, groundY: pd.gy, z: pd.z };
              existing.facing = pd.fc;
              existing.angle = pd.ang;
              return existing;
            }
            const dummyProj = new Projectile({
              owner: this.p1,
              x: pd.x,
              groundY: pd.gy,
              z: pd.z,
              facing: pd.fc,
              attackData: { projType: pd.pt, width: pd.w, height: pd.h, projSpeed: 0, projLife: 1, offsetZ: 20, depthTolerance: 36 }
            });
            dummyProj.netId = pd.id;
            dummyProj.netTarget = { x: pd.x, groundY: pd.gy, z: pd.z };
            dummyProj.angle = pd.ang;
            return dummyProj;
          });
        }

        if (Array.isArray(s.pk)) {
          this.pickups = s.pk.map((pd) => {
            const pk = new ArenaPickup({ type: pd.t, x: pd.x, groundY: pd.gy, z: pd.z });
            pk.fuseTimer = pd.ft;
            return pk;
          });
        }
      }

      applyOnlineEvent(ev) {
        if (ev.sfx) SFX.play(ev.sfx);
        if (ev.kind === "hit") {
          this.spawnHitSparks(ev.hitX, ev.hitY, ev.isHeavyOrUlt);
          this.starbursts.push(new HitStarburst(ev.hitX, ev.hitY, ev.isHeavyOrUlt));
          this.floatingTexts.push(new FloatingText(ev.hitX, ev.hitY - 18, ev.dmgText, ev.color, ev.scale));
          this.playHitImpact({ hitX: ev.hitX, hitY: ev.hitY, isHeavyOrUlt: !!ev.isHeavyOrUlt, isUlt: !!ev.isUlt, isKo: !!ev.ko, attId: ev.att, defId: ev.def });
          // 命中定格：伺服器在這段時間暫停模擬，前端同步凍結動作，才有「頓一下」的打擊感
          this.netHitstop = Math.max(this.netHitstop, ev.isUlt ? 0.13 : (ev.isHeavyOrUlt ? 0.095 : 0.045));
          const victim = this.allFighters[(ev.def || 0) - 1];
          if (victim) victim.hitFlashTimer = 0.12;
        } else if (ev.kind === "text") {
          this.floatingTexts.push(new FloatingText(ev.x, ev.y, ev.text, ev.color, ev.scale || 1.1));
        } else if (ev.kind === "ult") {
          const caster = this.allFighters[(ev.slot || 1) - 1];
          SFX.play(caster?.charDef?.attacks?.ult?.ultSfx || "ult");
          SFX.speak(caster?.charDef?.voice?.ultCry || caster?.charDef?.ultTitle || ev.ultTitle, caster?.charDef?.voice);
          this.ultBanner = {
            fighterName: caster ? caster.name : ev.fighterName,
            ultTitle: caster?.charDef?.ultTitle || ev.ultTitle,
            photo: ev.photo || caster?.charDef?.photo,
            faceCrop: ev.faceCrop || caster?.charDef?.faceCrop,
            color: ev.color,
            timer: 1.05,
            maxTimer: 1.05
          };
          this.shakeTimer = 0.34;
          this.shakeIntensity = 15;
        }
      }

      update(dt) {
        this.worldTime += dt;
        if (this.scene === "select") { this.updateSelectInput(); return; }
        if (this.input.wasPressed("KeyC")) {
          // 連線時只有房主能用 C 帶全員回房間 (其他人請用選單鍵離開，避免誤觸)
          if (this.playMode !== "online") { this.returnToSelect(); return; }
          if (this.onlineRoom && this.onlineIsHost) { this.sendWs({ type: "return_to_room" }); return; }
        }
        // 隱藏彩蛋：連按 B 鍵 5 下切換判定框顯示
        if (this.input.wasPressed("KeyB")) {
          const now = performance.now();
          this._boxKeyCount = (now - (this._boxKeyLastMs || 0) < 2000) ? (this._boxKeyCount || 0) + 1 : 1;
          this._boxKeyLastMs = now;
          if (this._boxKeyCount >= 5) {
            this._boxKeyCount = 0;
            this.showBoxes = !this.showBoxes;
            this.floatingTexts.push(new FloatingText(CONFIG.canvasWidth / 2, 110, `判定框：${this.showBoxes ? "開啟" : "關閉"}`, "#00f5d4", 1.1));
          }
        }

        // 同步手機虛擬必殺鍵高亮狀態 (依據自己操控的角色)
        const myFighter = (this.playMode === "online" && this.allFighters[this.onlineMySlot - 1])
          ? this.allFighters[this.onlineMySlot - 1]
          : this.p1;
        if (this.vBtnUlt && myFighter) {
          this.vBtnUlt.classList.toggle("ready", myFighter.energy >= CONFIG.maxEnergy);
        }

        if (this.ultBanner) {
          this.ultBanner.timer -= dt;
          if (this.ultBanner.timer <= 0) this.ultBanner = null;
        }
        if (this.shakeTimer > 0) this.shakeTimer = Math.max(0, this.shakeTimer - dt);
        if (this.zoomPunch > 0) this.zoomPunch = Math.max(0, this.zoomPunch - dt);
        if (this.impactFlash > 0) this.impactFlash = Math.max(0, this.impactFlash - dt);

// 連線模式：伺服器權威。自己的走位在本機先行預測 (不必等封包來回)，其他人用插值平滑顯示
        if (this.playMode === "online") {
          this.sendInputToServer();
          this._pingTimer -= dt;
          if (this._pingTimer <= 0 && this.wsConnected) {
            this._pingTimer = 2;
            this.sendWs({ type: "ping", t: performance.now() });
          }
          const me = this.allFighters[this.onlineMySlot - 1];
          if (me && me.netTarget && this.activeFighters.includes(me)) this.predictOwnActions(me);
          const frozen = this.netHitstop > 0;
          if (frozen) this.netHitstop = Math.max(0, this.netHitstop - dt);
          const fighterLerp = Math.min(1, dt * 20);
          for (const f of this.activeFighters) {
            if (!frozen) f.animTime += dt; // 本地持續推進動作幀 (命中定格時暫停)
            if (f.trailHp > f.hp) f.trailHp = Math.max(f.hp, f.trailHp - 45 * dt);
            if (f.hitFlashTimer > 0) f.hitFlashTimer = Math.max(0, f.hitFlashTimer - dt);
            if (f === me && f.dashCooldownTimer > 0) f.dashCooldownTimer = Math.max(0, f.dashCooldownTimer - dt);
            if (!f.netTarget) continue;
            if (f === me) { this.predictOwnFighter(f, dt); continue; }
            f.x += (f.netTarget.x - f.x) * fighterLerp;
            f.y += (f.netTarget.y - f.y) * fighterLerp;
            f.z += (f.netTarget.z - f.z) * fighterLerp;
          }
          const projLerp = Math.min(1, dt * 18);
          for (const p of this.projectiles) {
            if (p.netTarget) {
              p.x += (p.netTarget.x - p.x) * projLerp;
              p.groundY += (p.netTarget.groundY - p.groundY) * projLerp;
              p.z += (p.netTarget.z - p.z) * projLerp;
            }
          }
          if (this.matchWinner && this.championFighter && this.victoryTime >= 0.55) {
            this.fireworkTimer -= dt;
            if (this.fireworkTimer <= 0) {
              this.fireworkTimer = 0.45 + Math.random() * 0.45;
              this.spawnVictoryFirework();
            }
            for (const c of this.victoryConfetti) {
              c.x += c.vx * dt + Math.sin(this.victoryTime * 3.5 + c.swayPhase) * 35 * dt;
              c.y += c.vy * dt;
              c.rot += c.vRot * dt;
              if (c.y > CONFIG.canvasHeight + 24) {
                c.y = -20;
                c.x = Math.random() * CONFIG.canvasWidth;
              }
            }
            if (this.victoryTime > 1.25 && this.onlineIsHost && this.input.wasPressed(["Space", "Enter", "KeyF", "Comma"])) {
              this.sendWs({ type: "rematch_request" });
            }
          }
          for (let i = this.particles.length - 1; i >= 0; i--) { this.particles[i].update(dt); if (this.particles[i].life <= 0) this.particles.splice(i, 1); }
          for (let i = this.afterimages.length - 1; i >= 0; i--) { this.afterimages[i].update(dt); if (this.afterimages[i].life <= 0) this.afterimages.splice(i, 1); }
          for (let i = this.starbursts.length - 1; i >= 0; i--) { this.starbursts[i].update(dt); if (this.starbursts[i].life <= 0) this.starbursts.splice(i, 1); }
          for (let i = this.floatingTexts.length - 1; i >= 0; i--) { this.floatingTexts[i].update(dt); if (this.floatingTexts[i].life <= 0) this.floatingTexts.splice(i, 1); }
          return;
        }

        if (this.roundIntroTimer > 0) this.roundIntroTimer = Math.max(0, this.roundIntroTimer - dt);
        if (this.hitstopTimer > 0) { this.hitstopTimer = Math.max(0, this.hitstopTimer - dt); return; }

        // 每局 60 秒倒數計時
        if (!this.koWinner) {
          this.roundTimer = Math.max(0, this.roundTimer - dt);
        }

        // 更新場上所有參戰角色 (2～4 人)
        for (const f of this.activeFighters) {
          if (f.isCOM) {
            const target = this.getNearestOpponent(f, true);
            if (target) {
              const ai = f.id === 2 && this.activeFighters.length === 2 ? this.comAI : this.comAIs[f.id];
              ai.update(dt, f, target);
              f.update(dt, ai, this);
            } else {
              f.applyPhysics(dt, true, this.currentMap);
            }
          } else {
            f.update(dt, this.input, this);
          }
        }

        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          this.projectiles[i].update(dt);
          if (!this.projectiles[i].active) this.projectiles.splice(i, 1);
        }

        // 聚會掉落道具生成與更新
        if (this.roundIntroTimer <= 0 && !this.koWinner) {
          this.pickupSpawnTimer -= dt;
          if (this.pickupSpawnTimer <= 0 && this.pickups.length < 2) {
            this.pickupSpawnTimer = 8.5 + Math.random() * 3.5;
            const types = ["heal", "energy", "bomb"];
            const type = types[Math.floor(Math.random() * types.length)];
            const px = 140 + Math.random() * (CONFIG.canvasWidth - 280);
            const py = this.currentMap.arenaTopY + 18 + Math.random() * (this.currentMap.arenaBottomY - this.currentMap.arenaTopY - 36);
            this.pickups.push(new ArenaPickup({ type, x: px, groundY: py }));
          }
        }
        for (let i = this.pickups.length - 1; i >= 0; i--) {
          this.pickups[i].update(dt, this);
          if (!this.pickups[i].active) this.pickups.splice(i, 1);
        }

        if (!this.koWinner) {
          this.checkCombatHits();

          // 1. 檢查存活人數 (支援 2～4 人同場大亂鬥，活到最後一人獲勝！)
          const aliveFighters = this.activeFighters.filter((f) => f.hp > 0);
          if (aliveFighters.length <= 1) {
            if (aliveFighters.length === 1) {
              this.concludeRound(aliveFighters[0], "K.O.!");
            } else {
              this.concludeRound("DRAW", "K.O.!");
            }
          }
          // 2. 檢查 60 秒倒數時間到 (TIME OVER! 依剩餘血量百分比最高者獲勝)
          else if (this.roundTimer <= 0) {
            let bestRatio = -1;
            let winners = [];
            for (const f of this.activeFighters) {
              const r = f.hp / f.maxHp;
              if (r > bestRatio + 0.001) {
                bestRatio = r;
                winners = [f];
              } else if (Math.abs(r - bestRatio) <= 0.001) {
                winners.push(f);
              }
            }
            if (winners.length === 1) {
              this.concludeRound(winners[0], "TIME OVER!");
            } else {
              this.concludeRound("DRAW", "TIME OVER!");
            }
          }
        } else {
          if (this.matchWinner && this.championFighter) {
            this.victoryTime += dt;
            if (this.victoryTime >= 0.55) {
              this.fireworkTimer -= dt;
              if (this.fireworkTimer <= 0) {
                this.fireworkTimer = 0.45 + Math.random() * 0.45;
                this.spawnVictoryFirework();
              }
              for (const c of this.victoryConfetti) {
                c.x += c.vx * dt + Math.sin(this.victoryTime * 3.5 + c.swayPhase) * 35 * dt;
                c.y += c.vy * dt;
                c.rot += c.vRot * dt;
                if (c.y > CONFIG.canvasHeight + 24) {
                  c.y = -20;
                  c.x = Math.random() * CONFIG.canvasWidth;
                }
              }
              if (this.victoryTime > 1.25 && this.input.wasPressed(["Space", "Enter", "KeyF", "Comma"])) {
                if (this.playMode === "online") {
                  if (this.onlineIsHost) this.sendWs({ type: "start_online_match" });
                } else {
                  this.startMatch();
                }
                return;
              }
            }
          }

          this.resetTimer -= dt;
          if (this.resetTimer <= 0) {
            if (this.matchWinner) {
              if (this.playMode === "online") {
                if (this.onlineIsHost) this.sendWs({ type: "start_online_match" });
              } else {
                this.startMatch();
              }
            } else {
              this.roundNumber++;
              this.resetRound(false);
            }
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) { this.particles[i].update(dt); if (this.particles[i].life <= 0) this.particles.splice(i, 1); }
        for (let i = this.afterimages.length - 1; i >= 0; i--) { this.afterimages[i].update(dt); if (this.afterimages[i].life <= 0) this.afterimages.splice(i, 1); }
        for (let i = this.starbursts.length - 1; i >= 0; i--) { this.starbursts[i].update(dt); if (this.starbursts[i].life <= 0) this.starbursts.splice(i, 1); }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) { this.floatingTexts[i].update(dt); if (this.floatingTexts[i].life <= 0) this.floatingTexts.splice(i, 1); }
      }

      drawVictoryScreen(ctx) {
        const champ = this.championFighter;
        if (!champ) return;
        const cx = CONFIG.canvasWidth / 2;
        const cy = CONFIG.canvasHeight / 2 - 4;
        const t = Math.max(0, this.victoryTime - 0.55);
        const fadeAlpha = Math.min(1, t / 0.25);

        ctx.save();
        ctx.globalAlpha = fadeAlpha;

        // 1. 深色漸層暗角背景
        const bgGrad = ctx.createRadialGradient(cx, cy, 40, cx, cy, 560);
        bgGrad.addColorStop(0, "rgba(42, 20, 56, 0.86)");
        bgGrad.addColorStop(0.55, "rgba(18, 10, 28, 0.92)");
        bgGrad.addColorStop(1, "rgba(6, 4, 10, 0.96)");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

        // 2. 萬丈金光旋轉背光 (24 道放射光芒)
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.42);
        const rayCount = 24;
        for (let i = 0; i < rayCount; i++) {
          ctx.rotate((Math.PI * 2) / rayCount);
          const rayGrad = ctx.createLinearGradient(0, 0, 580, 0);
          rayGrad.addColorStop(0, i % 2 === 0 ? "rgba(255, 209, 102, 0.34)" : "rgba(255, 77, 109, 0.22)");
          rayGrad.addColorStop(0.65, "rgba(255, 190, 11, 0.08)");
          rayGrad.addColorStop(1, "rgba(255, 190, 11, 0)");
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(580, -34);
          ctx.lineTo(580, 34);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // 3. 背景慶祝煙火與星芒特效
        for (const sb of this.starbursts) sb.draw(ctx);
        for (const p of this.particles) p.draw(ctx);

        // 4. 整張原本圖檔 (Uncropped Full Original Photo) 居中完整展示 + 震撼縮放進場與流光特效
        const img = getCachedImage(champ.charDef.photo);
        const maxW = 450;
        const maxH = 305;
        let drawW = 320;
        let drawH = 280;
        const hasImg = img && img.complete && img.naturalWidth > 0;
        if (hasImg) {
          const iw = img.naturalWidth;
          const ih = img.naturalHeight;
          const scale = Math.min(maxW / iw, maxH / ih);
          drawW = Math.round(iw * scale);
          drawH = Math.round(ih * scale);
        }

        // 進場震撼放大拍入動畫 + 呼吸懸浮感
        const slamT = Math.min(1, t / 0.36);
        const easeOutBack = 1 + 2.2 * Math.pow(slamT - 1, 3) + 1.2 * Math.pow(slamT - 1, 2);
        const introScale = t < 0.36 ? (1.75 - 0.75 * easeOutBack) : (1 + Math.sin(t * 3.2) * 0.015);
        const floatY = t >= 0.36 ? Math.sin(t * 2.6) * 4 : 0;

        ctx.save();
        ctx.translate(cx, cy + floatY);
        ctx.scale(introScale, introScale);

        // 角色專屬霸氣外發光光暈
        const auraPulse = 0.65 + Math.sin(t * 6) * 0.35;
        ctx.save();
        ctx.shadowColor = champ.charDef.themeColor || "#ffd166";
        ctx.shadowBlur = 32 + auraPulse * 18;
        ctx.fillStyle = "#120c18";
        ctx.beginPath();
        ctx.roundRect(-drawW / 2 - 12, -drawH / 2 - 12, drawW + 24, drawH + 24, 16);
        ctx.fill();
        ctx.restore();

        // 雙層皇家鎏金外框
        const frameGrad = ctx.createLinearGradient(-drawW / 2 - 14, -drawH / 2 - 14, drawW / 2 + 14, drawH / 2 + 14);
        frameGrad.addColorStop(0, "#fff3b0");
        frameGrad.addColorStop(0.25, "#ffd166");
        frameGrad.addColorStop(0.5, "#e09f3e");
        frameGrad.addColorStop(0.75, "#ffd166");
        frameGrad.addColorStop(1, "#fff3b0");
        ctx.fillStyle = frameGrad;
        ctx.beginPath();
        ctx.roundRect(-drawW / 2 - 12, -drawH / 2 - 12, drawW + 24, drawH + 24, 16);
        ctx.fill();

        // 內層深色襯底邊框
        ctx.fillStyle = "#181020";
        ctx.beginPath();
        ctx.roundRect(-drawW / 2 - 5, -drawH / 2 - 5, drawW + 10, drawH + 10, 11);
        ctx.fill();

        // 繪製整張未裁切原始照片 + 斜向流光掃過特效
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(-drawW / 2, -drawH / 2, drawW, drawH, 8);
        ctx.clip();

        if (hasImg) {
          ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, -drawW / 2, -drawH / 2, drawW, drawH);
        } else {
          ctx.fillStyle = champ.charDef.themeColor || "#3a2d4c";
          ctx.fillRect(-drawW / 2, -drawH / 2, drawW, drawH);
        }

        // 斜向金屬流光掃過整張照片
        const sweepCycle = (t * 1.15) % 2.4;
        if (sweepCycle < 1.35) {
          const sweepProgress = sweepCycle / 1.35;
          const sweepX = -drawW - 120 + sweepProgress * (drawW * 2 + 240);
          ctx.save();
          ctx.rotate(-0.42);
          const sheenGrad = ctx.createLinearGradient(sweepX - 55, 0, sweepX + 55, 0);
          sheenGrad.addColorStop(0, "rgba(255, 255, 255, 0)");
          sheenGrad.addColorStop(0.5, "rgba(255, 250, 215, 0.52)");
          sheenGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = sheenGrad;
          ctx.fillRect(sweepX - 55, -drawH, 110, drawH * 2);
          ctx.restore();
        }
        ctx.restore();

        // 照片內側亮金細邊框
        ctx.strokeStyle = "rgba(255, 240, 180, 0.88)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-drawW / 2, -drawH / 2, drawW, drawH, 8);
        ctx.stroke();

        // 四角王者菱形寶石雕花
        const corners = [
          [-drawW / 2 - 8, -drawH / 2 - 8],
          [drawW / 2 + 8, -drawH / 2 - 8],
          [-drawW / 2 - 8, drawH / 2 + 8],
          [drawW / 2 + 8, drawH / 2 + 8]
        ];
        for (const [kx, ky] of corners) {
          ctx.save();
          ctx.translate(kx, ky);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "#ff4d6d";
          ctx.strokeStyle = "#fff3b0";
          ctx.lineWidth = 2;
          ctx.fillRect(-7, -7, 14, 14);
          ctx.strokeRect(-7, -7, 14, 14);
          ctx.restore();
        }

        // 照片四周閃爍十字星芒
        const starOffsets = [
          [-drawW / 2 - 26, -drawH / 3, 0.0],
          [drawW / 2 + 26, -drawH / 4, 1.1],
          [-drawW / 2 - 22, drawH / 3, 2.2],
          [drawW / 2 + 28, drawH / 3, 3.3],
          [0, -drawH / 2 - 22, 1.7]
        ];
        for (const [sx, sy, phase] of starOffsets) {
          const sScale = 0.4 + Math.abs(Math.sin(t * 4.5 + phase)) * 0.85;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.scale(sScale, sScale);
          ctx.fillStyle = "#fff8d6";
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const r = k % 2 === 0 ? 13 : 3.5;
            const a = (k * Math.PI) / 4;
            if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        ctx.restore(); // 結束照片縮放座標系

        // 5. 漫天飄落黃金與七彩勝利彩帶 (Confetti)
        for (const c of this.victoryConfetti) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
          ctx.restore();
        }

        // 6. 頂部「三戰兩勝總冠軍 CHAMPION」皇冠雙緞帶橫幅
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const topBannerY = 38;
        const topGrad = ctx.createLinearGradient(cx - 260, topBannerY - 22, cx + 260, topBannerY + 22);
        topGrad.addColorStop(0, "rgba(24, 12, 36, 0)");
        topGrad.addColorStop(0.15, "rgba(181, 23, 158, 0.94)");
        topGrad.addColorStop(0.5, "rgba(247, 37, 133, 0.96)");
        topGrad.addColorStop(0.85, "rgba(181, 23, 158, 0.94)");
        topGrad.addColorStop(1, "rgba(24, 12, 36, 0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(cx - 310, topBannerY - 22, 620, 44);

        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx - 250, topBannerY - 22); ctx.lineTo(cx + 250, topBannerY - 22);
        ctx.moveTo(cx - 250, topBannerY + 22); ctx.lineTo(cx + 250, topBannerY + 22);
        ctx.stroke();

        ctx.font = "900 28px Impact, Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
        ctx.strokeStyle = "#1a0b24";
        ctx.lineWidth = 6;
        const scoreSummary = this.activeFighters.map((f) => `${f.id}P:${f.wins}勝`).join(" ｜ ");
        const topTitle = `🏆 三戰兩勝制・總冠軍 CHAMPION  (${scoreSummary}) 🏆`;
        ctx.strokeText(topTitle, cx, topBannerY + 1);
        ctx.fillStyle = "#ffd166";
        ctx.fillText(topTitle, cx, topBannerY + 1);
        ctx.restore();

        // 7. 底部角色名牌與必殺稱號展示座
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const plateY = CONFIG.canvasHeight - 66;

        ctx.fillStyle = "rgba(15, 9, 24, 0.9)";
        ctx.strokeStyle = "#ffd166";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(cx - 320, plateY - 34, 640, 74, 14);
        ctx.fill();
        ctx.stroke();

        ctx.font = "900 30px Impact, Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
        ctx.strokeStyle = "#3d0814";
        ctx.lineWidth = 6;
        const champLine = `${this.matchWinner}  —  【${champ.charDef.title}】`;
        ctx.strokeText(champLine, cx, plateY - 14);
        ctx.fillStyle = "#ffbe0b";
        ctx.fillText(champLine, cx, plateY - 14);

        if (champ.charDef.winQuote) {
          ctx.font = "bold 16px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.fillStyle = "#ffd166";
          ctx.fillText(champ.charDef.winQuote, cx, plateY + 10);
        }

        ctx.font = "bold 12px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
        ctx.fillStyle = "#d9d0e6";
        const hintLine = `點擊畫面 / 按空白鍵立即再戰 (${Math.max(0, this.resetTimer).toFixed(1)}s) ｜ 點擊「重選角色 / 房間」可更換設定`;
        ctx.fillText(hintLine, cx, plateY + 29);
        ctx.restore();

        ctx.restore();
      }

      drawHUD(ctx) {
        const topY = 14;
        if (this.activeFighters.length <= 2) {
          const barWidth = 315; const barHeight = 20;
          this.drawHealthAndEnergyBar(ctx, 84, topY, barWidth, barHeight, this.p1, this.p1.wins, false, false);
          if (this.activeFighters[1]) {
            this.drawHealthAndEnergyBar(ctx, CONFIG.canvasWidth - 84 - barWidth, topY, barWidth, barHeight, this.activeFighters[1], this.activeFighters[1].wins, true, false);
          }
        } else {
          // 3～4 人大亂鬥雙排緊湊血條與集氣條 HUD
          const barW = 290; const barH = 13;
          const positions = [
            { x: 64, y: 10, right: false },
            { x: CONFIG.canvasWidth - 64 - barW, y: 10, right: true },
            { x: 64, y: 56, right: false },
            { x: CONFIG.canvasWidth - 64 - barW, y: 56, right: true }
          ];
          this.activeFighters.forEach((f, idx) => {
            const pos = positions[idx];
            if (pos) {
              this.drawHealthAndEnergyBar(ctx, pos.x, pos.y, barW, barH, f, f.wins, pos.right, true);
            }
          });
        }

        // 中央頂部：回合數 + 60 秒倒數計時器
        const centerX = CONFIG.canvasWidth / 2;
        const isLowTime = this.roundTimer <= CONFIG.rageTimeThreshold;
        ctx.save();
        const timerGrad = ctx.createLinearGradient(0, topY - 8, 0, topY + 54);
        timerGrad.addColorStop(0, isLowTime ? "#590d22" : "#3b2333");
        timerGrad.addColorStop(1, "#180f18");
        ctx.fillStyle = timerGrad;
        ctx.strokeStyle = isLowTime ? "#ff0054" : "#ffd166";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(centerX - 46, topY - 8, 92, 58, 10);
        ctx.fill();
        ctx.stroke();

        // 回合標籤
        ctx.fillStyle = "#ffd166";
        ctx.font = "bold 11px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
        ctx.textAlign = "center";
        const isMatchPoint = this.activeFighters.filter((f) => f.wins === CONFIG.winsToMatch - 1).length >= 2;
        const roundLabel = isMatchPoint ? "FINAL ROUND" : `ROUND ${this.roundNumber}`;
        ctx.fillText(roundLabel, centerX, topY + 5);

        // 60 秒倒數大數字
        const secNum = Math.ceil(this.roundTimer);
        ctx.font = "900 30px Impact, Arial Black, sans-serif";
        ctx.fillStyle = isLowTime && Math.floor(this.worldTime * 8) % 2 === 0 ? "#ff4d6d" : "#ffffff";
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 4;
        ctx.strokeText(String(secNum).padStart(2, "0"), centerX, topY + 33);
        ctx.fillText(String(secNum).padStart(2, "0"), centerX, topY + 33);

        if (isLowTime && !this.koWinner) {
          ctx.font = "bold 12px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.fillStyle = "#ffbe0b";
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 3;
          ctx.strokeText("🔥 最後決戰：傷害與集氣提升！", centerX, topY + 66);
          ctx.fillText("🔥 最後決戰：傷害與集氣提升！", centerX, topY + 66);
        }
        ctx.restore();

        // 超必殺技施放特寫橫幅 (Super Cut-In)
        if (this.ultBanner) {
          const b = this.ultBanner;
          const alpha = Math.min(1, b.timer * 3);
          ctx.save();
          ctx.globalAlpha = alpha;
          const bannerY = 98;
          const grad = ctx.createLinearGradient(0, bannerY, CONFIG.canvasWidth, bannerY);
          grad.addColorStop(0, "rgba(18, 10, 28, 0.92)");
          grad.addColorStop(0.5, "rgba(181, 23, 158, 0.92)");
          grad.addColorStop(1, "rgba(18, 10, 28, 0.92)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, bannerY, CONFIG.canvasWidth, 64);
          ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, bannerY); ctx.lineTo(CONFIG.canvasWidth, bannerY);
          ctx.moveTo(0, bannerY + 64); ctx.lineTo(CONFIG.canvasWidth, bannerY + 64);
          ctx.stroke();

          drawCroppedPhoto(ctx, b.photo, b.faceCrop, centerX - 240, bannerY + 4, 56, 56, 8, false);
          ctx.textAlign = "left";
          ctx.fillStyle = "#ffd166";
          ctx.font = "bold 15px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.fillText(`⚡ ${b.fighterName} 施放超必殺技！`, centerX - 172, bannerY + 24);
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "#16111c"; ctx.lineWidth = 4;
          ctx.font = "900 26px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.strokeText(`【${b.ultTitle}】`, centerX - 172, bannerY + 52);
          ctx.fillText(`【${b.ultTitle}】`, centerX - 172, bannerY + 52);
          ctx.restore();
        }

        // 開局 ROUND X - FIGHT! 提示 + 《小朋友齊打交》風格直向分割立繪特寫橫幅
        if (this.roundIntroTimer > 0 && !this.koWinner) {
          ctx.save();
          if (this.roundIntroTimer > 0.35 && this.activeFighters.length >= 2) {
            const stripY = CONFIG.canvasHeight / 2 - 96;
            const stripH = 128;
            const count = this.activeFighters.length;
            const sliceW = CONFIG.canvasWidth / count;
            const slant = 24;
            const bgPalettes = [
              ["#1d3557", "#457b9d"],
              ["#023e8a", "#0077b6"],
              ["#2d6a4f", "#52b788"],
              ["#e85d04", "#f48c06"]
            ];
            ctx.fillStyle = "#0b0812";
            ctx.fillRect(0, stripY, CONFIG.canvasWidth, stripH);

            this.activeFighters.forEach((f, idx) => {
              const x0 = idx * sliceW;
              const x1 = (idx + 1) * sliceW;
              ctx.save();
              ctx.beginPath();
              ctx.moveTo(idx === 0 ? 0 : x0 + slant, stripY);
              ctx.lineTo(idx === count - 1 ? CONFIG.canvasWidth : x1 + slant, stripY);
              ctx.lineTo(idx === count - 1 ? CONFIG.canvasWidth : x1 - slant, stripY + stripH);
              ctx.lineTo(idx === 0 ? 0 : x0 - slant, stripY + stripH);
              ctx.closePath();
              ctx.clip();

              const [cTop, cBot] = bgPalettes[idx % bgPalettes.length];
              const pGrad = ctx.createLinearGradient(x0, stripY, x1, stripY + stripH);
              pGrad.addColorStop(0, f.charDef.themeColor || cTop);
              pGrad.addColorStop(1, cBot);
              ctx.fillStyle = pGrad;
              ctx.fillRect(x0 - slant, stripY, sliceW + slant * 2, stripH);

              // 高對比角色特寫頭像
              const crop = f.charDef.faceCrop;
              const img = getCachedImage(f.charDef.photo);
              const size = Math.min(sliceW * 0.92, stripH * 0.95);
              const px = x0 + (sliceW - size) / 2;
              const py = stripY + stripH - size + 6;
              if (img && img.complete && img.naturalWidth > 0 && crop) {
                const iw = img.naturalWidth, ih = img.naturalHeight;
                ctx.drawImage(img, crop.sx * iw, crop.sy * ih, crop.sw * iw, crop.sh * ih, px, py, size, size);
              }
              // 右側動漫硬邊賽璐璐陰影 + 角色名稱底條
              const edgeShade = ctx.createLinearGradient(x0, stripY, x1, stripY + stripH);
              edgeShade.addColorStop(0, "rgba(255,255,255,0.14)");
              edgeShade.addColorStop(0.65, "rgba(0,0,0,0)");
              edgeShade.addColorStop(1, "rgba(10,6,20,0.45)");
              ctx.fillStyle = edgeShade;
              ctx.fillRect(x0 - slant, stripY, sliceW + slant * 2, stripH);
              ctx.restore();

              if (idx > 0) {
                ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x0 + slant, stripY); ctx.lineTo(x0 - slant, stripY + stripH);
                ctx.stroke();
              }
            });

            ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, stripY); ctx.lineTo(CONFIG.canvasWidth, stripY);
            ctx.moveTo(0, stripY + stripH); ctx.lineTo(CONFIG.canvasWidth, stripY + stripH);
            ctx.stroke();
          }

          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          const modeLabel = this.activeFighters.length > 2 ? `${this.activeFighters.length}人大亂鬥・三戰兩勝` : "三戰兩勝";
          const txt = this.roundIntroTimer > 0.45 ? `${roundLabel}  (${modeLabel})` : "FIGHT!!";
          ctx.font = "900 46px Impact, Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.strokeStyle = "#16111c"; ctx.lineWidth = 8;
          ctx.fillStyle = this.roundIntroTimer > 0.45 ? "#ffd166" : "#ff4d5a";
          ctx.strokeText(txt, centerX, CONFIG.canvasHeight / 2 - 28);
          ctx.fillText(txt, centerX, CONFIG.canvasHeight / 2 - 28);
          ctx.restore();
        }

        // 三戰兩勝制總冠軍專屬「整張原圖 + 華麗特效」勝利畫面，或單局結算橫幅
        if (this.koWinner) {
          if (this.matchWinner && this.championFighter && this.victoryTime >= 0.55) {
            this.drawVictoryScreen(ctx);
          } else {
            ctx.save();
            ctx.fillStyle = "rgba(10, 6, 14, 0.74)";
            ctx.fillRect(0, CONFIG.canvasHeight / 2 - 90, CONFIG.canvasWidth, 175);
            ctx.textAlign = "center"; ctx.textBaseline = "middle";

            const scoreLine = this.activeFighters.map((f) => `${f.id}P:${f.wins}勝`).join("  ｜  ");
            ctx.font = "900 24px Impact, Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
            ctx.fillStyle = "#ff4d6d";
            ctx.fillText(`${this.roundEndReason}  ｜  比數  ${scoreLine}`, centerX, CONFIG.canvasHeight / 2 - 58);

            ctx.font = "900 54px Impact, Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
            ctx.fillStyle = "#ffbe0b"; ctx.strokeStyle = "#5a1010"; ctx.lineWidth = 7;
            const mainText = this.matchWinner
              ? `${this.roundEndReason} 勝負已分！`
              : (this.koWinner === "DRAW" ? "本局平手 DRAW!" : `第 ${this.roundNumber} 局勝者：${this.koWinner}!`);
            ctx.strokeText(mainText, centerX, CONFIG.canvasHeight / 2 - 6);
            ctx.fillText(mainText, centerX, CONFIG.canvasHeight / 2 - 6);

            ctx.font = "bold 17px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif"; ctx.fillStyle = "#f4efe6";
            const subText = this.matchWinner
              ? "即將揭曉三戰兩勝總冠軍..."
              : `準備進入第 ${this.roundNumber + 1} 局 (${Math.max(0, this.resetTimer).toFixed(1)}s)...`;
            ctx.fillText(subText, centerX, CONFIG.canvasHeight / 2 + 48);
            ctx.restore();
          }
        }
      }

      drawHealthAndEnergyBar(ctx, x, y, w, h, player, wins, alignRight, compact = false) {
        const hpRatio = Math.max(0, Math.min(1, player.hp / player.maxHp));
        const trailRatio = Math.max(0, Math.min(1, player.trailHp / player.maxHp));
        const energyRatio = Math.max(0, Math.min(1, player.energy / CONFIG.maxEnergy));
        const isEnergyFull = player.energy >= CONFIG.maxEnergy;
        ctx.save();

        // 頭像框
        const portSize = compact ? 40 : 58;
        const portX = alignRight ? x + w + 8 : x - portSize - 8;
        const portY = y - 2;
        ctx.fillStyle = "#1c1522"; ctx.fillRect(portX, portY, portSize, portSize);
        drawCroppedPhoto(ctx, player.charDef.photo, player.charDef.faceCrop, portX + 2, portY + 2, portSize - 4, portSize - 4, 4, false);
        ctx.strokeStyle = player.slotColor || (alignRight ? "#4da3ff" : "#ff4d5a");
        ctx.lineWidth = 2.5;
        ctx.strokeRect(portX, portY, portSize, portSize);

        // 1. 血條 (HP Bar)
        ctx.fillStyle = "rgba(18, 12, 20, 0.88)"; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#f77f00";
        const trailW = w * trailRatio;
        ctx.fillRect(alignRight ? x + (w - trailW) : x, y, trailW, h);

        const hpGrad = ctx.createLinearGradient(0, y, 0, y + h);
        if (hpRatio > 0.28) { hpGrad.addColorStop(0, "#ffe066"); hpGrad.addColorStop(1, "#f4a261"); }
        else { hpGrad.addColorStop(0, "#ff4d6d"); hpGrad.addColorStop(1, "#a4133c"); }
        ctx.fillStyle = hpGrad;
        const hpW = w * hpRatio;
        ctx.fillRect(alignRight ? x + (w - hpW) : x, y, hpW, h);
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.fillRect(alignRight ? x + (w - hpW) : x, y + 1, hpW, Math.max(2, h * 0.2));
        ctx.strokeStyle = "#f4efe6"; ctx.lineWidth = compact ? 1.6 : 2.2; ctx.strokeRect(x, y, w, h);

        // 2. 集氣條 (Energy / Super Bar)
        const ebY = y + h + (compact ? 3 : 5);
        const ebH = compact ? 7 : 11;
        ctx.fillStyle = "rgba(14, 10, 22, 0.9)";
        ctx.fillRect(x, ebY, w, ebH);

        const ebW = w * energyRatio;
        const ebGrad = ctx.createLinearGradient(x, ebY, x + w, ebY);
        if (isEnergyFull) {
          const flash = Math.floor(this.worldTime * 10) % 2 === 0;
          ebGrad.addColorStop(0, flash ? "#fff3b0" : "#ffbe0b");
          ebGrad.addColorStop(0.5, "#ff0054");
          ebGrad.addColorStop(1, "#7209b7");
        } else {
          ebGrad.addColorStop(0, "#00b4d8");
          ebGrad.addColorStop(1, "#7209b7");
        }
        ctx.fillStyle = ebGrad;
        ctx.fillRect(alignRight ? x + (w - ebW) : x, ebY, ebW, ebH);
        ctx.strokeStyle = isEnergyFull ? "#ffd166" : "#8d7ea3";
        ctx.lineWidth = isEnergyFull ? 2.0 : 1.2;
        ctx.strokeRect(x, ebY, w, ebH);

        // 3. 角色名稱、三戰兩勝星號 (★ ☆) 與必殺就緒提示
        ctx.font = compact ? "bold 11px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif" : "bold 13px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
        ctx.textAlign = alignRight ? "right" : "left";
        ctx.strokeStyle = "#000000"; ctx.lineWidth = 3;

        const stars = `${wins >= 1 ? "★" : "☆"}${wins >= 2 ? "★" : "☆"}`;
        const ultHint = isEnergyFull
          ? (player.id === 1 || (this.playMode === "online" && player.id === this.onlineMySlot) ? " 🔥MAX! 按[T]" : " 🔥MAX!")
          : ` 氣${Math.floor(player.energy)}%`;
        const infoText = alignRight
          ? `${ultHint} ｜ ${stars} ${player.name} (${player.hp})`
          : `${player.name} (${player.hp}) ${stars} ｜ ${ultHint}`;

        ctx.fillStyle = isEnergyFull ? "#ffd166" : "#ffffff";
        const textY = ebY + ebH + (compact ? 11 : 15);
        ctx.strokeText(infoText, alignRight ? x + w : x, textY);
        ctx.fillText(infoText, alignRight ? x + w : x, textY);
        ctx.restore();
      }

      // 依螢幕像素密度設定畫布實際解析度 (上限：電腦 2 倍、手機 1.5 倍，效能不足會自動再降)
      applyRenderScale() {
        const rect = this.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const cap = Math.min(this.maxRenderScale, IS_TOUCH_DEVICE ? 1.5 : 2);
        let scale = rect.width > 0 ? (rect.width * dpr) / CONFIG.canvasWidth : 1;
        scale = Math.max(1, Math.min(cap, Math.round(scale * 4) / 4));
        const targetW = Math.round(CONFIG.canvasWidth * scale);
        if (scale === RENDER_SCALE && this.canvas.width === targetW) return;
        RENDER_SCALE = scale;
        this.canvas.width = targetW;
        this.canvas.height = Math.round(CONFIG.canvasHeight * scale);
        CROP_CANVAS_CACHE.clear();
      }

      // 持續掉幀 (低於約 45 FPS) 時自動降低畫布解析度，優先保住操作流暢
      trackFrameTime(frameDt) {
        if (this.scene !== "fight" || frameDt <= 0) return;
        this.frameTimeEma = this.frameTimeEma * 0.95 + frameDt * 0.05;
        this.frameSampleCount++;
        if (this.frameSampleCount >= 150) {
          this.frameSampleCount = 0;
          if (this.frameTimeEma > 0.022 && RENDER_SCALE > 1) {
            this.maxRenderScale = Math.max(1, RENDER_SCALE - 0.25);
            this.applyRenderScale();
            this.frameTimeEma = FIXED_STEP;
          }
        }
      }

      render() {
        const ctx = this.ctx;
        ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
        ctx.save();
        if (this.shakeTimer > 0) {
          const factor = Math.min(1.5, this.shakeTimer / CONFIG.heavyShakeDuration);
          const mag = this.shakeIntensity * factor;
          ctx.translate((Math.random() * 2 - 1) * mag, (Math.random() * 2 - 1) * mag);
        }
        if (this.zoomPunch > 0 && this.scene === "fight") {
          // 重擊 / 必殺命中瞬間，鏡頭朝命中點推近一下再彈回
          const k = 1 + this.zoomStrength * (this.zoomPunch / this.zoomPunchMax);
          ctx.translate(this.zoomFocusX, this.zoomFocusY);
          ctx.scale(k, k);
          ctx.translate(-this.zoomFocusX, -this.zoomFocusY);
        }
        this.currentMap.draw(ctx, this.worldTime);
        if (this.scene === "fight") {
          for (const img of this.afterimages) img.draw(ctx);
          const showHeadTag = this.activeFighters.length > 2 || this.playMode === "online";
          const fighters = [...this.activeFighters].sort((a, b) => a.y - b.y);
          for (const f of fighters) f.draw(ctx, this.showBoxes, showHeadTag);
          for (const pk of this.pickups) pk.draw(ctx);
          for (const proj of this.projectiles) proj.draw(ctx, this.showBoxes);
          for (const p of this.particles) p.draw(ctx);
          for (const s of this.starbursts) s.draw(ctx);
          for (const ft of this.floatingTexts) ft.draw(ctx);
        }
        ctx.restore();
        if (this.impactFlash > 0 && this.scene === "fight") {
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.4, this.impactFlash * 2.6)})`;
          ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
        }
        if (this.scene === "fight") {
          this.drawHUD(ctx);
          if (this.playMode === "online") {
            // 連線品質小標 (右下角)
            const label = this.wsConnected ? (this.rttMs ? `延遲 ${Math.round(this.rttMs)}ms` : "連線中") : "重新連線中…";
            ctx.save();
            ctx.font = "bold 11px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
            ctx.textAlign = "right";
            ctx.textBaseline = "bottom";
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
            ctx.strokeText(label, CONFIG.canvasWidth - 8, CONFIG.canvasHeight - 5);
            ctx.fillStyle = !this.wsConnected ? "#ff8fa3" : (this.rttMs > 180 ? "#ffd166" : "#9ef0b4");
            ctx.fillText(label, CONFIG.canvasWidth - 8, CONFIG.canvasHeight - 5);
            ctx.restore();
          }
        }
      }

loop(now) {
        let frameDt = Math.min(Math.max(0, (now - this.lastTime) / 1000), 0.1);
        this.lastTime = now;
        this.trackFrameTime(frameDt);
        // 60Hz 螢幕的幀時間會在 16.7ms 上下微幅抖動：貼齊成剛好一步，避免偶爾 0 步 / 2 步造成的微卡頓
        // (門檻只涵蓋約 55~66Hz；75Hz 以上的螢幕不貼齊，否則遊戲會變快)
        if (Math.abs(frameDt - FIXED_STEP) < 0.0015) frameDt = FIXED_STEP;
        this.stepAccumulator += frameDt;
        try {
          let steps = 0;
          while (this.stepAccumulator >= FIXED_STEP - 1e-6 && steps < 4) {
            this.stepAccumulator -= FIXED_STEP;
            steps++;
            this.update(FIXED_STEP);
            this.input.endFrame();
          }
          if (steps === 4) this.stepAccumulator = 0;
          this.render();
        } catch (err) {
          console.error("Game loop error:", err);
          this.input.endFrame();
        }
        requestAnimationFrame((t) => this.loop(t));
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const canvas = document.getElementById("gameCanvas");
      const game = new Game(canvas);
      if (/[?&]debug\b/.test(window.location.search)) window.fightGame = game;
    });
  </script>
</body>
