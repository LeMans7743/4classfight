    // =========================================================================
    // 5. 輸入管理 (整合鍵盤 + 觸控虛擬搖桿 + 虛擬五鍵) & 分級 COM AI
    // =========================================================================
    class InputManager {
      constructor() {
        this.held = new Set();
        this.pressed = new Set();
        const gameKeys = new Set([
          "KeyW", "KeyA", "KeyS", "KeyD", "KeyF", "KeyG", "KeyH", "KeyT", "KeyY", "KeyJ",
          "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
          "Space", "Enter", "ShiftRight", "Comma", "Period", "Slash", "Semicolon", "KeyM",
          "KeyC", "KeyB", "Tab"
        ]);
        window.addEventListener("keydown", (e) => {
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
          if (!e.ctrlKey && !e.altKey && !e.metaKey && gameKeys.has(e.code)) {
            e.preventDefault();
          }
          if (!this.held.has(e.code)) this.pressed.add(e.code);
          this.held.add(e.code);
        });
        window.addEventListener("keyup", (e) => { this.held.delete(e.code); });
        window.addEventListener("blur", () => { this.held.clear(); this.pressed.clear(); });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) { this.held.clear(); this.pressed.clear(); }
        });

        this.setupVirtualControls();
      }

      setVirtualCode(code, active) {
        if (active) {
          if (!this.held.has(code)) this.pressed.add(code);
          this.held.add(code);
        } else {
          this.held.delete(code);
        }
      }

      setupVirtualControls() {
        // 1. 綁定左方 8 向滑動虛擬搖桿 (對應 1P WASD)
        const dpadZone = document.getElementById("dpadZone");
        const dpadStick = document.getElementById("dpadStick");
        if (dpadZone && dpadStick) {
          let activePointerId = null;

          const clearDirs = () => {
            this.setVirtualCode("KeyW", false);
            this.setVirtualCode("KeyS", false);
            this.setVirtualCode("KeyA", false);
            this.setVirtualCode("KeyD", false);
            dpadStick.style.transform = "translate(0px, 0px)";
          };

          const updateFromPoint = (clientX, clientY) => {
            const rect = dpadZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = clientX - cx;
            const dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxRadius = rect.width * 0.34;
            const deadzone = 12;

            if (dist < deadzone) {
              clearDirs();
              return;
            }

            const clampedDist = Math.min(dist, maxRadius);
            const angle = Math.atan2(dy, dx);
            const sx = Math.cos(angle) * clampedDist;
            const sy = Math.sin(angle) * clampedDist;
            dpadStick.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;

            this.setVirtualCode("KeyD", dx > deadzone);
            this.setVirtualCode("KeyA", dx < -deadzone);
            this.setVirtualCode("KeyS", dy > deadzone);
            this.setVirtualCode("KeyW", dy < -deadzone);
          };

          dpadZone.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            if (activePointerId !== null) return; // 避免第二根手指搶走搖桿
            activePointerId = e.pointerId;
            try { dpadZone.setPointerCapture(e.pointerId); } catch (_) { }
            updateFromPoint(e.clientX, e.clientY);
          });

          dpadZone.addEventListener("pointermove", (e) => {
            if (e.pointerId !== activePointerId) return;
            updateFromPoint(e.clientX, e.clientY);
          });

          const endStick = (e) => {
            if (e.pointerId !== activePointerId) return;
            activePointerId = null;
            clearDirs();
          };
          dpadZone.addEventListener("pointerup", endStick);
          dpadZone.addEventListener("pointercancel", endStick);
        }

        // 2. 綁定右側五顆街機虛擬按鍵 (含必殺技 ULT)
        const bindBtn = (id, code) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          btn.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            btn.classList.add("pressed");
            this.setVirtualCode(code, true);
            try {
              if (navigator.vibrate) navigator.vibrate(id === "vBtnUlt" && btn.classList.contains("ready") ? 28 : 12);
            } catch (_) { }
          });
          const release = () => {
            btn.classList.remove("pressed");
            this.setVirtualCode(code, false);
          };
          btn.addEventListener("pointerup", release);
          btn.addEventListener("pointercancel", release);
          btn.addEventListener("pointerleave", release);
        };

        bindBtn("vBtnUlt", "KeyT");
        bindBtn("vBtnLight", "KeyF");
        bindBtn("vBtnHeavy", "KeyG");
        bindBtn("vBtnJump", "KeyY");
        bindBtn("vBtnDash", "KeyH");
      }

      isHeld(codes) { return Array.isArray(codes) ? codes.some((c) => this.held.has(c)) : this.held.has(codes); }
      wasPressed(codes) { return Array.isArray(codes) ? codes.some((c) => this.pressed.has(c)) : this.pressed.has(codes); }
      endFrame() { this.pressed.clear(); }
    }

    /**
     * 支援「簡單 / 普通 / 困難」三段難易度與超必殺技施放的 COM AI 控制器
     */
    class COMController {
      constructor() {
        this.thinkTimer = 0;
        this.attackCooldown = 0;
        this.held = new Set();
        this.pressed = new Set();
        this.difficulty = COM_DIFFICULTIES.normal;
      }

      setDifficulty(diffKey) {
        this.difficulty = COM_DIFFICULTIES[diffKey] || COM_DIFFICULTIES.normal;
      }

      holdKey(ctrl) {
        const key = Array.isArray(ctrl) ? ctrl[0] : ctrl;
        if (key) this.held.add(key);
      }

      pressKey(ctrl) {
        const key = Array.isArray(ctrl) ? ctrl[0] : ctrl;
        if (key) this.pressed.add(key);
      }

      update(dt, comPlayer, targetPlayer) {
        this.pressed.clear();
        if (this.attackCooldown > 0) this.attackCooldown = Math.max(0, this.attackCooldown - dt);
        this.thinkTimer -= dt;
        if (this.thinkTimer > 0) return;

        const d = this.difficulty;
        this.thinkTimer = d.reactionMin + Math.random() * d.reactionVar;
        this.held.clear();
        if (comPlayer.state === "ko" || targetPlayer.state === "ko") return;

        // 目標倒地或無敵中：拉開一點距離等起身，不浪費衝刺與大招
        const targetProtected = targetPlayer.state === "knockdown" || targetPlayer.invulnTimer > 0.12;
        const dx = (targetPlayer.x + targetPlayer.width / 2) - (comPlayer.x + comPlayer.width / 2);
        const dy = targetPlayer.y - comPlayer.y;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);
        if (targetProtected) {
          if (absDx < 85) this.holdKey(dx > 0 ? comPlayer.controls.left : comPlayer.controls.right);
          else if (absDx > 160) this.holdKey(dx > 0 ? comPlayer.controls.right : comPlayer.controls.left);
          return;
        }
        const heavy = comPlayer.charDef.attacks.heavy;
        const light = comPlayer.charDef.attacks.light;
        const ult = comPlayer.charDef.attacks.ult;
        const idealRange = (heavy.isProjectile || heavy.trackOpponent) ? 230 : (heavy.offsetX || 0) + heavy.width * 0.72;

        // 1. 深度對位
        if (absDy > d.depthAccuracy) {
          this.holdKey(dy > 0 ? comPlayer.controls.down : comPlayer.controls.up);
        }

        // 2. 水平追擊與衝刺接近
        if (absDx > idealRange + 15) {
          this.holdKey(dx > 0 ? comPlayer.controls.right : comPlayer.controls.left);
          if (absDx > 220 && comPlayer.dashCooldownTimer <= 0 && Math.random() < d.dashChaseChance) {
            this.pressKey(comPlayer.controls.dash);
          }
        } else if (absDx < 36 && Math.random() < 0.35) {
          this.holdKey(dx > 0 ? comPlayer.controls.left : comPlayer.controls.right);
        }

        // 3. 判斷出招時機 (包含集滿氣施放必殺技，並受 attackCooldown 限制避免連發秒殺)
        const facingMatch = (dx >= 0 && comPlayer.facing === 1) || (dx < 0 && comPlayer.facing === -1);
        if (!facingMatch && absDx > 10) {
          this.holdKey(dx > 0 ? comPlayer.controls.right : comPlayer.controls.left);
        } else if (this.attackCooldown <= 0 && targetPlayer.invulnTimer <= 0.05) {
          // 滿氣必殺技判定
          if (
            comPlayer.energy >= CONFIG.maxEnergy &&
            ult &&
            absDy <= (ult.depthTolerance || 65) &&
            (ult.trackOpponent || absDx <= (ult.width || 200) + 60) &&
            Math.random() < d.ultUseChance
          ) {
            this.pressKey(comPlayer.controls.ult);
            this.attackCooldown = (d.attackInterval || 0.65) * 1.4;
            return;
          }

          if (absDy <= light.depthTolerance + 8 && Math.random() < d.aggression) {
            if (
              ((heavy.isProjectile || heavy.trackOpponent) && absDx > 90 && absDx < 450 && Math.random() < 0.42) ||
              (!heavy.isProjectile && !heavy.trackOpponent && absDx <= (heavy.offsetX || 0) + heavy.width + 20 && Math.random() < 0.40)
            ) {
              this.pressKey(comPlayer.controls.heavy);
              this.attackCooldown = (d.attackInterval || 0.65) * (1.1 + Math.random() * 0.4);
            } else if (
              (light.isProjectile && absDx < 290) ||
              (!light.isProjectile && absDx <= light.width + 28)
            ) {
              this.pressKey(comPlayer.controls.light);
              this.attackCooldown = (d.attackInterval || 0.65) * (0.75 + Math.random() * 0.35);
            }
          }
        }

        // 4. 防守閃避反應
        if ((targetPlayer.state === "attack_startup" || targetPlayer.state === "attack_active") && absDx < 135 && absDy < 48) {
          if (Math.random() < d.dodgeChance) {
            if (comPlayer.dashCooldownTimer <= 0) this.pressKey(comPlayer.controls.dash);
            else if (comPlayer.z === 0) this.pressKey(comPlayer.controls.jump);
          }
        }
      }

      isHeld(codes) { return Array.isArray(codes) ? codes.some((c) => this.held.has(c)) : this.held.has(codes); }
      wasPressed(codes) { return Array.isArray(codes) ? codes.some((c) => this.pressed.has(c)) : this.pressed.has(codes); }
    }

    // =========================================================================
    // 6. 特效與多型態飛行道具
    // =========================================================================
    class Particle {
      constructor(x, y, vx, vy, color, size, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size; this.life = life; this.maxLife = life;
      }
      update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.vx *= 0.92; this.vy *= 0.92; this.life -= dt; }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    class HitStarburst {
      constructor(x, y, isHeavy) {
        this.x = x; this.y = y; this.isHeavy = isHeavy;
        this.life = isHeavy ? 0.16 : 0.10; this.maxLife = this.life;
        this.maxR = isHeavy ? 46 : 26;
      }
      update(dt) { this.life -= dt; }
      draw(ctx) {
        const progress = 1 - Math.max(0, this.life / this.maxLife);
        const r = this.maxR * (0.4 + progress * 0.6);
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.isHeavy ? "#ffd166" : "#ffffff";
        ctx.strokeStyle = this.isHeavy ? "#ff5400" : "#ffd166";
        ctx.lineWidth = 2;
        ctx.beginPath();
        const spikes = 8;
        for (let i = 0; i < spikes * 2; i++) {
          const rad = (i % 2 === 0) ? r : r * 0.35;
          const a = (i * Math.PI) / spikes;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    class FloatingText {
      constructor(x, y, text, color, scale = 1) {
        this.x = x; this.y = y; this.vy = -85;
        this.text = text; this.color = color; this.scale = scale;
        this.life = 0.55; this.maxLife = 0.55;
      }
      update(dt) { this.y += this.vy * dt; this.vy *= 0.94; this.life -= dt; }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.font = `900 ${Math.round(18 * this.scale)}px Impact, Arial Black, sans-serif`;
        ctx.textAlign = "center";
        ctx.strokeStyle = "#16111c"; ctx.lineWidth = 4;
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    class Afterimage {
      constructor(x, drawY, width, height, color) {
        this.x = x; this.drawY = drawY; this.width = width; this.height = height;
        this.color = color; this.life = 0.16; this.maxLife = 0.16;
      }
      update(dt) { this.life -= dt; }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, (this.life / this.maxLife) * 0.32);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.roundRect(this.x, this.drawY, this.width, this.height, 8); ctx.fill();
        ctx.restore();
      }
    }

    class Projectile {
      constructor({ owner, x, groundY, z, facing, attackData, vz = 0, speedMult = 1 }) {
        this.owner = owner; this.x = x; this.groundY = groundY; this.z = z;
        this.facing = facing; this.attackData = attackData;
        this.projType = attackData.projType || "orb";
        this.width = attackData.width; this.height = attackData.height;
        this.vx = facing * attackData.projSpeed * speedMult;
        this.vz = vz;
        this.life = attackData.projLife;
        this.maxLife = attackData.projLife;
        this.active = true; this.angle = 0;
        this.hasReturned = false;
        this.hitTargets = new Set();
      }
      getHitbox() {
        return { x: this.x, y: this.groundY - this.z - this.attackData.offsetZ - this.height, width: this.width, height: this.height, groundY: this.groundY, depthTolerance: this.attackData.depthTolerance };
      }
      update(dt) {
        if (this.projType === "boomerang") {
          if (this.life < this.maxLife * 0.52 && !this.hasReturned) {
            this.hasReturned = true; this.hitTargets.clear();
          }
          if (this.hasReturned) {
            const targetX = this.owner.x + this.owner.width / 2;
            const dir = targetX >= this.x ? 1 : -1;
            this.vx += dir * 2400 * dt;
            this.vx = Math.max(-720, Math.min(720, this.vx));
            if (Math.abs(targetX - this.x) < 28) this.active = false;
          }
        }
        if (this.projType === "bouncing_orb") {
          this.vz -= 1500 * dt;
          this.z += this.vz * dt;
          if (this.z <= 0) { this.z = 0; this.vz = 420; SFX.play("stone_bounce"); }
        } else if (this.vz !== 0) {
          this.z = Math.max(0, this.z + this.vz * dt);
        }
        this.x += this.vx * dt;
        this.angle += this.facing * 16 * dt;
        this.life -= dt;
        if (this.life <= 0 || this.x < -80 || this.x > CONFIG.canvasWidth + 80) this.active = false;
      }
      draw(ctx, showBoxes) {
        const hb = this.getHitbox();
        const cx = hb.x + hb.width / 2; const cy = hb.y + hb.height / 2;
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath(); ctx.ellipse(cx, this.groundY, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

        if (this.projType === "coins") {
          ctx.translate(cx, cy); ctx.rotate(this.angle);
          // 千元大鈔疊 + 閃耀金幣外框與方孔
          drawOutlinedRoundRect(ctx, -15, -9, 30, 17, 3, "#2a9d8f", 1.8);
          ctx.strokeStyle = "#a8dadc"; ctx.lineWidth = 1.2;
          ctx.strokeRect(-11, -6, 22, 11);
          ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.6; ctx.stroke();
          ctx.fillStyle = "#e09f3e"; ctx.fillRect(-2.5, -2.5, 5, 5);
        } else if (this.projType === "ink_slash") {
          ctx.translate(cx, cy); ctx.scale(this.facing, 1);
          // 硃砂與玄墨雙層劍氣弧 + 飛濺墨點
          ctx.strokeStyle = "rgba(255, 0, 84, 0.45)"; ctx.lineWidth = 13; ctx.lineCap = "round";
          ctx.beginPath(); ctx.arc(-10, 0, 25, -0.95, 0.95); ctx.stroke();
          ctx.strokeStyle = "#ff0054"; ctx.lineWidth = 7.5;
          ctx.beginPath(); ctx.arc(-10, 0, 24, -0.9, 0.9); ctx.stroke();
          ctx.strokeStyle = "#14101a"; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.arc(-6, 0, 24, -0.8, 0.8); ctx.stroke();
          ctx.fillStyle = "#14101a";
          ctx.beginPath(); ctx.arc(-18, -12, 2.5, 0, Math.PI * 2); ctx.arc(-20, 10, 2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff3b0"; ctx.strokeStyle = "#14101a"; ctx.lineWidth = 2.5;
          ctx.font = "900 16px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.strokeText("判", -6, 6);
          ctx.fillText("判", -6, 6);
        } else if (this.projType === "boomerang") {
          // 旋轉破風光圈 + 不鏽鋼保溫瓶細節
          ctx.strokeStyle = "rgba(206, 212, 218, 0.55)"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(cx, cy, 19, 0, Math.PI * 2); ctx.stroke();
          ctx.translate(cx, cy); ctx.rotate(this.angle * 1.4);
          drawOutlinedRoundRect(ctx, -7, -15, 14, 30, 4, "#ced4da", 2);
          ctx.fillStyle = "#f8f9fa"; ctx.fillRect(-4, -9, 3, 20);
          ctx.fillStyle = "#212529"; ctx.fillRect(-7, -15, 14, 6);
          ctx.fillStyle = "#e63946"; ctx.fillRect(-7, -4, 14, 3);
          ctx.fillStyle = "#52b788"; ctx.fillRect(7, -10, 4, 16);
        } else {
          // 金門鎮風石獅繡球：外圍金光 + 紅彩帶交叉雕紋
          ctx.strokeStyle = "rgba(255, 209, 102, 0.82)"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(cx, cy, this.width * 0.65, 0, Math.PI * 2); ctx.stroke();
          ctx.translate(cx, cy); ctx.rotate(this.angle);
          ctx.fillStyle = "#a59788"; ctx.beginPath(); ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.strokeStyle = "#d90429"; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-this.width * 0.38, 0); ctx.lineTo(this.width * 0.38, 0);
          ctx.moveTo(0, -this.width * 0.38); ctx.lineTo(0, this.width * 0.38);
          ctx.stroke();
          ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(0, 0, this.width / 3.2, 0, Math.PI * 1.5); ctx.stroke();
        }
        ctx.restore();
        if (showBoxes) { ctx.strokeStyle = "#ff0054"; ctx.lineWidth = 2; ctx.strokeRect(hb.x, hb.y, hb.width, hb.height); }
      }
    }

    /**
     * 遠端連線玩家輸入代理器 (將網路傳來的標準動作鍵轉換為 Player 可讀的 InputSource)
     */
    const CANONICAL_NET_CONTROLS = {
      up: "ACT_UP",
      down: "ACT_DOWN",
      left: "ACT_LEFT",
      right: "ACT_RIGHT",
      jump: "ACT_JUMP",
      light: "ACT_LIGHT",
      heavy: "ACT_HEAVY",
      dash: "ACT_DASH",
      ult: "ACT_ULT"
    };

    const SLOT_THEME_COLORS = ["#ff4d5a", "#4da3ff", "#2dc653", "#c77dff"];

    // =========================================================================
    // 7. 玩家角色類別 (支援 2～4 人同場大亂鬥、集氣條 Energy 與超必殺技 Ultimate)
    // =========================================================================
    class Player {
      constructor({ id, x, y, facing, controls, charDef }) {
        this.id = id;
        this.spawnX = x;
        this.spawnY = y;
        this.spawnFacing = facing;
        this.controls = controls;
        this.width = CONFIG.playerWidth;
        this.height = CONFIG.playerHeight;
        this.isCOM = false;
        this.comDiffLabel = "";
        this.customNickname = "";
        this.wins = 0;
        this.energy = 0;
        this.slotColor = SLOT_THEME_COLORS[(id - 1) % 4];
        this.hitTargetsThisSwing = new Set();
        this.setCharacter(charDef);
      }

      setCharacter(charDef) {
        this.charDef = charDef;
        const prefix = this.customNickname
          ? `${this.id}P ${this.customNickname}`
          : (this.isCOM ? `COM[${this.comDiffLabel || "普通"}]` : `${this.id}P`);
        this.name = `${prefix} (${charDef.name})`;
        this.maxHp = charDef.maxHp;
        this.color = charDef.themeColor;
        this.reset(false);
      }

      reset(keepPartialEnergy = false) {
        this.x = this.spawnX; this.y = this.spawnY; this.z = 0;
        this.vx = 0; this.vy = 0; this.vz = 0; this.facing = this.spawnFacing;
        this.hp = this.maxHp; this.trailHp = this.maxHp;
        this.energy = keepPartialEnergy ? Math.min(CONFIG.maxEnergy, Math.round(this.energy * 0.45)) : 0;
        this.state = "idle"; this.stateTimer = 0; this.hitstunTimer = 0;
        this.invulnTimer = 0;         // 受擊後短暫無敵幀，防止被角落無限連段秒殺
        this.attackCooldownTimer = 0; // 收招後出招冷卻
        this.dashCooldownTimer = 0; this.dashDirX = 0; this.dashDirY = 0; this.afterimageTimer = 0;
        this.currentAttack = null;
        this.hasHitThisSwing = false;
        this.hitTargetsThisSwing.clear();
        this.multiHitTimer = 0;
        this.projectileSpawned = false; this.lockedTargetPos = null;
        this.hitFlashTimer = 0; this.animTime = 0;
        this.comboHits = 0; this.comboTimer = 0; this.pendingKnockdown = false; this.knockdownForceTimer = 0;
        this.recentAttackers = new Map(); // attacker -> 最後命中時間 (圍毆判定)
        this.netTarget = null; this.hasNetPos = false;
      }

      // 是否處於被圍毆狀態 (gangUpWindow 秒內被 2 名以上不同對手命中)
      isGangedUp(now) {
        let count = 0;
        for (const [atk, t] of this.recentAttackers) {
          if (now - t <= CONFIG.gangUpWindow) count++;
          else this.recentAttackers.delete(atk);
        }
        return count >= 2;
      }

      addEnergy(amount) {
        this.energy = Math.max(0, Math.min(CONFIG.maxEnergy, this.energy + amount));
      }

      getDrawTopY() { return this.y - this.height - this.z; }
      getHurtbox() { return { x: this.x, y: this.getDrawTopY(), width: this.width, height: this.height, groundY: this.y }; }
      getActiveHitbox() {
        if (this.state !== "attack_active" || !this.currentAttack || this.currentAttack.isProjectile) return null;
        const atk = this.currentAttack;
        if (atk.trackOpponent && this.lockedTargetPos) {
          return { x: this.lockedTargetPos.x - atk.width / 2, y: this.lockedTargetPos.y - atk.height, width: atk.width, height: atk.height, groundY: this.lockedTargetPos.y, depthTolerance: atk.depthTolerance };
        }
        if (atk.centeredHitbox) {
          const cx = this.x + this.width / 2;
          return { x: cx - atk.width / 2, y: this.y - this.z - atk.offsetZ - atk.height, width: atk.width, height: atk.height, groundY: this.y, depthTolerance: atk.depthTolerance };
        }
        const offsetX = atk.offsetX || 0;
        const hx = this.facing === 1 ? this.x + this.width + offsetX : this.x - atk.width - offsetX;
        const hy = this.y - this.z - atk.offsetZ - atk.height;
        return { x: hx, y: hy, width: atk.width, height: atk.height, groundY: this.y, depthTolerance: atk.depthTolerance };
      }

      update(dt, inputSource, game) {
        this.animTime += dt;
        if (this.trailHp > this.hp) this.trailHp = Math.max(this.hp, this.trailHp - 45 * dt);
        if (this.dashCooldownTimer > 0) this.dashCooldownTimer = Math.max(0, this.dashCooldownTimer - dt);
        if (this.hitFlashTimer > 0) this.hitFlashTimer = Math.max(0, this.hitFlashTimer - dt);
        if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
        if (this.attackCooldownTimer > 0) this.attackCooldownTimer = Math.max(0, this.attackCooldownTimer - dt);
        if (this.comboHits > 0) {
          this.comboTimer -= dt;
          if (this.comboTimer <= 0) this.comboHits = 0;
        }

        if (this.state === "ko") { this.applyPhysics(dt, true, game.currentMap); return; }

        // 戰鬥期間隨時間自然微幅集氣 (狂暴時刻雙倍集氣，集氣速度已提升 x1.3)
        const passiveRate = game.isRageTime() ? CONFIG.passiveEnergyPerSec * 2.0 : CONFIG.passiveEnergyPerSec;
        this.addEnergy(passiveRate * dt);

        if (this.state === "hitstun") {
          this.hitstunTimer -= dt;
          if (this.pendingKnockdown) this.knockdownForceTimer -= dt;
          const forceDown = this.pendingKnockdown && this.knockdownForceTimer <= 0;
          // 需要擊倒時：等落地且硬直結束 (或被追打超時) 才倒地
          if ((this.hitstunTimer <= 0 || forceDown) && (!this.pendingKnockdown || this.z <= 0)) {
            if (this.pendingKnockdown) {
              this.pendingKnockdown = false;
              this.state = "knockdown"; this.stateTimer = CONFIG.knockdownDuration;
              this.comboHits = 0;
              this.invulnTimer = Math.max(this.invulnTimer, CONFIG.knockdownDuration + CONFIG.wakeupInvulnTime);
              SFX.play("knockdown");
              game.spawnDust(this.x + this.width / 2, this.y, 8);
            } else {
              this.state = this.z > 0 ? "jump" : "idle";
            }
          }
          this.applyPhysics(dt, true, game.currentMap);
          return;
        }
        if (this.state === "knockdown") {
          this.stateTimer -= dt;
          if (this.stateTimer <= 0) this.state = "idle"; // 起身 (剩餘 wakeupInvulnTime 無敵)
          this.applyPhysics(dt, true, game.currentMap);
          return;
        }
        if (this.state === "dash") {
          this.stateTimer -= dt; this.afterimageTimer -= dt;
          if (this.afterimageTimer <= 0) {
            game.afterimages.push(new Afterimage(this.x, this.getDrawTopY(), this.width, this.height, this.color));
            this.afterimageTimer = 0.035;
          }
          const mult = this.charDef.speedMult;
          this.vx = this.dashDirX * CONFIG.dashSpeed * mult;
          this.vy = this.dashDirY * (CONFIG.dashSpeed * 0.72 * mult);
          if (this.stateTimer <= 0) { this.vx *= 0.35; this.vy *= 0.35; this.state = this.z > 0 ? "jump" : "idle"; }
          this.applyPhysics(dt, false, game.currentMap);
          return;
        }

        if (this.state === "attack_startup" || this.state === "attack_active" || this.state === "attack_recovery") {
          if (!this.currentAttack) {
            this.state = this.z > 0 ? "jump" : "idle";
            this.applyPhysics(dt, true, game.currentMap);
            return;
          }
          this.stateTimer -= dt;
          if (this.state === "attack_active" && this.currentAttack?.multiHitInterval) {
            this.multiHitTimer -= dt;
            if (this.multiHitTimer <= 0) {
              this.hasHitThisSwing = false;
              this.hitTargetsThisSwing.clear();
              this.multiHitTimer = this.currentAttack.multiHitInterval;
            }
          }
          if (this.state === "attack_active" && this.currentAttack?.lungeX) {
            this.vx = this.facing * this.currentAttack.lungeX; this.vy = 0;
          } else if (this.z === 0) { this.vx = 0; this.vy = 0; }

          if (this.state === "attack_active" && (this.currentAttack?.isProjectile || this.currentAttack?.alsoSpawnProjectiles) && !this.projectileSpawned) {
            this.projectileSpawned = true;
            const projSpec = this.currentAttack.alsoSpawnProjectiles || this.currentAttack;
            const px = this.facing === 1 ? this.x + this.width + (projSpec.offsetX || 0) : this.x - projSpec.width - (projSpec.offsetX || 0);
            const count = projSpec.projCount || 1;
            for (let i = 0; i < count; i++) {
              const mid = (count - 1) / 2;
              const vz = count > 1 ? (i - mid) * 90 + (projSpec.projType === "bouncing_orb" ? 280 : 0) : (projSpec.projType === "bouncing_orb" ? 260 : 0);
              const speedMult = count > 1 ? (0.85 + i * 0.14) : 1;
              game.projectiles.push(new Projectile({ owner: this, x: px, groundY: this.y, z: this.z, facing: this.facing, attackData: projSpec, vz, speedMult }));
            }
          }

          if (this.stateTimer <= 0) {
            if (this.state === "attack_startup") {
              this.state = "attack_active"; this.stateTimer = this.currentAttack.active || 0.1;
              this.hasHitThisSwing = false;
              this.hitTargetsThisSwing.clear();
              this.multiHitTimer = this.currentAttack.multiHitInterval || 99;
              this.projectileSpawned = false;
            } else if (this.state === "attack_active") {
              this.state = "attack_recovery"; this.stateTimer = this.currentAttack.recovery || 0.12;
            } else {
              const finishedAtk = this.currentAttack;
              this.currentAttack = null; this.lockedTargetPos = null;
              this.attackCooldownTimer = finishedAtk?.name === "ult" ? 0.35 : (finishedAtk?.name === "heavy" ? 0.12 : 0.04);
              this.state = this.z > 0 ? "jump" : "idle";
            }
          }
          this.applyPhysics(dt, true, game.currentMap);
          return;
        }
        this.handleMovementAndActions(inputSource, game);
        this.applyPhysics(dt, true, game.currentMap);
      }

      handleMovementAndActions(inputSource, game) {
        let dirX = 0; let dirY = 0;
        if (inputSource.isHeld(this.controls.left)) dirX -= 1;
        if (inputSource.isHeld(this.controls.right)) dirX += 1;
        if (inputSource.isHeld(this.controls.up)) dirY -= 1;
        if (inputSource.isHeld(this.controls.down)) dirY += 1;

        const mult = this.charDef.speedMult;
        if (dirX !== 0 && dirY !== 0) {
          const inv = 1 / Math.SQRT2;
          this.vx = dirX * inv * CONFIG.moveSpeedX * mult;
          this.vy = dirY * inv * CONFIG.moveSpeedY * mult;
        } else {
          this.vx = dirX * CONFIG.moveSpeedX * mult;
          this.vy = dirY * CONFIG.moveSpeedY * mult;
        }
        if (dirX !== 0) this.facing = dirX;
        if (this.z === 0) this.state = (dirX !== 0 || dirY !== 0) ? "move" : "idle";

        if (inputSource.wasPressed(this.controls.jump) && this.z === 0) {
          this.vz = CONFIG.jumpVelocity; this.state = "jump";
          SFX.play("jump");
          game.spawnDust(this.x + this.width / 2, this.y, 5);
        }
        if (inputSource.wasPressed(this.controls.dash) && this.dashCooldownTimer <= 0) {
          this.state = "dash"; this.stateTimer = CONFIG.dashDuration;
          this.invulnTimer = Math.max(this.invulnTimer, CONFIG.dashInvulnTime); // 衝刺起手無敵
          this.dashCooldownTimer = CONFIG.dashCooldown; this.afterimageTimer = 0;
          if (dirX !== 0 || dirY !== 0) {
            const len = Math.hypot(dirX, dirY);
            this.dashDirX = dirX / len; this.dashDirY = dirY / len;
          } else { this.dashDirX = this.facing; this.dashDirY = 0; }
          SFX.play("dash");
          game.spawnDust(this.x + this.width / 2, this.y, 6);
          return;
        }

        // 必殺技觸發：嚴格規定「集氣條必須滿 100%」才能施放！
        if (inputSource.wasPressed(this.controls.ult)) {
          if (Math.floor(this.energy) >= CONFIG.maxEnergy && this.charDef.attacks.ult) {
            this.energy = 0;
            this.startAttack(this.charDef.attacks.ult, game);
            game.triggerUltCutIn(this);
            return;
          } else {
            // 未滿 100% 按必殺鍵時給予明確提示與提示音，不可施放
            SFX.play("no_energy");
            game.floatingTexts.push(
              new FloatingText(this.x + this.width / 2, this.getDrawTopY() - 10, `集氣未滿 100% (${Math.floor(this.energy)}%)`, "#adb5bd", 0.9)
            );
          }
        }

        if (this.attackCooldownTimer <= 0) {
          if (inputSource.wasPressed(this.controls.light)) {
            this.startAttack(this.charDef.attacks.light, game);
          } else if (inputSource.wasPressed(this.controls.heavy)) {
            this.startAttack(this.charDef.attacks.heavy, game);
          }
        }
      }

      startAttack(attackData, game) {
        if (typeof attackData === "string") {
          attackData = this.charDef.attacks[attackData];
        }
        if (!attackData) return;
        this.currentAttack = attackData;
        this.state = "attack_startup";
        this.stateTimer = attackData.startup;
        this.hasHitThisSwing = false;
        this.hitTargetsThisSwing.clear();
        this.projectileSpawned = false;
        if (attackData.name !== "ult") {
          SFX.play(attackData.castSfx || (attackData.name === "heavy" ? "heavy" : "light"));
        }
        if (attackData.trackOpponent && game) {
          const opp = game.getNearestOpponent(this);
          if (opp) {
            this.lockedTargetPos = { x: opp.x + opp.width / 2, y: opp.y };
          } else {
            this.lockedTargetPos = { x: this.x + this.facing * 140, y: this.y };
          }
        } else {
          this.lockedTargetPos = null;
        }
      }

      takeHit(attackData, attackerFacing, finalDamage, hurtEnergyMult = 1.0) {
        const hasArmor = this.currentAttack?.superArmor && (this.state === "attack_startup" || this.state === "attack_active");
        const baseDmg = finalDamage !== undefined ? finalDamage : attackData.damage;
        const dmg = hasArmor ? Math.ceil(baseDmg * 0.5) : baseDmg;
        this.hp = Math.max(0, this.hp - dmg);
        this.hitFlashTimer = 0.12;
        this.addEnergy(CONFIG.hurtEnergyGain * hurtEnergyMult);

        // 設定輕量受擊保護無敵幀，僅防止同一幀多重重疊判定瞬間蒸發，不影響正常連段手感
        if (attackData.multiHitInterval) {
          this.invulnTimer = Math.max(this.invulnTimer, attackData.multiHitInterval - 0.015);
        } else {
          this.invulnTimer = Math.max(this.invulnTimer, 0.06);
        }

        if (this.hp <= 0) {
          this.currentAttack = null;
          this.state = "ko"; this.vx = attackerFacing * 380; this.vy = 0; this.vz = 340;
          return dmg;
        }
        if (hasArmor) return dmg;
        this.currentAttack = null; this.lockedTargetPos = null;
        this.state = "hitstun"; this.hitstunTimer = attackData.hitstun || 0.2;
        // 擊倒判定：單發強力上拋，或連續被打達上限 (防無限連段 / 圍毆)
        this.comboHits += 1; this.comboTimer = CONFIG.comboResetTime;
        const isLauncher = !attackData.multiHitInterval && (attackData.knockbackZ || 0) >= CONFIG.knockdownLaunchZ;
        const wasPending = this.pendingKnockdown;
        // 追打超時後不再被打飛 (防空中無限浮空)，讓角色盡快落地倒地
        const juggleLocked = wasPending && this.knockdownForceTimer <= 0;
        if (isLauncher || this.comboHits >= CONFIG.comboKnockdownHits) {
          if (!wasPending) this.knockdownForceTimer = 0.6; // 最多再被追打 0.6 秒就強制倒地
          this.pendingKnockdown = true;
          if (!wasPending && !isLauncher && !(attackData.knockbackZ > 0)) this.vz = 220; // 輕拋起再倒地 (僅第一次)
        }
        this.vx = attackData.knockbackX > 0 ? attackerFacing * attackData.knockbackX : 0;
        this.vy = 0;
        if (attackData.knockbackZ > 0 && !juggleLocked) this.vz = attackData.knockbackZ;
        return dmg;
      }

      applyPhysics(dt, applyGravity = true, mapDef = null) {
        if (this.state === "hitstun" || this.state === "ko" || this.state === "knockdown") {
          const friction = this.z === 0 ? CONFIG.groundFriction : CONFIG.airFriction;
          if (this.vx > 0) this.vx = Math.max(0, this.vx - friction * dt);
          else if (this.vx < 0) this.vx = Math.min(0, this.vx + friction * dt);
        }
        this.x += this.vx * dt; this.y += this.vy * dt;
        if (applyGravity && (this.z > 0 || this.vz !== 0)) {
          const wasHigh = this.z > 8;
          this.vz -= CONFIG.gravity * dt; this.z += this.vz * dt;
          if (this.z <= 0) {
            this.z = 0; this.vz = 0;
            if (this.state === "jump") this.state = "idle";
            if (wasHigh && this.state !== "ko") SFX.play("land");
          }
        }
        const topY = mapDef ? mapDef.arenaTopY : CONFIG.arenaTopY;
        const botY = mapDef ? mapDef.arenaBottomY : CONFIG.arenaBottomY;
        this.x = Math.max(0, Math.min(CONFIG.canvasWidth - this.width, this.x));
        this.y = Math.max(topY, Math.min(botY, this.y));
      }

      draw(ctx, showBoxes, showHeadTag = false) {
        ctx.save();
        const anim = computeAnimPose(this);
        const centerX = this.x + this.width / 2;
        const footY = this.y - this.z;

        if (this.currentAttack?.trackOpponent && this.lockedTargetPos) {
          const tx = this.lockedTargetPos.x; const ty = this.lockedTargetPos.y;
          const isUlt = this.currentAttack?.name === "ult";
          const pillars = isUlt ? [-62, 0, 62] : [0];
          ctx.save();
          for (const pxOff of pillars) {
            const px = tx + pxOff;
            if (this.state === "attack_startup") {
              // 閻羅法陣預警：雙圈符文陣 + 「閻」字封印
              ctx.strokeStyle = isUlt ? "#ff0054" : "#ffbe0b"; ctx.lineWidth = 3;
              ctx.beginPath(); ctx.ellipse(px, ty, 40 * anim.attackProgress + 10, 14, 0, 0, Math.PI * 2); ctx.stroke();
              ctx.fillStyle = "rgba(230, 57, 70, 0.35)";
              ctx.beginPath(); ctx.ellipse(px, ty, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = "rgba(255, 209, 102, 0.78)";
              ctx.font = "900 15px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("閻", px, ty + 5);
            } else if (this.state === "attack_active") {
              const grad = ctx.createLinearGradient(px, ty, px, ty - 140);
              grad.addColorStop(0, isUlt ? "rgba(255, 0, 84, 0.96)" : "rgba(230, 57, 70, 0.96)");
              grad.addColorStop(0.65, "rgba(181, 23, 158, 0.75)");
              grad.addColorStop(1, "rgba(255, 183, 3, 0.08)");
              ctx.fillStyle = grad; ctx.fillRect(px - 38, ty - 135, 76, 135);
              ctx.fillStyle = "#fff3b0"; ctx.fillRect(px - 14, ty - 130, 28, 130);
              ctx.strokeStyle = "#ffbe0b"; ctx.lineWidth = 4;
              ctx.beginPath(); ctx.ellipse(px, ty, 44, 15, 0, 0, Math.PI * 2); ctx.stroke();
              ctx.strokeStyle = "#ff0054"; ctx.lineWidth = 2.5;
              ctx.beginPath(); ctx.ellipse(px, ty - 45, 34, 10, 0, 0, Math.PI * 2); ctx.stroke();
            }
          }
          ctx.restore();
        }

// 柔邊地面陰影 (跳得越高越小越淡)
        const shadowScale = Math.max(0.45, 1 - this.z / 260);
        ctx.save();
        ctx.translate(centerX, this.y);
        ctx.scale(1, 0.3);
        const shadowR = this.width * 0.66 * shadowScale;
        const shadowGrad = ctx.createRadialGradient(0, 0, shadowR * 0.15, 0, 0, shadowR);
        shadowGrad.addColorStop(0, `rgba(0, 0, 0, ${0.55 * shadowScale})`);
        shadowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = shadowGrad;
        ctx.beginPath(); ctx.arc(0, 0, shadowR, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // 腳下 1P~4P 專屬色光圈：半透明光盤 + 外發光 + 細亮線，一眼認出自己
        if (this.state !== "ko") {
          const ringPulse = 1 + Math.sin(this.animTime * 5) * 0.04;
          ctx.save();
          ctx.translate(centerX, this.y);
          ctx.scale(1, 0.3);
          const discR = 31 * ringPulse;
          const disc = ctx.createRadialGradient(0, 0, discR * 0.35, 0, 0, discR);
          disc.addColorStop(0, "rgba(255, 255, 255, 0)");
          disc.addColorStop(1, this.slotColor);
          ctx.globalAlpha = 0.34;
          ctx.fillStyle = disc;
          ctx.beginPath(); ctx.arc(0, 0, discR, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 0.3;
          ctx.strokeStyle = this.slotColor;
          ctx.lineWidth = 7;
          ctx.beginPath(); ctx.arc(0, 0, discR, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
          ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.arc(0, 0, discR, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // 衝刺速度線
        if (this.state === "dash") {
          ctx.save();
          ctx.lineCap = "round";
          for (let i = 0; i < 4; i++) {
            const ly = footY - 18 - i * 19;
            const len = 34 + ((i * 37) % 3) * 12;
            const startX = centerX - this.facing * (20 + i * 5);
            const streak = ctx.createLinearGradient(startX, ly, startX - this.facing * len, ly);
            streak.addColorStop(0, "rgba(255, 255, 255, 0.75)");
            streak.addColorStop(1, "rgba(255, 255, 255, 0)");
            ctx.strokeStyle = streak;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(startX, ly); ctx.lineTo(startX - this.facing * len, ly); ctx.stroke();
          }
          ctx.restore();
        }

        // 集氣滿 100% 腳下與全身金色鬥氣光環
        if (this.energy >= CONFIG.maxEnergy && this.state !== "ko") {
          const pulse = Math.sin(this.animTime * 14) * 5;
          ctx.save();
          ctx.strokeStyle = "rgba(255, 209, 102, 0.85)";
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.ellipse(centerX, this.y, 34 + pulse, 11 + pulse * 0.3, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "rgba(255, 190, 11, 0.18)";
          ctx.beginPath();
          ctx.ellipse(centerX, footY - this.height * 0.48, 32 + pulse * 0.6, 48 + pulse, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 霸體 (Super Armor) 金色護盾外框提示
        if (this.currentAttack?.superArmor && (this.state === "attack_startup" || this.state === "attack_active")) {
          ctx.save();
          ctx.strokeStyle = "rgba(255, 190, 11, 0.88)";
          ctx.fillStyle = "rgba(255, 209, 102, 0.14)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(centerX, footY - this.height * 0.48, 34, 52, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.restore();
        }

        if (this.state === "attack_startup" && (this.currentAttack?.name === "heavy" || this.currentAttack?.name === "ult")) {
          const isUlt = this.currentAttack?.name === "ult";
          ctx.strokeStyle = isUlt ? "#ff0054" : "#ffd166"; ctx.lineWidth = isUlt ? 5 : 3;
          ctx.beginPath(); ctx.arc(centerX, footY - this.height / 2, isUlt ? 56 : 42, 0, Math.PI * 2); ctx.stroke();
        }

        ctx.save();
        // 受擊保護無敵幀微閃爍提示
        if (this.invulnTimer > 0.08 && Math.floor(this.animTime * 28) % 2 === 0) {
          ctx.globalAlpha = 0.62;
        }
        // 受擊瞬間左右抖動 (隨受擊閃光衰減)
        const hitJitter = this.hitFlashTimer > 0 ? (Math.random() * 2 - 1) * 4.5 * (this.hitFlashTimer / 0.12) : 0;
        ctx.translate(centerX + hitJitter, footY);
        ctx.scale(this.facing, 1);
        if (anim.isKO) { ctx.rotate(-Math.PI / 2); ctx.translate(16, 12); }
        else { ctx.scale(anim.squashX, anim.squashY); }

        this.charDef.drawLocalModel(ctx, this, anim);
        ctx.restore();

// 頭頂名牌 (席位色膠囊) 與圓角迷你血條
        if (showHeadTag && this.state !== "ko") {
          const tagY = footY - this.height - 22;
          const barW = 56;
          const hpRatio = Math.max(0, Math.min(1, this.hp / this.maxHp));
          ctx.save();
          ctx.font = "bold 11px Microsoft JhengHei, PingFang TC, Noto Sans TC, Noto Sans CJK TC, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const shortTag = this.customNickname ? `${this.id}P ${this.customNickname}` : (this.isCOM ? `${this.id}P COM` : `${this.id}P`);
          const pillW = Math.min(120, Math.max(34, ctx.measureText(shortTag).width + 14));
          ctx.beginPath();
          ctx.roundRect(centerX - pillW / 2, tagY - 19, pillW, 15, 7.5);
          ctx.fillStyle = "rgba(14, 9, 22, 0.78)";
          ctx.fill();
          ctx.strokeStyle = this.slotColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = "#ffffff";
          ctx.fillText(shortTag, centerX, tagY - 11, pillW - 8);

          ctx.beginPath();
          ctx.roundRect(centerX - barW / 2, tagY, barW, 6, 3);
          ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
          ctx.fill();
          if (hpRatio > 0) {
            const hpGrad = ctx.createLinearGradient(0, tagY, 0, tagY + 6);
            if (hpRatio > 0.3) { hpGrad.addColorStop(0, "#7dffa0"); hpGrad.addColorStop(1, "#1fa64a"); }
            else { hpGrad.addColorStop(0, "#ff9aa8"); hpGrad.addColorStop(1, "#e0254a"); }
            ctx.fillStyle = hpGrad;
            ctx.beginPath();
            ctx.roundRect(centerX - barW / 2, tagY, Math.max(4, barW * hpRatio), 6, 3);
            ctx.fill();
          }
          ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(centerX - barW / 2, tagY, barW, 6, 3);
          ctx.stroke();
          ctx.restore();
        }

        if (this.dashCooldownTimer > 0) {
          const ratio = 1 - this.dashCooldownTimer / CONFIG.dashCooldown;
          ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
          ctx.beginPath(); ctx.roundRect(this.x, this.y + 11, this.width, 4, 2); ctx.fill();
          ctx.fillStyle = "#4cc9f0";
          ctx.beginPath(); ctx.roundRect(this.x, this.y + 11, Math.max(3, this.width * ratio), 4, 2); ctx.fill();
        }

        if (showBoxes) {
          const hurt = this.getHurtbox();
          ctx.strokeStyle = "#38b000"; ctx.lineWidth = 2; ctx.strokeRect(hurt.x, hurt.y, hurt.width, hurt.height);
          const hit = this.getActiveHitbox();
          if (hit) {
            ctx.strokeStyle = "#ff0054"; ctx.lineWidth = 2; ctx.strokeRect(hit.x, hit.y, hit.width, hit.height);
            ctx.strokeStyle = "rgba(255, 209, 102, 0.8)";
            ctx.strokeRect(hit.x, hit.groundY - hit.depthTolerance, hit.width, hit.depthTolerance * 2);
          }
        }
        ctx.restore();
      }
    }

    // =========================================================================
    // 7.5 多層次街機合成音效引擎 + 角色語音合成 (Web Audio API + SpeechSynthesis)
    //     支援超過 28 種角色專屬出招、命中、環境與動作音效，亦可掛載外部音檔
    // =========================================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.whiteNoiseBuf = null;
        this.pinkNoiseBuf = null;
        this.customAudio = new Map(); // 若未來放入外部音檔可透過 registerAudioFile(kind, url) 覆蓋
        this.lastPlayMs = new Map();
        this.muted = false;
        try { this.muted = localStorage.getItem("tunshi_muted") === "1"; } catch (_) { }
      }

      registerAudioFile(kind, url) {
        if (!url || typeof Audio === "undefined") return;
        const a = new Audio(url);
        a.preload = "auto";
        this.customAudio.set(kind, a);
      }

      unlock() {
        if (this.muted) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!this.ctx) this.ctx = new AC();
        if (this.ctx.state === "suspended") this.ctx.resume().catch(() => { });
        this._ensureNoiseBuffers();
      }

      _ensureNoiseBuffers() {
        if (!this.ctx || this.whiteNoiseBuf) return;
        try {
          const sr = this.ctx.sampleRate;
          const len = sr; // 1.0 秒噪音取樣池
          const wBuf = this.ctx.createBuffer(1, len, sr);
          const pBuf = this.ctx.createBuffer(1, len, sr);
          const wData = wBuf.getChannelData(0);
          const pData = pBuf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
          for (let i = 0; i < len; i++) {
            const white = Math.random() * 2 - 1;
            wData[i] = white;
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            pData[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
          }
          this.whiteNoiseBuf = wBuf;
          this.pinkNoiseBuf = pBuf;
        } catch (_) { }
      }

      toggleMute() {
        this.muted = !this.muted;
        try { localStorage.setItem("tunshi_muted", this.muted ? "1" : "0"); } catch (_) { }
        if (this.muted && window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (_) { }
        }
        return this.muted;
      }

      // 合成振盪器基礎層
      _tone(type, fStart, fEnd, dur, vol, delay = 0) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(Math.max(16, fStart), t);
        if (fEnd && fEnd !== fStart) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(16, fEnd), t + dur);
        }
        gain.gain.setValueAtTime(Math.max(0.001, vol), t);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.01);
      }

      // 濾波噪音層 (風聲、爆炸、揮擊破風、金屬敲擊、咬合碎裂)
      _noise(dur, filterType, fStart, fEnd, vol, q = 1.5, delay = 0, usePink = false) {
        this._ensureNoiseBuffers();
        const buf = usePink ? this.pinkNoiseBuf : this.whiteNoiseBuf;
        if (!this.ctx || !buf) return;
        const t = this.ctx.currentTime + delay;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = filterType;
        filter.Q.setValueAtTime(q, t);
        filter.frequency.setValueAtTime(Math.max(30, fStart), t);
        if (fEnd && fEnd !== fStart) {
          filter.frequency.exponentialRampToValueAtTime(Math.max(30, fEnd), t + dur);
        }
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(Math.max(0.001, vol), t);
        gain.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(t, Math.random() * Math.max(0, 0.7 - dur));
        src.stop(t + dur + 0.01);
      }

      // 角色必殺技與勝利台詞語音合成 (利用現有角色名號與台詞素材發聲)
      speak(text, voiceProfile = {}) {
        if (this.muted || !text || typeof window === "undefined" || !("speechSynthesis" in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = "zh-TW";
          utter.pitch = voiceProfile.pitch ?? 1.0;
          utter.rate = voiceProfile.rate ?? 1.1;
          utter.volume = 0.85;
          window.speechSynthesis.speak(utter);
        } catch (_) { }
      }

      play(kind) {
        if (this.muted) return;
        // 節流保護：同一音效 35ms 內不重複疊加爆音
        const nowMs = performance.now();
        const minGap = (kind === "stone_bounce" || kind === "ui_move") ? 65 : 35;
        if (nowMs - (this.lastPlayMs.get(kind) || 0) < minGap) return;
        this.lastPlayMs.set(kind, nowMs);

        // 若有掛載對應外部音檔，優先播放外部音檔
        const ext = this.customAudio.get(kind);
        if (ext) {
          try { ext.currentTime = 0; ext.play().catch(() => { }); return; } catch (_) { }
        }

        if (!this.ctx) this.unlock();
        if (!this.ctx || this.ctx.state !== "running") return;

        switch (kind) {
          // ---- 介面與系統流程音效 ----
          case "ui_move":
            this._tone("triangle", 660, 880, 0.035, 0.07);
            break;
          case "ui_confirm":
            this._tone("triangle", 523.25, 523.25, 0.06, 0.11, 0);
            this._tone("triangle", 783.99, 1046.5, 0.11, 0.13, 0.05);
            break;
          case "no_energy":
            this._tone("sawtooth", 150, 125, 0.06, 0.10, 0);
            this._tone("sawtooth", 125, 98, 0.08, 0.10, 0.07);
            break;
          case "round_start":
            this._tone("sawtooth", 220, 220, 0.28, 0.13, 0);
            this._tone("triangle", 329.6, 329.6, 0.28, 0.12, 0);
            this._tone("sine", 440, 659.25, 0.34, 0.14, 0.08);
            this._noise(0.22, "bandpass", 1200, 450, 0.08, 2.0, 0);
            break;
          case "victory":
            // 總冠軍凱旋四音階號角和弦
            this._tone("triangle", 523.25, 523.25, 0.13, 0.15, 0.00);
            this._tone("triangle", 659.25, 659.25, 0.13, 0.15, 0.11);
            this._tone("triangle", 783.99, 783.99, 0.14, 0.16, 0.22);
            this._tone("sawtooth", 1046.5, 1046.5, 0.42, 0.16, 0.34);
            this._tone("triangle", 523.25, 523.25, 0.42, 0.12, 0.34);
            break;
          case "firework":
            this._tone("sine", 580, 140, 0.09, 0.09);
            this._noise(0.18, "highpass", 1800, 4200, 0.11, 1.2, 0.02);
            break;

          // ---- 移動、跳躍、衝刺、倒地 ----
          case "jump":
            this._tone("sine", 195, 520, 0.11, 0.11);
            this._noise(0.08, "bandpass", 650, 1600, 0.06, 1.8);
            break;
          case "land":
            this._tone("triangle", 115, 42, 0.065, 0.10);
            this._noise(0.05, "lowpass", 420, 120, 0.07, 1.0, 0, true);
            break;
          case "dash":
            this._noise(0.11, "bandpass", 1600, 360, 0.14, 2.2);
            this._tone("sine", 480, 165, 0.09, 0.10);
            break;
          case "knockdown":
            this._tone("triangle", 125, 32, 0.19, 0.22);
            this._noise(0.16, "lowpass", 520, 95, 0.18, 1.2, 0, true);
            break;
          case "stone_bounce":
            this._tone("triangle", 170, 58, 0.07, 0.11);
            this._noise(0.05, "lowpass", 600, 180, 0.07, 1.4, 0, true);
            break;

          // ---- 角色專屬「出招 / 揮擊」音效 (Cast / Swing) ----
          case "cast_coins": // 吊車大王：撒幣清脆金屬聲
            this._tone("sine", 1760, 2640, 0.06, 0.10, 0);
            this._tone("sine", 2350, 3520, 0.07, 0.10, 0.03);
            this._noise(0.06, "highpass", 2500, 5000, 0.06, 2.0);
            break;
          case "cast_crane": // 吊車大王：重機吊臂滑輪降落聲
            this._tone("sawtooth", 440, 130, 0.18, 0.12);
            this._tone("triangle", 220, 75, 0.18, 0.12);
            this._noise(0.15, "bandpass", 900, 280, 0.09, 3.0);
            break;
          case "cast_whip": // 狗王：觸手破風抽鞭
            this._noise(0.10, "bandpass", 520, 2600, 0.14, 2.8);
            this._tone("triangle", 280, 760, 0.08, 0.11);
            break;
          case "cast_bite": // 狗王：狂犬低吼撲咬
            this._tone("sawtooth", 195, 88, 0.13, 0.13);
            this._noise(0.12, "bandpass", 680, 260, 0.12, 2.4, 0, true);
            break;
          case "cast_ink": // 地獄黑面潔：判官筆揮毫破空
            this._noise(0.11, "bandpass", 820, 1950, 0.12, 2.2);
            this._tone("sine", 540, 240, 0.10, 0.10);
            break;
          case "cast_pillar": // 地獄黑面潔：冥府法鐘共鳴
            this._tone("sine", 587.3, 580, 0.22, 0.13);
            this._tone("triangle", 880, 440, 0.20, 0.09);
            this._tone("sine", 293.6, 146.8, 0.22, 0.11);
            break;
          case "cast_boomerang": // 生話戰士：保溫杯迴旋嗡鳴
            this._tone("triangle", 390, 680, 0.11, 0.11, 0);
            this._tone("sine", 585, 340, 0.10, 0.08, 0.04);
            break;
          case "cast_broom": // 生話戰士：大風車掃把旋風
            this._noise(0.22, "bandpass", 380, 1250, 0.15, 2.0, 0, true);
            this._tone("sine", 240, 420, 0.18, 0.09);
            break;
          case "cast_belly": // 請假王：Q彈肚皮彈跳音
            this._tone("sine", 145, 360, 0.07, 0.14, 0);
            this._tone("sine", 360, 175, 0.08, 0.12, 0.05);
            break;
          case "cast_quake": // 請假王：泰山壓頂蓄力低鳴
            this._tone("sawtooth", 110, 42, 0.20, 0.15);
            this._noise(0.18, "lowpass", 360, 90, 0.12, 1.5, 0, true);
            break;
          case "cast_roar": // 風濕爺：鎮風石獅咆哮
            this._tone("sawtooth", 240, 105, 0.15, 0.15);
            this._tone("square", 120, 62, 0.15, 0.10);
            this._noise(0.15, "bandpass", 950, 320, 0.14, 1.8, 0, true);
            break;
          case "cast_stone": // 風濕爺：拋出石獅繡球
            this._tone("triangle", 260, 95, 0.12, 0.12);
            this._noise(0.10, "lowpass", 750, 220, 0.10, 1.5, 0, true);
            break;

          // ---- 角色專屬「命中打擊」音效 (Hit Impact) ----
          case "hit_coins": // 金幣鈔票砸中：清脆收銀機叮噹 + 打擊
            this._tone("triangle", 380, 130, 0.07, 0.15);
            this._tone("sine", 2093, 2637, 0.07, 0.12, 0.01);
            this._tone("sine", 3136, 3951, 0.09, 0.11, 0.04);
            break;
          case "hit_crane": // 吊車巨鉤重擊：鋼鐵巨響 + 重低音震地
            this._tone("sawtooth", 135, 32, 0.24, 0.26);
            this._tone("square", 460, 185, 0.14, 0.15);
            this._tone("sine", 740, 290, 0.12, 0.12);
            this._noise(0.22, "lowpass", 1400, 160, 0.22, 1.8, 0, true);
            break;
          case "hit_whip": // 觸手鞭擊命中：清脆皮鞭啪響

    class ArenaPickup {
      constructor({ type, x, groundY, z = 250 }) {
        this.type = type; // "heal" | "energy" | "bomb"
        this.x = x;
        this.groundY = groundY;
        this.z = z;
        this.vz = 0;
        this.fuseTimer = type === "bomb" ? 2.0 : 12.0; // 炸彈落地 2 秒爆；補品 12 秒消失
        this.active = true;
        this.animTime = 0;
      }
      update(dt, game) {
        this.animTime += dt;
        if (this.z > 0) {
          this.vz -= 520 * dt;
          this.z = Math.max(0, this.z + this.vz * dt);
          if (this.z === 0) {
            this.vz = 0;
            SFX.play("land");
            game.spawnDust(this.x, this.groundY, 6);
          }
          return;
        }
        this.fuseTimer -= dt;
        if (this.type === "bomb") {
          if (this.fuseTimer <= 0) {
            this.explode(game);
            this.active = false;
          }
          return;
        }
        if (this.fuseTimer <= 0) { this.active = false; return; }
        for (const f of game.activeFighters) {
          if (f.state === "ko" || f.hp <= 0 || f.z > 55) continue;
          const fx = f.x + f.width / 2;
          if (Math.abs(fx - this.x) < 38 && Math.abs(f.y - this.groundY) < 34) {
            if (this.type === "heal") {
              const healed = Math.min(f.maxHp - f.hp, 28);
              f.hp = Math.min(f.maxHp, f.hp + 28);
              game.floatingTexts.push(new FloatingText(fx, f.getDrawTopY() - 12, healed > 0 ? `+${healed} HP 🍗` : "滿血 🍗", "#52b788", 1.15));
              SFX.play("pickup_heal");
            } else {
              f.addEnergy(40);
              game.floatingTexts.push(new FloatingText(fx, f.getDrawTopY() - 12, "+40% 氣 ⚡", "#ffd166", 1.15));
              SFX.play("pickup_energy");
            }
            game.spawnHitSparks(this.x, this.groundY - 16, false);
            this.active = false;
            break;
          }
        }
      }
      explode(game) {
        SFX.play("bomb");
        game.shakeTimer = 0.28; game.shakeIntensity = 13;
        game.spawnHitSparks(this.x, this.groundY - 18, true);
        game.starbursts.push(new HitStarburst(this.x, this.groundY - 18, true));
        game.floatingTexts.push(new FloatingText(this.x, this.groundY - 46, "BOOM!! 💣", "#ff4d6d", 1.45));
        const bombAtk = { name: "heavy", damage: 20, hitstun: 0.36, knockbackX: 520, knockbackZ: 320 };
        for (const f of game.activeFighters) {
          if (f.state === "ko" || f.hp <= 0 || f.invulnTimer > 0) continue;
          const fx = f.x + f.width / 2;
          const dist = Math.hypot(fx - this.x, (f.y - this.groundY) * 1.4);
          if (dist <= 130) {
            const dir = fx >= this.x ? 1 : -1;
            const dmg = f.takeHit(bombAtk, dir, 20);
            game.floatingTexts.push(new FloatingText(fx, f.getDrawTopY() - 8, `-${dmg}`, "#ff4d6d", 1.2));
          }
        }
      }
      draw(ctx) {
        const py = this.groundY - this.z;
        const shadowScale = Math.max(0.4, 1 - this.z / 280);
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath(); ctx.ellipse(this.x, this.groundY, 18 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();
        if (this.z > 0) {
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(this.x - 14, py - 24); ctx.lineTo(this.x, py - 6); ctx.moveTo(this.x + 14, py - 24); ctx.lineTo(this.x, py - 6); ctx.stroke();
          ctx.fillStyle = "#ffbe0b";
          ctx.beginPath(); ctx.arc(this.x, py - 24, 15, Math.PI, 0); ctx.fill();
        }
        const bob = this.z === 0 ? Math.sin(this.animTime * 6) * 3 : 0;
        const blink = this.type === "bomb" && this.z === 0 && this.fuseTimer < 0.9 && Math.floor(this.animTime * 16) % 2 === 0;
        ctx.fillStyle = blink ? "#ff0054" : (this.type === "heal" ? "#2dc653" : (this.type === "energy" ? "#ffd166" : "#343a40"));
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(this.x, py - 14 + bob, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.font = "16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const icon = this.type === "heal" ? "🍗" : (this.type === "energy" ? "⚡" : "💣");
        ctx.fillText(icon, this.x, py - 13 + bob);
        ctx.restore();
      }
    }

      getNearestOpponent(fighter, preferVulnerable = false) {
        let best = null;
        let bestDist = Infinity;
        let fallback = null;
        let fallbackDist = Infinity;
        for (const other of this.activeFighters) {
          if (other === fighter || other.state === "ko" || other.hp <= 0) continue;
          const d = Math.hypot((other.x + other.width / 2) - (fighter.x + fighter.width / 2), (other.y - fighter.y) * 1.4);
          if (d < fallbackDist) { fallbackDist = d; fallback = other; }
          if (preferVulnerable && (other.state === "knockdown" || other.invulnTimer > 0.15)) continue;
          if (d < bestDist) {
            bestDist = d;
            best = other;
          }
        }
        return best || fallback;
      }

        return this.roundTimer <= CONFIG.rageTimeThreshold && !this.koWinner;

setWsBadge(kind, text) {
