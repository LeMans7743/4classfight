      // 重連用的身分 token (每個分頁一組)：斷線後伺服器憑它把原本的席位還給你
      getSessionToken() {
        if (this._sessionToken) return this._sessionToken;
        let token = "";
        try { token = sessionStorage.getItem("tunshi_session_token") || ""; } catch (_) { }
        if (token.length < 16) {
          const bytes = new Uint8Array(16);
          if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
          else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
          token = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
          try { sessionStorage.setItem("tunshi_session_token", token); } catch (_) { }
        }
        this._sessionToken = token;
        return token;
      }

      connectWebSocket() {
        const rawUrl = (this.wsUrlInput && this.wsUrlInput.value.trim()) ? this.wsUrlInput.value.trim() : "";
        if (!rawUrl) {
          this.setWsBadge("disconnected", "🔴 請設定伺服器網址");
          return;
        }

        // 自動將 https:// 轉換為 wss://，http:// 轉換為 ws://
        let url = rawUrl;
        if (url.startsWith("http://")) url = "ws://" + url.slice(7);
        else if (url.startsWith("https://")) url = "wss://" + url.slice(8);
        else if (!url.startsWith("ws://") && !url.startsWith("wss://")) url = "wss://" + url;
        url = url.replace(/\/+$/, "");
        if (this.wsUrlInput) this.wsUrlInput.value = url;

        if (typeof WebSocket === "undefined") return;
        if (this._reconnectTimer) { clearTimeout(this._reconnectTimer); this._reconnectTimer = null; }
        try {
          if (this.ws) {
            const old = this.ws;
            this.ws = null;
            try { old.close(); } catch (_) { }
          }
          this.wsConnected = false;
          this.setWsBadge("", this._reconnectAttempt >= 2 ? "⏳ 伺服器喚醒中…" : "⏳ 連線中…");
          const ws = new WebSocket(url);
          this.ws = ws;

          ws.onopen = () => {
            if (this.ws !== ws) return;
            this.wsConnected = true;
            this._reconnectAttempt = 0;
            this._disconnectedAt = 0;
            try { localStorage.setItem("tunshi_tiandi_ws_url", url); } catch (_) { }
            this.setWsBadge("connected", "🟢 已連線");
            this.sendWs({ type: "hello", token: this.getSessionToken() });
            this.sendWs({ type: "get_rooms" });
            if (this.wzPage === "lobby") this.renderPublicRoomList();
          };

          ws.onmessage = (ev) => {
            if (this.ws !== ws) return;
            try {
              this.handleWsMessage(JSON.parse(ev.data));
            } catch (err) {
              console.error("WS message error:", err);
            }
          };

          const onDisconnect = () => {
            if (this.ws !== ws) return;
            this.ws = null;
            this.wsConnected = false;
            if (!this._disconnectedAt) this._disconnectedAt = performance.now();
            if (this.playMode === "online") {
              this.setWsBadge("disconnected", "🟡 重新連線中…");
              this.scheduleReconnect();
            } else {
              this.setWsBadge("disconnected", "🔴 尚未連線");
            }
            if (this.wzPage === "lobby") this.renderPublicRoomList();
          };
          ws.onclose = onDisconnect;
          ws.onerror = onDisconnect;
        } catch (_) {
          this.setWsBadge("disconnected", "🔴 伺服器網址無效");
        }
      }

      // 斷線後自動重連 (0.6s → 1.2s → 2.4s … 最長 8s)。伺服器會保留席位約 20 秒。
      scheduleReconnect() {
        if (this._reconnectTimer || this.playMode !== "online") return;
        if (this.onlineRoom && this._disconnectedAt && performance.now() - this._disconnectedAt > 22000) {
          this.dropOnlineRoom("連線中斷超過 20 秒，已離開房間。重新連上後可以再加入。");
        }
        this._reconnectAttempt++;
        const delay = Math.min(8000, 600 * Math.pow(2, this._reconnectAttempt - 1));
        if (this._reconnectAttempt >= 3) this.setWsBadge("disconnected", "🟡 伺服器喚醒中，請稍候…");
        this._reconnectTimer = setTimeout(() => {
          this._reconnectTimer = null;
          if (this.playMode === "online" && !this.wsConnected) this.connectWebSocket();
        }, delay);
      }

      dropOnlineRoom(message) {
        this.onlineRoom = null;
        this.onlineIsHost = false;
        if (this.scene === "fight" && this.playMode === "online") {
          this.scene = "select";
          this.selectOverlay.classList.remove("hidden");
        }
        if (this.playMode === "online" && this.scene === "select") this.showPage("lobby");
        if (message) this.setGuide(message, true);
      }

      sendWs(payload) {
        if (this.ws && this.wsConnected && this.ws.readyState === 1) {
          try {
            this.ws.send(JSON.stringify(payload));
          } catch (_) { }
        }
      }

      handleWsMessage(msg) {
        if (!msg || !msg.type) return;

        switch (msg.type) {
          case "welcome":
          case "room_list": {
            this.publicRooms = Array.isArray(msg.rooms) ? msg.rooms : [];
            if (this.wzPage === "lobby") this.renderPublicRoomList();
            break;
          }

          case "hello_ack": {
            // 伺服器沒有保留到我們的席位 (斷線太久或伺服器重啟)
            if (!msg.resumed && this.onlineRoom) {
              this.dropOnlineRoom("原本的房間已經不在了，請重新建立或加入。");
            }
            break;
          }

          case "pong": {
            const sample = performance.now() - (Number(msg.t) || 0);
            if (sample >= 0 && sample < 5000) {
              this.rttMs = this.rttMs ? this.rttMs * 0.7 + sample * 0.3 : sample;
            }
            break;
          }

          case "room_error": {
            this.setGuide(`⚠️ ${msg.message}`, true);
            break;
          }

          case "room_state": {
            this.onlineRoom = msg.room;
            this.onlineMySlot = msg.mySlot || 1;
            this.onlineIsHost = !!msg.isHost;
            if (Number.isInteger(this.onlineRoom.mapIndex) && MAP_TEMPLATES[this.onlineRoom.mapIndex]) {
              this.mapIndex = this.onlineRoom.mapIndex;
              this.currentMap = MAP_TEMPLATES[this.mapIndex];
            }
            const mine = this.onlineRoom.players.find((p) => p.slot === this.onlineMySlot);
            if (mine && Number.isInteger(mine.charIndex) && this.scene === "select") this.p1Index = mine.charIndex;
            if (this.scene === "select") {
              // 重新整理 / 重連後伺服器把席位還給我們：即使目前不在連線模式也要回到房間頁
              if (this.playMode !== "online") {
                this.setPlayMode("online");
                this.showPage("room");
              } else if (this.wzPage === "lobby" || this.wzPage === "mode") {
                this.showPage("room");
              } else {
                this.updateSelectUI();
              }
            }
            break;
          }

          case "left_room": {
            this.onlineRoom = null;
            this.onlineIsHost = false;
            if (this.scene === "fight" && this.playMode === "online") {
              this.scene = "select";
              this.selectOverlay.classList.remove("hidden");
            }
            if (this.playMode === "online") this.showPage("lobby");
            break;
          }

          case "match_started": {
            this.onlineRoom = msg.room;
            this.onlineMySlot = msg.mySlot || 1;
            this.onlineIsHost = !!msg.isHost;
            this.startOnlineMatchFromRoom(this.onlineRoom);
            break;
          }

          case "returned_to_room": {
            this.onlineRoom = msg.room;
            this.onlineMySlot = msg.mySlot || 1;
            this.onlineIsHost = !!msg.isHost;
            this.scene = "select";
            this.selectOverlay.classList.remove("hidden");
            this.showPage("room");
            break;
          }

          case "player_left_match": {
            const leaverSlot = msg.slot;
            const f = this.allFighters[leaverSlot - 1];
            if (f && this.activeFighters.includes(f)) {
              f.isCOM = true;
              f.comDiffLabel = "普通";
              f.customNickname = `${msg.leaverName || leaverSlot + "P"}(COM接手)`;
              const prefix = `${f.id}P ${f.customNickname}`;
              f.name = `${prefix} (${f.charDef.name})`;
            }
            if (msg.newHostSlot === this.onlineMySlot) {
              this.onlineIsHost = true;
            }
            break;
          }

          case "game_state": {
            if (this.playMode === "online" && this.scene === "fight" && msg.state) {
              this.applyOnlineState(msg.state);
            }
            break;
          }

          case "game_event": {
            if (this.playMode === "online" && this.scene === "fight" && msg.event) {
              this.applyOnlineEvent(msg.event);
            }
            break;
          }
        }
      }

      // =======================================================================
      // 開戰前流程：1 模式 → 2 角色 → 3 房間 (手機一頁只做一件事)
      // =======================================================================
      setGuide(text, warn = false) {
        if (!this.selectGuideText) return;
        this.selectGuideText.textContent = text || "";
        this.selectGuideText.classList.toggle("warn", !!warn);
      }

      showPage(page) {
        this.wzPage = page;
        const online = this.playMode === "online";
        this.pageEls.forEach((el) => el.classList.toggle("active", el.dataset.page === page));
        const step = page === "mode" ? 1 : (page === "char" ? 2 : 3);
        this.wzStepEl.textContent = `${step} / 3`;
        this.wzDotEls.forEach((dot, i) => dot.classList.toggle("on", i < step));
        const titles = {
          mode: "選擇遊戲模式",
          char: "選擇你的角色",
          lobby: "連線大廳",
          room: online ? "對戰房間" : (this.playMode === "pvp" ? "雙人同機" : "單機挑戰")
        };
        this.wzTitleEl.textContent = titles[page] || "";
        this.wzBackEl.classList.toggle("invisible", page === "mode");
        this.wzBackEl.textContent = (page === "room" && online) ? "‹ 離開房間" : "‹ 返回";
        this.wsStatusBadge.hidden = !(online && (page === "lobby" || page === "room"));

        if (page === "mode") {
          this.setGuide("先選一種玩法，下一步再挑角色。");
          if (!IS_TOUCH_DEVICE) {
            const cards = this.modeCardEls.filter((c) => c.offsetParent !== null);
            const comIdx = cards.findIndex((c) => c.dataset.mode === "com");
            if (!this._modeFocusInit && comIdx >= 0) { this.modeFocus = comIdx; this._modeFocusInit = true; }
            this.modeCardEls.forEach((c) => c.classList.remove("focus"));
            if (cards[this.modeFocus]) cards[this.modeFocus].classList.add("focus");
          }
        } else if (page === "char") {
          this.setGuide(online && this.onlineRoom ? "點卡片換角色，選好按「確定」回房間。" : "點卡片看招式，選好按「下一步」。");
          this.updateSelectUI();
        } else if (page === "lobby") {
          if (!this.wsConnected) this.connectWebSocket();
          else this.sendWs({ type: "get_rooms" });
          const hasServerUrl = !!(this.wsUrlInput && this.wsUrlInput.value.trim());
          if (hasServerUrl) {
            this.setGuide("建立新房間，或點右邊的公開房間直接加入。");
          } else {
            const settings = this.selectOverlay.querySelector(".server-settings");
            if (settings) settings.open = true;
            this.setGuide("尚未設定連線伺服器：請在左下「伺服器設定」貼上網址後按「重新連線」。", true);
          }
          this.renderPublicRoomList();
        } else {
          this.setGuide("");
          this.renderRoomPage();
        }
      }

      goBack() {
        if (this.scene !== "select") return;
        const page = this.wzPage;
        if (page === "char") {
          this.showPage(this.playMode === "online" && this.onlineRoom ? "room" : "mode");
        } else if (page === "lobby") {
          this.showPage("char");
        } else if (page === "room") {
          if (this.playMode !== "online") {
            this.showPage("char");
          } else if (this.wsConnected && this.onlineRoom) {
            this.sendWs({ type: "leave_room" });
          } else {
            this.onlineRoom = null;
            this.onlineIsHost = false;
            this.showPage("lobby");
          }
        }
      }

      goNextFromChar() {
        SFX.play("ui_confirm");
        if (this.playMode === "online") this.showPage(this.onlineRoom ? "room" : "lobby");
        else this.showPage("room");
      }

      setPlayMode(mode) {
        if (IS_TOUCH_DEVICE && mode === "pvp") mode = "com";
        this.playMode = mode;
        this.isComMode = (mode === "com");
        if (mode === "pvp") this.brawlCount = 2;
        const p2KeyBox = document.getElementById("p2KeyBox");
        if (p2KeyBox) p2KeyBox.style.display = mode === "pvp" ? "block" : "none";
        if (mode === "online" && !this.wsConnected) this.connectWebSocket();
      }

      getNickname() {
        const raw = (this.onlineNicknameInput && this.onlineNicknameInput.value || "").trim();
        return raw || "猛將";
      }

      createRoom() {
        if (!this.wsConnected) {
          this.connectWebSocket();
          this.setGuide("正在連線伺服器，連上後請再按一次。", true);
          return;
        }
        const roomId = (this.onlineRoomIdInput?.value || "").trim() || String(Math.floor(1000 + Math.random() * 9000));
        this.sendWs({ type: "create_room", roomId, name: this.getNickname(), charIndex: this.p1Index, mapIndex: this.mapIndex });
      }

      joinRoom(roomId) {
        if (!this.wsConnected) {
          this.connectWebSocket();
          this.setGuide("正在連線伺服器，連上後請再按一次。", true);
          return;
        }
        if (!roomId) {
          this.setGuide("請先輸入房號，或直接點右邊的公開房間。", true);
          return;
        }
        this.sendWs({ type: "join_room", roomId, name: this.getNickname(), charIndex: this.p1Index });
      }

      renderPublicRoomList() {
        const list = this.onlineRoomList;
        if (!list) return;
        list.textContent = "";
        const rooms = this.publicRooms || [];
        if (!this.wsConnected || rooms.length === 0) {
          const empty = document.createElement("div");
          empty.className = "room-empty";
          empty.textContent = !this.wsConnected
            ? ((this.wsUrlInput && this.wsUrlInput.value.trim()) ? "正在連線伺服器…" : "尚未設定連線伺服器")
            : "目前沒有公開房間，按「建立房間」開第一間！";
          list.appendChild(empty);
          return;
        }
        for (const r of rooms) {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "room-item";
          const rid = document.createElement("span");
          rid.className = "rid";
          rid.textContent = `#${r.roomId}`;
          const meta = document.createElement("span");
          meta.className = "rmeta";
          meta.textContent = `${r.hostName} 的房間 · ${MAP_TEMPLATES[r.mapIndex]?.name || MAP_TEMPLATES[0].name}`;
          const stat = document.createElement("span");
          const waiting = r.status === "waiting";
          stat.className = `rstat ${waiting ? "waiting" : "fighting"}`;
          stat.textContent = waiting ? `${r.playerCount}/${r.maxPlayers} 等待中` : "對戰中";
          item.append(rid, meta, stat);
          item.addEventListener("click", () => this.joinRoom(r.roomId));
          list.appendChild(item);
        }
      }

      // 房間 4 個席位的資料 (連線房來自伺服器，單機房來自本機設定)
      getRoomSeats() {
        const seats = [null, null, null, null];
        if (this.playMode === "online") {
          if (!this.onlineRoom) return seats;
          for (const p of this.onlineRoom.players) {
            if (p.slot < 1 || p.slot > 4) continue;
            seats[p.slot - 1] = {
              slot: p.slot, name: p.name, charIndex: p.charIndex,
              isHost: !!p.isHost, isCOM: !!p.isCOM, offline: !!p.offline,
              isMe: p.slot === this.onlineMySlot
            };
          }
          return seats;
        }
        const diffLabel = COM_DIFFICULTIES[this.comDifficulty].label;
        const oppChars = [this.p2Index, this.p3Index, this.p4Index];
        seats[0] = { slot: 1, name: this.playMode === "pvp" ? "1P 玩家" : "你", charIndex: this.p1Index, isMe: true };
        for (let i = 0; i < this.brawlCount - 1; i++) {
          seats[i + 1] = this.playMode === "pvp"
            ? { slot: 2, name: "2P 玩家", charIndex: oppChars[i], isLocalP2: true }
            : { slot: i + 2, name: `電腦 (${diffLabel})`, charIndex: oppChars[i], isCOM: true };
        }
        return seats;
      }

      setSeatChar(slot, charIndex) {
        if (slot === 2) this.p2Index = charIndex;
        else if (slot === 3) this.p3Index = charIndex;
        else if (slot === 4) this.p4Index = charIndex;
      }

      addCom() {
        if (this.playMode === "online") {
          this.sendWs({ type: "add_room_com", comDiff: this.comDifficulty });
          return;
        }
        if (this.playMode !== "com" || this.brawlCount >= 4) return;
        const used = new Set([this.p1Index, this.p2Index, this.p3Index, this.p4Index].slice(0, this.brawlCount));
        let pick = 0;
        while (used.has(pick) && pick < CHARACTER_ROSTER.length - 1) pick++;
        this.brawlCount++;
        this.setSeatChar(this.brawlCount, pick);
        this.renderRoomPage();
      }

      removeCom(slot) {
        if (this.playMode === "online") {
          this.sendWs({ type: "remove_room_com", slot });
          return;
        }
        if (this.brawlCount <= 2) return;
        const chars = [this.p2Index, this.p3Index, this.p4Index];
        const removed = chars.splice(slot - 2, 1)[0];
        chars.push(removed);
        [this.p2Index, this.p3Index, this.p4Index] = chars;
        this.brawlCount--;
        this.renderRoomPage();
      }

      cycleSeatChar(seat) {
        const next = ((seat.charIndex || 0) + 1) % CHARACTER_ROSTER.length;
        if (this.playMode === "online") {
          this.sendWs({ type: "update_room_com", slot: seat.slot, charIndex: next });
          return;
        }
        this.setSeatChar(seat.slot, next);
        this.renderRoomPage();
      }

      renderRoomPage() {
        if (this.wzPage !== "room") return;
        const online = this.playMode === "online";
        const pvp = this.playMode === "pvp";
        const canEdit = online ? this.onlineIsHost : true;
        const seats = this.getRoomSeats();
        const count = seats.filter(Boolean).length;

        this.roomCodeLabel.textContent = online ? "房號" : "模式";
        this.roomCodeText.textContent = online ? (this.onlineRoom ? this.onlineRoom.roomId : "—") : (pvp ? "雙人同機" : "單機挑戰");
        this.btnCopyRoom.style.display = online ? "" : "none";
        this.diffSwitchGroup.style.display = (canEdit && !pvp) ? "" : "none";
        this.mapOptions.classList.toggle("locked", !canEdit);
        if (this.mapChipEls) this.mapChipEls.forEach((c, i) => c.classList.toggle("active", i === this.mapIndex));

        this.roomSlotsEl.textContent = "";
        let addShown = false;
        for (let i = 0; i < 4; i++) {
          const slot = i + 1;
          const seat = seats[i];
          if (!seat) {
            const canAdd = canEdit && !pvp && !addShown;
            const el = document.createElement(canAdd ? "button" : "div");
            el.className = `slot-card empty s${slot}`;
            if (canAdd) {
              addShown = true;
              el.type = "button";
              const plus = document.createElement("span");
              plus.className = "plus";
              plus.textContent = "+";
              const label = document.createElement("span");
              label.textContent = "加入電腦";
              el.append(plus, label);
              el.addEventListener("click", () => this.addCom());
            } else {
              el.textContent = online ? "等待玩家加入…" : "空位";
            }
            this.roomSlotsEl.appendChild(el);
            continue;
          }

          const charDef = CHARACTER_ROSTER[seat.charIndex] || CHARACTER_ROSTER[0];
          const card = document.createElement("div");
          card.className = `slot-card s${slot}${seat.isMe ? " me" : ""}${seat.offline ? " offline" : ""}`;
          const photo = document.createElement("div");
          photo.className = "slot-photo";
          photo.style.backgroundImage = `url("${encodeURI(charDef.photo)}")`;
          photo.style.backgroundPosition = this.photoFocus(charDef);
          const tag = document.createElement("span");
          tag.className = "slot-tag";
          tag.textContent = `${slot}P`;
          const flags = document.createElement("div");
          flags.className = "slot-flags";
          const addFlag = (text) => {
            const flag = document.createElement("span");
            flag.className = "slot-flag";
            flag.textContent = text;
            flags.appendChild(flag);
          };
          if (seat.isHost) addFlag("👑 房主");
          if (seat.isMe && online) addFlag("你");
          if (seat.isCOM) addFlag("電腦");
          if (seat.offline) addFlag("重連中…");

          const info = document.createElement("div");
          info.className = "slot-info";
          const name = document.createElement("div");
          name.className = "slot-name";
          name.textContent = seat.name;
          const charName = document.createElement("div");
          charName.className = "slot-char";
          charName.textContent = charDef.name;
          info.append(name, charName);

          const canCycle = (seat.isCOM && canEdit) || seat.isLocalP2;
          const canRemove = seat.isCOM && canEdit && (online || this.brawlCount > 2);
          if (canCycle || canRemove) {
            const actions = document.createElement("div");
            actions.className = "slot-actions";
            if (canCycle) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = "換角";
              btn.addEventListener("click", () => this.cycleSeatChar(seat));
              actions.appendChild(btn);
            }
            if (canRemove) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = "移除";
              btn.addEventListener("click", () => this.removeCom(seat.slot));
              actions.appendChild(btn);
            }
            info.appendChild(actions);
          }
          card.append(photo, tag, flags, info);
          this.roomSlotsEl.appendChild(card);
        }

        if (online) {
          if (this.onlineIsHost) {
            this.btnStartMatch.disabled = count < 2;
            this.btnStartMatch.textContent = count < 2 ? "至少要 2 人" : `開戰！（${count} 人）`;
            this.roomHintEl.textContent = count < 2 ? "把房號告訴朋友，或按＋加入電腦湊人數" : "人到齊就可以開戰";
          } else {
            this.btnStartMatch.disabled = true;
            this.btnStartMatch.textContent = "等待房主開戰…";
            this.roomHintEl.textContent = `你是 ${this.onlineMySlot}P，可以先換角色`;
          }
        } else {
          this.btnStartMatch.disabled = false;
          this.btnStartMatch.textContent = count > 2 ? `開戰！（${count} 人）` : "開戰！";
          this.roomHintEl.textContent = pvp
            ? "1P：WASD 移動、F 輕 G 重 H 衝 Y 跳 T 必殺 ｜ 2P：方向鍵、, 輕 . 重 / 衝 Enter 跳 ; 必殺"
            : (count < 4 ? "按＋可以再加電腦，最多 4 人亂鬥" : "4 人滿員亂鬥！");
        }
      }

      startFromRoom() {
        if (this.scene !== "select" || this.wzPage !== "room") return;
        if (this.playMode === "online") {
          if (this.onlineRoom && this.onlineIsHost) this.sendWs({ type: "start_online_match" });
        } else {
          this.startMatch();
        }
      }

      // 戰鬥中按「選單 / C」：單機回房間頁；連線房主帶全員回房間；非房主詢問後離開
      requestReturnToSelect() {
        if (this.scene !== "fight") return;
        if (this.playMode === "online" && this.onlineRoom) {
          if (this.onlineIsHost) {
            this.sendWs({ type: "return_to_room" });
          } else if (window.confirm("要離開這場對戰回到大廳嗎？（你的角色會由電腦接手）")) {
            this.sendWs({ type: "leave_room" });
          }
        } else {
          this.returnToSelect();
        }
      }

      setupUIEvents() {
        // 點完按鈕就取消焦點，避免之後按空白鍵 / Enter 又觸發同一顆按鈕
        this.selectOverlay.addEventListener("click", (e) => {
          const btn = e.target.closest && e.target.closest("button");
          if (btn) btn.blur();
        });

        this.wzBackEl.addEventListener("click", () => this.goBack());

        document.getElementById("btnChangeChar").addEventListener("click", () => this.showPage("char"));
        this.btnStartMatch.addEventListener("click", () => this.startFromRoom());

        // COM 難度

          btn.addEventListener("click", () => {

            for (let i = 1; i <= 4; i++) this.comAIs[i].setDifficulty(this.comDifficulty);
            if (this.playMode === "online" && this.onlineRoom && this.onlineIsHost) {
              for (const p of this.onlineRoom.players) {
                if (p.isCOM) this.sendWs({ type: "update_room_com", slot: p.slot, comDiff: this.comDifficulty });

        // 連線大廳

        if (this.onlineNicknameInput) {
          this.onlineNicknameInput.addEventListener("change", () => {
            try { localStorage.setItem("tunshi_nickname", this.getNickname()); } catch (_) { }

        document.getElementById("btnConnectWs").addEventListener("click", () => {
          this._reconnectAttempt = 0;

        document.getElementById("btnJoinRoomById").addEventListener("click", () => {

        this.btnCopyRoom.addEventListener("click", () => {
          const roomId = this.onlineRoom ? String(this.onlineRoom.roomId) : "";
          if (!roomId) return;
          const done = () => this.setGuide(`已複製房號 ${roomId}，貼給朋友就能加入。`);
          const fail = () => this.setGuide(`房號是 ${roomId}，請告訴朋友。`);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(roomId).then(done, fail);
          } else {
            fail();
          }
        });

        // 回到前景時若連線已斷，立刻重連 (手機切 App / 鎖屏後回來)
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && this.playMode === "online" && !this.wsConnected) {
            this._reconnectAttempt = 0;
            this.connectWebSocket();
          }
        });

        document.getElementById("btnTopSelect").addEventListener("click", (e) => {
          e.currentTarget.blur();
          this.requestReturnToSelect();
        });

        // 隱藏彩蛋：連續點擊左上角標題 5 下可切換判定框顯示
        const titleH1 = document.querySelector(".title-bar h1");
        if (titleH1) {
          let titleClicks = 0, lastClickMs = 0;
          titleH1.addEventListener("click", () => {
            const now = performance.now();
            titleClicks = (now - lastClickMs < 2000) ? titleClicks + 1 : 1;
            lastClickMs = now;
            if (titleClicks >= 5) {
              titleClicks = 0;
              this.showBoxes = !this.showBoxes;
              if (this.scene === "fight") {
                this.floatingTexts.push(new FloatingText(CONFIG.canvasWidth / 2, 110, `判定框：${this.showBoxes ? "開啟" : "關閉"}`, "#00f5d4", 1.1));
              }

        // 音效解鎖與靜音切換
        const syncMuteButtons = () => {
          const topMute = document.getElementById("btnTopMute");
          const touchMute = document.getElementById("btnTouchMute");
          if (topMute) topMute.textContent = SFX.muted ? "🔇 靜音" : "🔊 音效";
          if (touchMute) touchMute.textContent = SFX.muted ? "🔇" : "🔊";
        };
        syncMuteButtons();
        const toggleMuteHandler = (e) => {
          e.currentTarget.blur();
          SFX.toggleMute();
          if (!SFX.muted) SFX.unlock();
          syncMuteButtons();
        };
        document.getElementById("btnTopMute")?.addEventListener("click", toggleMuteHandler);
        document.getElementById("btnTouchMute")?.addEventListener("click", toggleMuteHandler);
        const unlockAudio = () => SFX.unlock();
        window.addEventListener("pointerdown", unlockAudio, { passive: true });
        window.addEventListener("keydown", unlockAudio, { passive: true });

        // 在總冠軍勝利畫面點擊 Canvas 可直接開啟下一場對戰
        this.canvas.addEventListener("pointerdown", () => {

      // 讓卡片裁切時對準臉部 (照片有直有橫，固定位置會切到頭)
      photoFocus(char) {
        const c = char.faceCrop;

        const fx = Math.round((c.sx + c.sw / 2) * 100);

      }

      selectChar(idx) {

            configureSpawnPositions(fighters) {
        const topY = this.currentMap.arenaTopY;
        const botY = this.currentMap.arenaBottomY;
        const midY = (topY + botY) / 2;
        const count = fighters.length;

        if (count <= 2) {
          fighters[0].spawnX = 200;
          fighters[0].spawnY = midY;
          fighters[0].spawnFacing = 1;
          if (fighters[1]) {
            fighters[1].spawnX = CONFIG.canvasWidth - 200 - CONFIG.playerWidth;
            fighters[1].spawnY = midY;
            fighters[1].spawnFacing = -1;
          }
        } else if (count === 3) {
          fighters[0].spawnX = 150; fighters[0].spawnY = topY + 42; fighters[0].spawnFacing = 1;
          fighters[1].spawnX = CONFIG.canvasWidth - 150 - CONFIG.playerWidth; fighters[1].spawnY = topY + 42; fighters[1].spawnFacing = -1;
          fighters[2].spawnX = (CONFIG.canvasWidth - CONFIG.playerWidth) / 2; fighters[2].spawnY = botY - 22; fighters[2].spawnFacing = 1;
        } else {
          fighters[0].spawnX = 145; fighters[0].spawnY = topY + 38; fighters[0].spawnFacing = 1;
          fighters[1].spawnX = CONFIG.canvasWidth - 145 - CONFIG.playerWidth; fighters[1].spawnY = topY + 38; fighters[1].spawnFacing = -1;
          fighters[2].spawnX = 240; fighters[2].spawnY = botY - 22; fighters[2].spawnFacing = 1;
          fighters[3].spawnX = CONFIG.canvasWidth - 240 - CONFIG.playerWidth; fighters[3].spawnY = botY - 22; fighters[3].spawnFacing = -1;
        }
      }

      startOnlineMatchFromRoom(room) {
        this.playMode = "online";
        this.mapIndex = Number.isInteger(room.mapIndex) ? room.mapIndex : 0;
        this.currentMap = MAP_TEMPLATES[this.mapIndex] || MAP_TEMPLATES[0];

        this.activeFighters = [];
        for (const pInfo of room.players) {
          const slot = pInfo.slot;
          const f = this.allFighters[slot - 1];
          if (!f) continue;
          f.isCOM = !!pInfo.isCOM;
          f.comDiffLabel = COM_DIFFICULTIES[pInfo.comDiff || "normal"]?.label || "普通";
          f.customNickname = pInfo.name || `${slot}P`;
          if (slot === 1) {
            f.controls = {
              up: ["KeyW", "ArrowUp"],
              left: ["KeyA", "ArrowLeft"],
              down: ["KeyS", "ArrowDown"],
              right: ["KeyD", "ArrowRight"],
              jump: ["KeyY", "Enter"],
              light: ["KeyF", "Comma"],
              heavy: ["KeyG", "Period"],
              dash: ["KeyH", "Slash"],
              ult: ["KeyT", "Semicolon", "KeyM"]
            };
          } else {
            f.controls = CANONICAL_NET_CONTROLS;
          }
          this.comAIs[slot].setDifficulty(pInfo.comDiff || "normal");
          f.setCharacter(CHARACTER_ROSTER[pInfo.charIndex] || CHARACTER_ROSTER[0]);
          f.wins = 0;
          this.activeFighters.push(f);
        }

        this.configureSpawnPositions(this.activeFighters);
        this.roundNumber = 1;
        this.matchWinner = null;

      startMatch() {
        this.currentMap = MAP_TEMPLATES[this.mapIndex];
        const diffLabel = COM_DIFFICULTIES[this.comDifficulty].label;
        this.comAI.setDifficulty(this.comDifficulty);
        for (let i = 1; i <= 4; i++) this.comAIs[i].setDifficulty(this.comDifficulty);

        this.p1.isCOM = false;
        this.p1.customNickname = "";
        this.p1.controls = { up: "KeyW", left: "KeyA", down: "KeyS", right: "KeyD", jump: "KeyY", light: "KeyF", heavy: "KeyG", dash: "KeyH", ult: "KeyT" };

        this.p2.isCOM = this.isComMode;
        this.p2.customNickname = "";
        this.p2.comDiffLabel = diffLabel;

returnToSelect() {
        this.scene = "select";
